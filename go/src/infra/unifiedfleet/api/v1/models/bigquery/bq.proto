message ChangeEventRow {
    models.ChangeEvent change_event = 1;
}

message ChromePlatformRow {
    models.ChromePlatform platform = 1;
    bool delete = 2;
}

message VlanRow {
    models.Vlan vlan = 1;
    bool delete = 2;
}

message MachineRow {
    models.Machine machine = 1;
    bool delete = 2;
}

message RackRow {
    models.Rack rack = 1;
    bool delete = 2;
}

message AssetRow {
    models.asset asset = 1;
    bool delete = 2;
}

message RackLSEPrototypeRow {
    models.RackLSEPrototype rack_lse_prototype = 1;
    bool delete = 2;
}

message MachineLSEPrototypeRow {
    models.MachineLSEPrototype machine_lse_prototype = 1;
    bool delete = 2;
}

message MachineLSERow {
    models.MachineLSE machine_lse = 1;
    bool delete = 2;
}

message VMRow {
    models.VM vm = 1;
    bool delete = 2;
}


message RackLSERow {
    models.RackLSE rack_lse = 1;
    bool delete = 2;
}

message StateRecordRow {
    models.StateRecord state_record = 1;
    bool delete = 2;
}

message KVMRow {
    models.KVM kvm = 1;
    bool delete = 2;
}

message RPMRow {
    models.RPM rpm = 1;
    bool delete = 2;
}

message SwitchRow {
    models.Switch switch = 1;
    bool delete = 2;
}

message DracRow {
    models.Drac drac = 1;
    bool delete = 2;
}

message NicRow {
    models.Nic nic = 1;
    bool delete = 2;
}

message DHCPConfigRow {
    models.DHCPConfig dhcp_config = 1;
    bool delete = 2;
}

message IPRow {
    models.IP ip = 1;
}

message DUTStateRecordRow {
    models.chromeos.lab.DutState state = 1;
}

message CachingServiceRow {
    models.CachingService caching_service = 1;
    bool delete = 2;
}

message MachineLSEDeploymentRow {
    models.MachineLSEDeployment machine_lse_deployment = 1;
    bool delete = 2;
}

message SchedulingUnitRow {
    models.SchedulingUnit scheduling_unit = 1;
    bool delete = 2;
}

// A HwidData row in BQ HwidData table.
message HwidDataRow {
    models.HwidData hwid_data = 1;
    bool delete = 2;
}

// A device config row in BQ device_config table.
message DeviceConfigRow {
    models.chromeos.device.Config device_config = 1;
}

// Latest DUT Info Table Schema
//
// Next tag: 36
message LatestDutInfoRow {
    google.protobuf.Timestamp update_timestamp = 1;
    string hostname = 2;
    string assetTag = 3;
    string serial_number = 4;
    string hwid = 5;
    string location_zone = 6;
    string hive = 7;
    string dut_state = 8;
    string dut_state_reason = 9;
    string board = 10;
    string model = 11;
    repeated string pool = 12;
    string phase = 13;
    bool is_cbx = 14;
    string has_servo = 15;
    string servo_hostname = 16;
    string servo_serial = 17;
    string servo_port = 18;
    string servo_usb_state = 19;
    string servo_fw_channel = 20;
    string servo_host_type = 21;
    string servo_type_raw = 22;
    string servo_state = 23;
    string rpm_hostname = 24;
    string rpm_outlet = 25;
    string switch_name = 26;
    string switch_port = 27;
    string storage_state = 28;
    string rpm_state = 29;
    string battery_state = 30;
    string wifi_state = 31;
    string bluetooth_state = 32;
    string dolos_state = 33;
    string os_type = 34;
    string os_version = 35;
}