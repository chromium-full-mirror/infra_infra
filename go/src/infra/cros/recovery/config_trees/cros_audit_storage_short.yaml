plans:
    - name: cros_base
      criticalactions:
        - name: 'Set state: needs_repair (''dut_set_state'')'
        - name: Start ADB-base ('ctr_start_adb_container') (time:'2m0s')
          conditions:
            - name: Do not run on Mobile Harness box ('env_is_not_mh_box') (RUN_ONCE)
            - name: CrosToolRunner is up ('ctr_is_up')
        - name: Start Servo-Nexus ('ctr_servo_nexus_start_container') (time:'4m0s')
          conditions:
            - name: Do not run on Mobile Harness box ('env_is_not_mh_box') (RUN_ONCE)
            - name: Testbed has Servo ('dut_servo_host_present') (RUN_ONCE)
            - name: CrosToolRunner is up ('ctr_is_up')
    - name: cros_audit
      criticalactions:
        - name: Device is pingable (simple) ('cros_ping') (ALWAYS_RUN) (time:'15s')
        - name: Mark DUT as Android if applicable ('cros_set_as_android_based')
          conditions:
            - name: Run if not restricted to ChromeOS only ('cros_not_match_os_restriction')
            - name: Mark as ChromeOS based ('cros_set_as_chrome_based') (ALWAYS_RUN)
            - name: Device is not accessible (simple) ('sample_fail') (ALWAYS_RUN)
              conditions:
                - name: Device is accessible (simple) ('cros_access') (ALWAYS_RUN) (time:'15s')
            - name: ADB Connect DUT ('ctr_adb_connect') (ALWAYS_RUN)
        - name: Audit storage ('sample_pass')
          conditions:
            - name: Is ChromeOS based? ('cros_is_not_android_based') (ALWAYS_RUN)
          dependencies:
            - name: Device is accessible (simple) ('cros_access') (ALWAYS_RUN) (time:'15s')
            - name: DUT has correct cros image version ('cros_is_on_stable_version')
              conditions:
                - name: Is it first deployment task ('sample_fail') (ALWAYS_RUN)
                  conditions:
                    - name: Is HWID known ('dut_has_hwid') (ALWAYS_RUN)
                    - name: Is serial-number known ('dut_has_serial_number') (ALWAYS_RUN)
                - name: Recovery version has OS image path ('has_stable_version_cros_image')
                  dependencies:
                    - name: Has a stable-version service ('has_stable_version_service_path') (RUN_ONCE)
                - name: Has a stable-version service ('has_stable_version_service_path') (RUN_ONCE)
              dependencies:
                - name: Device is accessible ('cros_access') (ALWAYS_RUN) (time:'15s')
                  recoveries:
                    - name: Cold reset by servo and wait for ping ('sample_pass') (ALWAYS_RUN)
                      conditions:
                        - name: Is servod running ('sample_pass') (ALWAYS_RUN)
                          dependencies:
                            - name: Setup has servo info ('dut_servo_host_present') (RUN_ONCE)
                            - name: Verify servod is responsive ('servod_echo') (ALWAYS_RUN) (time:'10s')
                              dependencies:
                                - name: Setup has servo info ('dut_servo_host_present') (RUN_ONCE)
