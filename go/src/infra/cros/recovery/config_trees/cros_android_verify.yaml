                      dependencies:
                        - name: Setup has servo info (RUN_ONCE)
                          exec_name: dut_servo_host_present
                - name: Is Android based by ADB or provision-info (ALWAYS_RUN)
                  exec_name: cros_is_previous_android_based_or_os_type
                  docs:
