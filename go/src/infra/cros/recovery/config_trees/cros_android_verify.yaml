plans:
    - name: cros_base
      criticalactions:
        - name: 'Set state: repair_failed'
          exec_name: dut_set_state
          exec_args:
            - state:repair_failed
          docs:
            - The action set devices with state means that repair tsk did not success to recover the devices.
        - name: Start ADB-base (time:'2m0s')
          exec_name: ctr_start_adb_container
          docs:
            - Pull and run adb-base container
          conditions:
            - name: Do not run on Mobile Harness box (RUN_ONCE)
              exec_name: env_is_not_mh_box
              docs:
                - Check that the process is not running on Mobile Harness box.
            - name: CrosToolRunner is up
              exec_name: ctr_is_up
              docs:
                - 'Verify that cros-tool-runner service is up and running, '
                - the tool expected to start as part of system preparation.
        - name: Start Servo-Nexus (time:'4m0s')
          exec_name: ctr_servo_nexus_start_container
          docs:
            - Pull and run servo-nexus container
          conditions:
            - name: Do not run on Mobile Harness box (RUN_ONCE)
              exec_name: env_is_not_mh_box
              docs:
                - Check that the process is not running on Mobile Harness box.
            - name: Testbed has Servo (RUN_ONCE)
              exec_name: dut_servo_host_present
            - name: CrosToolRunner is up
              exec_name: ctr_is_up
              docs:
                - 'Verify that cros-tool-runner service is up and running, '
                - the tool expected to start as part of system preparation.
    - name: cros
      criticalactions:
        - name: Mark as Android based (Allow to fail) (ALWAYS_RUN)
          exec_name: cros_set_as_android_based
          docs:
            - Mark DUT as Android based.
        - name: Set CacheService address (RUN_ONCE)
          exec_name: cache_service_address_detection
          exec_args:
            - cache_address:10.128.176.210:8082
          docs:
            - MH box does not have labservice, so we hard-code caceh addrress.
            - Remove when prototype developing finished
          conditions:
            - name: Execution on Mobile Harness box (RUN_ONCE)
              exec_name: env_is_mh_box
              docs:
                - Check that the process is running on Mobile Harness box.
        - name: Has repair-request for re-image USB-key
          exec_name: dut_has_any_repair_requests
          exec_args:
            - requests:UPDATE_USBKEY_IMAGE
          docs:
            - Check if UPDATE_USBKEY_IMAGE repair-request is present.
          recoveries:
            - name: Download stable image to USB-key (Allow to fail) (ALWAYS_RUN)
              exec_name: sample_pass
              docs:
                - Download lab stable image on servo USB-key
                - Download the image can take longer if labstation download parallel a few images.
                - This step is allowed to complete successfully even if some
                - ' errors happen during download because the image can already'
                - ' be present on the USB-drive.'
              dependencies:
                - name: Setup has servo info (RUN_ONCE)
                  exec_name: dut_servo_host_present
                - name: Is servo USB key detected
                  exec_name: servo_usbkey_is_detected
                  exec_args:
                    - file_check:true
                  docs:
                    - The action used as codiion.
                    - The action verify that USB-key is detected and readable.
                  dependencies:
                    - name: Is servod running (ALWAYS_RUN)
                      exec_name: sample_pass
                      docs:
                        - Verify that servo host specified in setup and servod is running.
                      dependencies:
                        - name: Setup has servo info (RUN_ONCE)
                          exec_name: dut_servo_host_present
                        - name: Verify servod is responsive (ALWAYS_RUN) (time:'10s')
                          exec_name: servod_echo
                          exec_args:
                            - ssh_check:false
                          dependencies:
                            - name: Setup has servo info (RUN_ONCE)
                              exec_name: dut_servo_host_present
                - name: Call servod to download image to USB-key (ALWAYS_RUN) (time:'50m0s')
                  exec_name: servo_download_image_to_usb
                  docs:
                    - This action calls servod to download stable version OS image to servo USB-key.
                - name: Remove UPDATE_USBKEY_IMAGE repair-request (ALWAYS_RUN)
                  exec_name: dut_remove_repair_requests
                  exec_args:
                    - requests:UPDATE_USBKEY_IMAGE
                  docs:
                    - Remove UPDATE_USBKEY_IMAGE from repair-requests.
            - name: Call servod to download image to USB-key (ALWAYS_RUN) (time:'50m0s')
              exec_name: servo_download_image_to_usb
              docs:
                - This action calls servod to download stable version OS image to servo USB-key.
        - name: Has repair-request for reflash-firmware
          exec_name: dut_has_any_repair_requests
          exec_args:
            - requests:REFLASH_FW
          docs:
            - Check if REFLASH_FW repair-request is present.
          recoveries:
            - name: Update FW from fw-image by servo and wait for boot
              exec_name: sample_pass
              docs:
                - 'This action will repair the firmware on the DUT, and '
                - 'then reboot and wait for the DUT to again become '
                - 'available. This action exists to wrap these component '
                - actions into a single repair action.
              conditions:
                - name: Can become ChromeOS-based (ALWAYS_RUN)
                  exec_name: dut_is_chromeos_hw
                  docs:
                    - Check if DUT can be provisioned to ChromeOS.
                    - Devices runngin under MH is not allowed.
                  dependencies:
                    - name: Do not run on Mobile Harness box (RUN_ONCE)
                      exec_name: env_is_not_mh_box
                      docs:
                        - Check that the process is not running on Mobile Harness box.
                    - name: Run if not restricted to Android only
                      exec_name: cros_not_match_os_restriction
                      exec_args:
                        - restrictions:OSR_ANDROID_ONLY
                      docs:
                        - OS does not limited by ChromeOS only
                - name: Run only on ChromeOS hardware (RUN_ONCE)
                  exec_name: dut_check_board
                  exec_args:
                    - string_values:aurora,reven
                    - invert_result:true
                  docs:
                    - Check that DUT is a Chromebook by checking for non-Chromebook boards
                - name: Is recovery-version has firmware image path
                  exec_name: has_stable_version_fw_image
                  docs:
                    - Verify that recovery version has firmware image path.
                  dependencies:
                    - name: Has a stable-version service (RUN_ONCE)
                      exec_name: has_stable_version_service_path
                      docs:
                        - Verify if we have access to the service provided access to the stable version
                - name: Is servod running (ALWAYS_RUN)
                  exec_name: sample_pass
                  docs:
                    - Verify that servo host specified in setup and servod is running.
                  dependencies:
                    - name: Setup has servo info (RUN_ONCE)
                      exec_name: dut_servo_host_present
                    - name: Verify servod is responsive (ALWAYS_RUN) (time:'10s')
                      exec_name: servod_echo
                      exec_args:
                        - ssh_check:false
                      dependencies:
                        - name: Setup has servo info (RUN_ONCE)
                          exec_name: dut_servo_host_present
              dependencies:
                - name: Flash EC (FW) by servo (allowed failed) (Allow to fail) (time:'1h50m0s')
                  exec_name: cros_update_fw_with_fw_image_by_servo
                  exec_args:
                    - update_ec_attempt_count:5
                    - download_timeout:600
                    - use_cache_extractor:true
                    - use_fw_targets_from_inventory:true
                  docs:
                    - Download fw-image specified in stable version and flash EC to the DUT by servo
                    - Set timeout for 110 minutes for now as = 10m(download)+4*20m(find/extract file)+20m(ec-update with retry).
                    - We will retry up to 5 times since there is flakiness on flash EC.
                  conditions:
                    - name: Is servod running (ALWAYS_RUN)
                      exec_name: sample_pass
                      docs:
                        - Verify that servo host specified in setup and servod is running.
                      dependencies:
                        - name: Setup has servo info (RUN_ONCE)
                          exec_name: dut_servo_host_present
                        - name: Verify servod is responsive (ALWAYS_RUN) (time:'10s')
                          exec_name: servod_echo
                          exec_args:
                            - ssh_check:false
                          dependencies:
                            - name: Setup has servo info (RUN_ONCE)
                              exec_name: dut_servo_host_present
                  dependencies:
                    - name: Is recovery-version has firmware image path
                      exec_name: has_stable_version_fw_image
                      docs:
                        - Verify that recovery version has firmware image path.
                      dependencies:
                        - name: Has a stable-version service (RUN_ONCE)
                          exec_name: has_stable_version_service_path
                          docs:
                            - Verify if we have access to the service provided access to the stable version
                - name: Sleep 120 seconds (Allow to fail) (ALWAYS_RUN) (time:'2m5s')
                  exec_name: sample_sleep
                  exec_args:
                    - sleep:120
                - name: Disable software write protection via servo (Allow to fail) (ALWAYS_RUN) (time:'1m0s')
                  exec_name: cros_disable_software_write_protection_by_servo
                  docs:
                    - Disable software write protection(for flash firmware) via servo.
                  dependencies:
                    - name: Is servod running (ALWAYS_RUN)
                      exec_name: sample_pass
                      docs:
                        - Verify that servo host specified in setup and servod is running.
                      dependencies:
                        - name: Setup has servo info (RUN_ONCE)
                          exec_name: dut_servo_host_present
                        - name: Verify servod is responsive (ALWAYS_RUN) (time:'10s')
                          exec_name: servod_echo
                          exec_args:
                            - ssh_check:false
                          dependencies:
                            - name: Setup has servo info (RUN_ONCE)
                              exec_name: dut_servo_host_present
                - name: Flash AP (FW) by servo with GBB (dev mode + USB boot) (Allow to fail) (time:'1h30m0s')
                  exec_name: cros_update_fw_with_fw_image_by_servo
                  exec_args:
                    - update_ap_attempt_count:3
                    - download_timeout:600
                    - gbb_flags:0x80000018
                    - use_cache_extractor:true
                    - use_fw_targets_from_inventory:true
                  docs:
                    - Download fw-image specified in stable version and flash AP to the DUT by servo
                    - Set timeout for 90 minutes for now as = 10m(download)+2*20m(find/extract file)+40m(ap-update with retry).
                    - We will retry up to 3 times since there may be flakiness on flash AP via servo.
                  conditions:
                    - name: Is servod running (ALWAYS_RUN)
                      exec_name: sample_pass
                      docs:
                        - Verify that servo host specified in setup and servod is running.
                      dependencies:
                        - name: Setup has servo info (RUN_ONCE)
                          exec_name: dut_servo_host_present
                        - name: Verify servod is responsive (ALWAYS_RUN) (time:'10s')
                          exec_name: servod_echo
                          exec_args:
                            - ssh_check:false
                          dependencies:
                            - name: Setup has servo info (RUN_ONCE)
                              exec_name: dut_servo_host_present
                  dependencies:
                    - name: Is recovery-version has firmware image path
                      exec_name: has_stable_version_fw_image
                      docs:
                        - Verify that recovery version has firmware image path.
                      dependencies:
                        - name: Has a stable-version service (RUN_ONCE)
                          exec_name: has_stable_version_service_path
                          docs:
                            - Verify if we have access to the service provided access to the stable version
                - name: Wait to be pingable (normal boot) (ALWAYS_RUN) (time:'2m30s')
                  exec_name: cros_ping
                  docs:
                    - Wait DUT to be pingable after some action on it.
                    - Waiting time 150 seconds.
                - name: Remove REFLASH_FW repair-request (ALWAYS_RUN)
                  exec_name: dut_remove_repair_requests
                  exec_args:
                    - requests:REFLASH_FW
                  docs:
                    - Remove REFLASH_FW repair-requests.
        - name: 'Android: Has repair-request for re-image by USB-key'
          exec_name: dut_has_any_repair_requests
          exec_args:
            - requests:REIMAGE_BY_USBKEY
          docs:
            - Check if REIMAGE_BY_USBKEY repair-request is present.
          recoveries:
            - name: Install Android OS by booting from servo USB-drive (ALWAYS_RUN)
              exec_name: sample_pass
              docs:
                - Use provision image on USB-key to boot and get SSH access.
                - Run specific install command to install Android OS.
                - The logic is copy from foil-provision
              conditions:
                - name: Run only on ChromeOS hardware (RUN_ONCE)
                  exec_name: dut_check_board
                  exec_args:
                    - string_values:aurora,reven
                    - invert_result:true
                  docs:
                    - Check that DUT is a Chromebook by checking for non-Chromebook boards
                - name: Is servod running (ALWAYS_RUN)
                  exec_name: sample_pass
                  docs:
                    - Verify that servo host specified in setup and servod is running.
                  dependencies:
                    - name: Setup has servo info (RUN_ONCE)
                      exec_name: dut_servo_host_present
                    - name: Verify servod is responsive (ALWAYS_RUN) (time:'10s')
                      exec_name: servod_echo
                      exec_args:
                        - ssh_check:false
                      dependencies:
                        - name: Setup has servo info (RUN_ONCE)
                          exec_name: dut_servo_host_present
                - name: Is Android based by ADB or provision-info (ALWAYS_RUN)
                  exec_name: cros_is_previous_android_based_or_os_type
                  docs:
                    - Validate that DUT has AndroidOS based on ADB connection or provisioned info.
                - name: Run for Android boards (RUN_ONCE)
                  exec_name: dut_check_board
                  exec_args:
                    - string_values:brya,corsola,dedede,fatcat,nissa,rauru
                  docs:
                    - Check that board support AndroidOS
                - name: Is servo USB key detected
                  exec_name: servo_usbkey_is_detected
                  exec_args:
                    - file_check:true
                  docs:
                    - The action used as codiion.
                    - The action verify that USB-key is detected and readable.
                  dependencies:
                    - name: Is servod running (ALWAYS_RUN)
                      exec_name: sample_pass
                      docs:
                        - Verify that servo host specified in setup and servod is running.
                      dependencies:
                        - name: Setup has servo info (RUN_ONCE)
                          exec_name: dut_servo_host_present
                        - name: Verify servod is responsive (ALWAYS_RUN) (time:'10s')
                          exec_name: servod_echo
                          exec_args:
                            - ssh_check:false
                          dependencies:
                            - name: Setup has servo info (RUN_ONCE)
                              exec_name: dut_servo_host_present
              dependencies:
                - name: Mark as Android based (Allow to fail) (ALWAYS_RUN)
                  exec_name: cros_set_as_android_based
                  docs:
                    - Mark DUT as Android based.
                - name: Detect CacheService address
                  exec_name: cache_service_address_detection
                  docs:
                    - Collect address of CacheService rom labService.
                  conditions:
                    - name: Do not run on Mobile Harness box (RUN_ONCE)
                      exec_name: env_is_not_mh_box
                      docs:
                        - Check that the process is not running on Mobile Harness box.
                - name: Call servod to download provision image to USB-key (ALWAYS_RUN) (time:'10m0s')
                  exec_name: servo_download_provision_image_to_usb
                  exec_args:
                    - image_version:v6.1.1
                  docs:
                    - This action calls servod to download provision image custom kernel to servo USB-key.
                - name: Boot on USB-key and install AndroidOS (ALWAYS_RUN) (time:'2h46m40s')
                  exec_name: cros_provision_actions_from_recovery_mode
                  exec_args:
                    - run_android_install:true
                    - run_cros_install:false
                    - reset_tpm:true
                    - boot_timeout:150
                    - boot_interval:10
                    - boot_retry:1
                    - install_timeout:1200
                    - ignore_reboot_failure:true
                    - after_reboot_check:true
                    - after_reboot_timeout:240
                    - after_reboot_allow_use_servo_reset:true
                  docs:
                    - 'This action installs the test image on DUT utilizing '
                    - 'the features of servo. DUT will be booted in recovery '
                    - 'mode. In some cases RO FW is not allowed to boot in '
                    - 'recovery mode with active PD, so we will change it to '
                    - sink-mode if required.
                - name: Wait to be pingable (long boot) (ALWAYS_RUN) (time:'5m0s')
                  exec_name: cros_ping
                  docs:
                    - Wait DUT to be pingable after some action on it.
                    - Waiting time 300 seconds.
                - name: ADB reconnect (ALWAYS_RUN)
                  exec_name: ctr_adb_connect
                  exec_args:
                    - retry_count:3
                    - retry_interval:1
                    - timeout:10
                    - skip_when_connected:true
                  docs:
                    - Connect to DUT by ADB if not connected.
                    - Only executed if DUT is Android based.
                  conditions:
                    - name: Is Android based on previous DUT OS
                      exec_name: cros_is_previous_android_os_type
                      docs:
                        - Validate that OS on the DUT was provisioned with Android.
                - name: ADB set Android as always awake (ALWAYS_RUN)
                  exec_name: ctr_make_awake_always
                  docs:
                    - Set Android to be awake always.
                - name: Remove REIMAGE_BY_USBKEY repair-request (ALWAYS_RUN)
                  exec_name: dut_remove_repair_requests
                  exec_args:
                    - requests:PROVISION,REIMAGE_BY_USBKEY
                  docs:
                    - Remove REIMAGE_BY_USBKEY and PROVISION repair-requests.
            - name: Update FW and install Android OS from servo USB-drive (ALWAYS_RUN)
              exec_name: sample_pass
              docs:
                - Use provision image on USB-key to boot and get SSH access.
                - Run specific install command to install Android OS.
                - The logic is copy from foil-provision
              conditions:
                - name: Run only on ChromeOS hardware (RUN_ONCE)
                  exec_name: dut_check_board
                  exec_args:
                    - string_values:aurora,reven
                    - invert_result:true
