        - name: Reset provisioned info (ALWAYS_RUN)
          exec_name: cros_reset_provision_info
          docs:
            - Reset all provision info.
        - name: All repair-requests resolved
          exec_name: dut_has_no_repair_requests
          docs:
            - Checks if all repair requests are resolved
        - name: Reset DUT-state reason
          exec_name: dut_reset_state_reason
          docs:
            - Reset DUT-state-reason for good DUT as it becomes stale.
        - name: Servo is in WORKING state
          exec_name: servo_match_state
          exec_args:
            - state:WORKING
          docs:
            - Some pool requires servo on WORKING state.
            - This action does not have any recovery actions.
          conditions:
            - name: Pools require Servo in WORKING state (RUN_ONCE)
              exec_name: dut_is_in_pool
              exec_args:
                - faft-cr50
                - faft-cr50-debug
                - faft-cr50-tot
                - faft-experimental
                - faft-test
                - satlab_faft
              docs:
                - List of pools that require a good servo.
        - name: 'Set state: ready (RUN_ONCE)'
          exec_name: dut_set_state
          exec_args:
            - state:ready
          docs:
            - The action set devices with state ready for the testing.
          dependencies:
            - name: All repair-requests resolved
              exec_name: dut_has_no_repair_requests
              docs:
                - Checks if all repair requests are resolved
            - name: Reset DUT-state reason
              exec_name: dut_reset_state_reason
              docs:
                - Reset DUT-state-reason for good DUT as it becomes stale.
