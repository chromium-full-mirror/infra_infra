plans:
    - name: cros_base
      criticalactions:
        - name: 'Set state: needs_repair'
          exec_name: dut_set_state
          exec_args:
            - state:needs_repair
          docs:
            - The action set devices with state means that DUT requires repair.
        - name: Start ADB-base (time:'2m0s')
          exec_name: ctr_start_adb_container
          docs:
            - Pull and run adb-base container
          conditions:
            - name: Do not run on Mobile Harness box (RUN_ONCE)
              exec_name: env_is_not_mh_box
              docs:
                - Check that the process is not running on Mobile Harness box.
            - name: CrosToolRunner is up
              exec_name: ctr_is_up
              docs:
                - 'Verify that cros-tool-runner service is up and running, '
                - the tool expected to start as part of system preparation.
        - name: Start Servo-Nexus (time:'4m0s')
          exec_name: ctr_servo_nexus_start_container
          docs:
            - Pull and run servo-nexus container
          conditions:
            - name: Do not run on Mobile Harness box (RUN_ONCE)
              exec_name: env_is_not_mh_box
              docs:
                - Check that the process is not running on Mobile Harness box.
            - name: Testbed has Servo (RUN_ONCE)
              exec_name: dut_servo_host_present
            - name: CrosToolRunner is up
              exec_name: ctr_is_up
              docs:
                - 'Verify that cros-tool-runner service is up and running, '
                - the tool expected to start as part of system preparation.
    - name: cros
      criticalactions:
        - name: Mark as Android based (Allow to fail) (ALWAYS_RUN)
          exec_name: cros_set_as_android_based
          docs:
            - Mark DUT as Android based.
        - name: Set CacheService address (RUN_ONCE)
          exec_name: cache_service_address_detection
          exec_args:
            - cache_address:10.128.176.210:8082
          docs:
            - MH box does not have labservice, so we hard-code caceh addrress.
            - Remove when prototype developing finished
          conditions:
            - name: Execution on Mobile Harness box (RUN_ONCE)
              exec_name: env_is_mh_box
              docs:
                - Check that the process is running on Mobile Harness box.
        - name: Has repair-request for re-image USB-key
          exec_name: dut_has_any_repair_requests
          exec_args:
            - requests:UPDATE_USBKEY_IMAGE
          docs:
            - Check if UPDATE_USBKEY_IMAGE repair-request is present.
        - name: Has repair-request for reflash-firmware
          exec_name: dut_has_any_repair_requests
          exec_args:
            - requests:REFLASH_FW
          docs:
            - Check if REFLASH_FW repair-request is present.
        - name: 'Android: Has repair-request for re-image by USB-key'
          exec_name: dut_has_any_repair_requests
          exec_args:
            - requests:REIMAGE_BY_USBKEY
          docs:
            - Check if REIMAGE_BY_USBKEY repair-request is present.
        - name: Android:Device is pingable (ALWAYS_RUN) (time:'15s')
          exec_name: cros_ping
          docs:
            - Verify that device is pingable.
            - Limited to 15 seconds.
            - Only for Mobile Harness box execution.
        - name: ADB Connect DUT (ALWAYS_RUN)
          exec_name: ctr_adb_connect
          exec_args:
            - retry_count:3
            - retry_interval:1
            - timeout:10
            - skip_when_connected:true
          docs:
            - Exec ADB connect to the DUT by ethernet.
        - name: Android is accessible (ALWAYS_RUN) (time:'15s')
          exec_name: cros_access
          docs:
            - Validate is Andoid OS is accessible by reading data from the host.
        - name: ADB set Android as always awake (ALWAYS_RUN)
          exec_name: ctr_make_awake_always
          docs:
            - Set Android to be awake always.
        - name: 'Android: Collect logs (Allow to fail) (RUN_ONCE)'
          exec_name: sample_pass
          docs:
            - 'We collect any pre-existing logs from before deletes such logs '
            - 'on the DUT. Any logs collection are not critical, and we marks '
            - that action attempt to perform to avoid repeating it.
          conditions:
            - name: Android:Device is pingable (ALWAYS_RUN) (time:'15s')
              exec_name: cros_ping
              docs:
                - Verify that device is pingable.
                - Limited to 15 seconds.
                - Only for Mobile Harness box execution.
            - name: Android is accessible (ALWAYS_RUN) (time:'15s')
              exec_name: cros_access
              docs:
                - Validate is Andoid OS is accessible by reading data from the host.
            - name: Confirm log collection info does not exist
              exec_name: cros_confirm_file_not_exists
              exec_args:
                - target_file:log_collection_info
              docs:
                - 'We need to check whether the log collection info file already '
                - 'exists in the file system. A pre-existing file indicates that '
                - 'the collection of any pre-existing logs has already been '
                - tried to be collected.
          dependencies:
            - name: Create log collection info (RUN_ONCE)
              exec_name: cros_create_log_collection_info
              exec_args:
                - info_file:log_collection_info
              docs:
                - 'When the log collection completes, we create an info file that '
                - indicates the successful completion of the collection process.
              conditions:
                - name: Confirm log collection info does not exist
                  exec_name: cros_confirm_file_not_exists
                  exec_args:
                    - target_file:log_collection_info
                  docs:
                    - 'We need to check whether the log collection info file already '
                    - 'exists in the file system. A pre-existing file indicates that '
                    - 'the collection of any pre-existing logs has already been '
                    - tried to be collected.
            - name: 'Android: Collect dmesg logs from DUT (Allow to fail)'
              exec_name: cros_dmesg
              exec_args:
                - device_type:dut
                - human_readable:false
              docs:
                - Collect the entire output of dmesg
        - name: Read bootId
          exec_name: cros_read_bootid
          exec_args:
            - skip_empty:true
            - publish:true
          docs:
            - Read bootid and public to config scope.
        - name: Device Uptime (Allow to fail)
          exec_name: cros_uptime_print
          docs:
            - Print uptime of the DUT.
        - name: 'Android: Has repair-request for re-provision'
          exec_name: dut_has_any_repair_requests
          exec_args:
            - requests:PROVISION
          docs:
            - Check if PROVISION repair-request is present.
        - name: Provision to stable-version if required
          exec_name: android_is_on_os_stable_version
          docs:
            - Provision to stable-version for stable-version required pools.
          conditions:
            - name: Is Android based? (ALWAYS_RUN)
              exec_name: cros_is_android_based
            - name: Is in stable version required pools (RUN_ONCE)
              exec_name: dut_is_in_pool
              exec_args:
                - chrome
                - chrome.tests
                - chrome.tests.gpu
                - chrome.tests.osnext
                - chrome.tests.perf
              docs:
                - Verify device is in pools which require to be on stable version.
        - name: Verify by host that DUT has default GBB flags
          exec_name: cros_has_default_gbb_flags
          docs:
            - Check if the device booted with default GBB flags.
          conditions:
            - name: Run only on ChromeOS hardware (RUN_ONCE)
              exec_name: dut_check_board
              exec_args:
                - string_values:aurora,reven
                - invert_result:true
              docs:
                - Check that DUT is a Chromebook by checking for non-Chromebook boards
            - name: Pools required to be in Secure mode (RUN_ONCE)
              exec_name: sample_fail
              docs:
                - Verify that DUT need to be in Secure mode.
              conditions:
                - name: Pools allowed to stay in DEV mode (RUN_ONCE)
                  exec_name: dut_is_in_pool
                  exec_args:
                    - keep_dev_mode
                    - mp_firmware_testing
                  docs:
                    - Verify that pools are allowed to stay in DEV mode.
        - name: Verify that DUT is not in DEV mode
          exec_name: cros_is_not_in_dev_mode
          docs:
            - Verify that devices is not in DEV mode.
            - Mostly devices in the lab required to be in Secure mode, not DEV mode.
          conditions:
            - name: Run only on ChromeOS hardware (RUN_ONCE)
              exec_name: dut_check_board
              exec_args:
                - string_values:aurora,reven
                - invert_result:true
              docs:
                - Check that DUT is a Chromebook by checking for non-Chromebook boards
            - name: Pools required to be in Secure mode (RUN_ONCE)
              exec_name: sample_fail
              docs:
                - Verify that DUT need to be in Secure mode.
              conditions:
                - name: Pools allowed to stay in DEV mode (RUN_ONCE)
                  exec_name: dut_is_in_pool
                  exec_args:
                    - keep_dev_mode
                    - mp_firmware_testing
                  docs:
                    - Verify that pools are allowed to stay in DEV mode.
        - name: Missing HWID
          exec_name: sample_fail
          docs:
            - Verify if device missing HWID because deployment was skipped.
          conditions:
            - name: Run only on ChromeOS hardware (RUN_ONCE)
              exec_name: dut_check_board
              exec_args:
                - string_values:aurora,reven
                - invert_result:true
              docs:
                - Check that DUT is a Chromebook by checking for non-Chromebook boards
            - name: Run only in main lab
              exec_name: sample_fail
              docs:
                - Verify that DUT name is in main lab.
              conditions:
                - name: Run only on Satlab
                  exec_name: dut_regex_name_match
                  exec_args:
                    - regex:^satlab
                  docs:
                    - Verify that DUT name is belong Satlab.
            - name: Is HWID empty (ALWAYS_RUN)
              exec_name: sample_fail
              docs:
                - Check whether the DUT information includes its HWID.
              conditions:
                - name: Is HWID known (ALWAYS_RUN)
                  exec_name: dut_has_hwid
                  docs:
                    - Check whether the DUT information includes its HWID.
          dependencies:
            - name: 'Set state: needs_deploy'
              exec_name: dut_set_state
              exec_args:
                - state:needs_deploy
              docs:
                - The action set devices with request to be redeployed.
        - name: Match HWID (Allow to fail)
          exec_name: cros_match_hwid_to_inventory
          docs:
            - Match HWID to value in inventory
            - Allowed to fail if HWID is not matched
          conditions:
            - name: Run only on ChromeOS hardware (RUN_ONCE)
              exec_name: dut_check_board
              exec_args:
                - string_values:aurora,reven
                - invert_result:true
              docs:
                - Check that DUT is a Chromebook by checking for non-Chromebook boards
            - name: Is HWID known (ALWAYS_RUN)
              exec_name: dut_has_hwid
              docs:
                - Check whether the DUT information includes its HWID.
        - name: Missing serial-number
          exec_name: sample_fail
          docs:
            - Verify if device missing serial number because deployment was skipped.
          conditions:
            - name: Run only on ChromeOS hardware (RUN_ONCE)
              exec_name: dut_check_board
              exec_args:
                - string_values:aurora,reven
                - invert_result:true
              docs:
                - Check that DUT is a Chromebook by checking for non-Chromebook boards
            - name: Run only in main lab
              exec_name: sample_fail
              docs:
                - Verify that DUT name is in main lab.
              conditions:
                - name: Run only on Satlab
                  exec_name: dut_regex_name_match
                  exec_args:
                    - regex:^satlab
                  docs:
                    - Verify that DUT name is belong Satlab.
            - name: Is serial-number empty (ALWAYS_RUN)
              exec_name: sample_fail
              docs:
                - 'Check whether the DUT information includes its '
                - serial number.
              conditions:
                - name: Is serial-number known (ALWAYS_RUN)
                  exec_name: dut_has_serial_number
                  docs:
                    - 'Check whether the DUT information includes its '
                    - serial number.
          dependencies:
            - name: 'Set state: needs_deploy'
              exec_name: dut_set_state
              exec_args:
                - state:needs_deploy
              docs:
                - The action set devices with request to be redeployed.
        - name: Match serial-number (Allow to fail)
          exec_name: cros_match_serial_number_inventory
          docs:
            - Match serial number to value in inventory
          conditions:
            - name: Run only on ChromeOS hardware (RUN_ONCE)
              exec_name: dut_check_board
              exec_args:
                - string_values:aurora,reven
                - invert_result:true
              docs:
                - Check that DUT is a Chromebook by checking for non-Chromebook boards
            - name: Is serial-number known (ALWAYS_RUN)
              exec_name: dut_has_serial_number
              docs:
                - 'Check whether the DUT information includes its '
                - serial number.
        - name: Reset provisioned info (ALWAYS_RUN)
          exec_name: cros_reset_provision_info
          docs:
            - Reset all provision info.
        - name: All repair-requests resolved
          exec_name: dut_has_no_repair_requests
          docs:
            - Checks if all repair requests are resolved
        - name: Reset DUT-state reason
          exec_name: dut_reset_state_reason
          docs:
            - Reset DUT-state-reason for good DUT as it becomes stale.
        - name: Servo is in WORKING state
          exec_name: servo_match_state
          exec_args:
            - state:WORKING
          docs:
            - Some pool requires servo on WORKING state.
            - This action does not have any recovery actions.
          conditions:
            - name: Pools require Servo in WORKING state (RUN_ONCE)
              exec_name: dut_is_in_pool
              exec_args:
                - faft-cr50
                - faft-cr50-debug
                - faft-cr50-tot
                - faft-experimental
                - faft-test
                - satlab_faft
                - need_healthy_servo
              docs:
                - List of pools that require a good servo.
        - name: 'Set state: ready (RUN_ONCE)'
          exec_name: dut_set_state
          exec_args:
            - state:ready
          docs:
            - The action set devices with state ready for the testing.
          dependencies:
            - name: All repair-requests resolved
              exec_name: dut_has_no_repair_requests
              docs:
                - Checks if all repair requests are resolved
            - name: Reset DUT-state reason
              exec_name: dut_reset_state_reason
              docs:
                - Reset DUT-state-reason for good DUT as it becomes stale.
