plans:
    - name: cros
      criticalactions:
        - name: 'Set state: repair_failed (''dut_set_state'')'
        - name: Collect logs (before) (Allow to fail) ('sample_pass') (RUN_ONCE)
          conditions:
            - name: Device is SSHable ('cros_access') (ALWAYS_RUN) (time:'30s')
            - name: Confirm log collection info does not exist (before) ('cros_confirm_file_not_exists')
          dependencies:
            - name: Create log collection info (before) ('cros_create_log_collection_info') (RUN_ONCE)
              conditions:
                - name: Confirm log collection info does not exist (before) ('cros_confirm_file_not_exists')
            - name: Copy messages (before) (Allow to fail) ('cros_copy_to_logs')
            - name: Copy eventlog.txt (before) (Allow to fail) ('cros_copy_to_logs')
            - name: Collect dmesg (before) (Allow to fail) ('cros_dmesg') (RUN_ONCE)
        - name: Device is SSHable ('cros_access') (ALWAYS_RUN) (time:'30s')
          recoveries:
            - name: Power cycle by RPM ('sample_pass') (ALWAYS_RUN)
              conditions:
                - name: rpm_action_enabled
                - name: has_rpm_info
              dependencies:
                - name: rpm_power_cycle
                - name: Wait to be SSHable ('cros_access') (ALWAYS_RUN) (time:'10m0s')
                - name: Start system services (Allow to fail) ('cros_run_command') (ALWAYS_RUN)
                  dependencies:
                    - name: Device is SSHable ('cros_access') (ALWAYS_RUN) (time:'30s')
                - name: Remove reboot requests (Allow to fail) ('cros_remove_all_reboot_request')
            - name: Power cycle by RPM with long delay ('sample_pass') (ALWAYS_RUN)
              conditions:
                - name: has_rpm_info
              dependencies:
                - name: Power off by RPM (Allow to fail) ('rpm_power_off') (ALWAYS_RUN) (time:'2m0s')
                  conditions:
                    - name: rpm_action_enabled
                    - name: has_rpm_info
                - name: Sleep 1 minute (Allow to fail) ('sample_sleep') (ALWAYS_RUN) (time:'1m10s')
                - name: Power on by RPM ('rpm_power_on') (ALWAYS_RUN) (time:'2m0s')
                  conditions:
                    - name: rpm_action_enabled
                    - name: has_rpm_info
                - name: Wait to be SSHable ('cros_access') (ALWAYS_RUN) (time:'10m0s')
                - name: Start system services (Allow to fail) ('cros_run_command') (ALWAYS_RUN)
                  dependencies:
                    - name: Device is SSHable ('cros_access') (ALWAYS_RUN) (time:'30s')
                - name: Remove reboot requests (Allow to fail) ('cros_remove_all_reboot_request')
        - name: System services is up ('cros_wait_for_system')
          dependencies:
            - name: Device is SSHable ('cros_access') (ALWAYS_RUN) (time:'30s')
              recoveries:
                - name: Power cycle by RPM ('sample_pass') (ALWAYS_RUN)
                  conditions:
                    - name: rpm_action_enabled
                    - name: has_rpm_info
                  dependencies:
                    - name: rpm_power_cycle
                    - name: Wait to be SSHable ('cros_access') (ALWAYS_RUN) (time:'10m0s')
                    - name: Start system services (Allow to fail) ('cros_run_command') (ALWAYS_RUN)
                      dependencies:
                        - name: Device is SSHable ('cros_access') (ALWAYS_RUN) (time:'30s')
                    - name: Remove reboot requests (Allow to fail) ('cros_remove_all_reboot_request')
                - name: Power cycle by RPM with long delay ('sample_pass') (ALWAYS_RUN)
                  conditions:
                    - name: has_rpm_info
                  dependencies:
                    - name: Power off by RPM (Allow to fail) ('rpm_power_off') (ALWAYS_RUN) (time:'2m0s')
                      conditions:
                        - name: rpm_action_enabled
                        - name: has_rpm_info
                    - name: Sleep 1 minute (Allow to fail) ('sample_sleep') (ALWAYS_RUN) (time:'1m10s')
                    - name: Power on by RPM ('rpm_power_on') (ALWAYS_RUN) (time:'2m0s')
                      conditions:
                        - name: rpm_action_enabled
                        - name: has_rpm_info
                    - name: Wait to be SSHable ('cros_access') (ALWAYS_RUN) (time:'10m0s')
                    - name: Start system services (Allow to fail) ('cros_run_command') (ALWAYS_RUN)
                      dependencies:
                        - name: Device is SSHable ('cros_access') (ALWAYS_RUN) (time:'30s')
                    - name: Remove reboot requests (Allow to fail) ('cros_remove_all_reboot_request')
          recoveries:
            - name: Start system services (Allow to fail) ('cros_run_command') (ALWAYS_RUN)
              dependencies:
                - name: Device is SSHable ('cros_access') (ALWAYS_RUN) (time:'30s')
            - name: Sleep 1 minute (Allow to fail) ('sample_sleep') (ALWAYS_RUN) (time:'1m10s')
        - name: Clean up logs if necessary (Allow to fail) ('cros_log_clean_up')
        - name: Filesystem is writable (Allow to fail) ('cros_is_file_system_writable')
        - name: Is check_ethernet.hook disabled (Allow to fail) ('cros_run_shell_command')
          dependencies:
            - name: Device is SSHable ('cros_access') (ALWAYS_RUN) (time:'30s')
              recoveries:
                - name: Power cycle by RPM ('sample_pass') (ALWAYS_RUN)
                  conditions:
                    - name: rpm_action_enabled
                    - name: has_rpm_info
                  dependencies:
                    - name: rpm_power_cycle
                    - name: Wait to be SSHable ('cros_access') (ALWAYS_RUN) (time:'10m0s')
                    - name: Start system services (Allow to fail) ('cros_run_command') (ALWAYS_RUN)
                      dependencies:
                        - name: Device is SSHable ('cros_access') (ALWAYS_RUN) (time:'30s')
                    - name: Remove reboot requests (Allow to fail) ('cros_remove_all_reboot_request')
                - name: Power cycle by RPM with long delay ('sample_pass') (ALWAYS_RUN)
                  conditions:
                    - name: has_rpm_info
                  dependencies:
                    - name: Power off by RPM (Allow to fail) ('rpm_power_off') (ALWAYS_RUN) (time:'2m0s')
                      conditions:
                        - name: rpm_action_enabled
                        - name: has_rpm_info
                    - name: Sleep 1 minute (Allow to fail) ('sample_sleep') (ALWAYS_RUN) (time:'1m10s')
                    - name: Power on by RPM ('rpm_power_on') (ALWAYS_RUN) (time:'2m0s')
                      conditions:
                        - name: rpm_action_enabled
                        - name: has_rpm_info
                    - name: Wait to be SSHable ('cros_access') (ALWAYS_RUN) (time:'10m0s')
                    - name: Start system services (Allow to fail) ('cros_run_command') (ALWAYS_RUN)
                      dependencies:
                        - name: Device is SSHable ('cros_access') (ALWAYS_RUN) (time:'30s')
                    - name: Remove reboot requests (Allow to fail) ('cros_remove_all_reboot_request')
          recoveries:
            - name: Disable check_ethernet.hook ('cros_run_shell_command')
              dependencies:
                - name: Device is SSHable ('cros_access') (ALWAYS_RUN) (time:'30s')
        - name: Used Inodes percentage on stateful partition is lower than 50% ('cros_check_used_inode_percentage_lower_than_threshold')
          conditions:
            - name: Device is SSHable ('cros_access') (ALWAYS_RUN) (time:'30s')
          recoveries:
            - name: Powerwash repair labstation ('sample_pass')
              conditions:
                - name: Device is SSHable ('cros_access') (ALWAYS_RUN) (time:'30s')
                - name: Labstation not in auto-update exempted pool ('dut_not_in_pool') (RUN_ONCE)
              dependencies:
                - name: Write factory-install-reset to file system ('cros_run_shell_command')
                - name: Labstation reboot ('sample_pass') (ALWAYS_RUN)
                  dependencies:
                    - name: cros_stop_powerd (Allow to fail) ('cros_run_shell_command') (ALWAYS_RUN)
                    - name: cros_clean_tmp_owner_request (Allow to fail) (ALWAYS_RUN)
                    - name: cros_allowed_reboot
                    - name: Simple reboot ('cros_run_command') (ALWAYS_RUN)
                      conditions:
                        - name: cros_filesystem_io_not_blocked
                    - name: Sysrq reboot (Allow to fail) ('cros_run_shell_command') (ALWAYS_RUN)
                      conditions:
                        - name: Filesystem IO blocked ('sample_fail') (ALWAYS_RUN)
                          conditions:
                            - name: cros_filesystem_io_not_blocked
                    - name: Sleep 10s (Allow to fail) ('sample_sleep') (ALWAYS_RUN)
                    - name: Wait to be SSHable ('cros_access') (ALWAYS_RUN) (time:'10m0s')
                    - name: Start system services (Allow to fail) ('cros_run_command') (ALWAYS_RUN)
                      dependencies:
                        - name: Device is SSHable ('cros_access') (ALWAYS_RUN) (time:'30s')
                    - name: Remove reboot requests (Allow to fail) ('cros_remove_all_reboot_request')
                - name: Install stable labstation image without reboot ('cros_provision') (time:'1h0m0s')
                  conditions:
                    - name: has_stable_version_cros_image
                    - name: cros_kernel_priority_has_not_changed
                - name: Labstation reboot ('sample_pass') (ALWAYS_RUN)
                  dependencies:
                    - name: cros_stop_powerd (Allow to fail) ('cros_run_shell_command') (ALWAYS_RUN)
                    - name: cros_clean_tmp_owner_request (Allow to fail) (ALWAYS_RUN)
                    - name: cros_allowed_reboot
                    - name: Simple reboot ('cros_run_command') (ALWAYS_RUN)
                      conditions:
                        - name: cros_filesystem_io_not_blocked
                    - name: Sysrq reboot (Allow to fail) ('cros_run_shell_command') (ALWAYS_RUN)
                      conditions:
                        - name: Filesystem IO blocked ('sample_fail') (ALWAYS_RUN)
                          conditions:
                            - name: cros_filesystem_io_not_blocked
                    - name: Sleep 10s (Allow to fail) ('sample_sleep') (ALWAYS_RUN)
                    - name: Wait to be SSHable ('cros_access') (ALWAYS_RUN) (time:'10m0s')
                    - name: Start system services (Allow to fail) ('cros_run_command') (ALWAYS_RUN)
                      dependencies:
                        - name: Device is SSHable ('cros_access') (ALWAYS_RUN) (time:'30s')
                    - name: Remove reboot requests (Allow to fail) ('cros_remove_all_reboot_request')
        - name: Check servod dependencies ('cros_run_command')
          dependencies:
            - name: Device is SSHable ('cros_access') (ALWAYS_RUN) (time:'30s')
              recoveries:
                - name: Power cycle by RPM ('sample_pass') (ALWAYS_RUN)
                  conditions:
                    - name: rpm_action_enabled
                    - name: has_rpm_info
                  dependencies:
                    - name: rpm_power_cycle
                    - name: Wait to be SSHable ('cros_access') (ALWAYS_RUN) (time:'10m0s')
                    - name: Start system services (Allow to fail) ('cros_run_command') (ALWAYS_RUN)
                      dependencies:
                        - name: Device is SSHable ('cros_access') (ALWAYS_RUN) (time:'30s')
                    - name: Remove reboot requests (Allow to fail) ('cros_remove_all_reboot_request')
                - name: Power cycle by RPM with long delay ('sample_pass') (ALWAYS_RUN)
                  conditions:
                    - name: has_rpm_info
                  dependencies:
                    - name: Power off by RPM (Allow to fail) ('rpm_power_off') (ALWAYS_RUN) (time:'2m0s')
                      conditions:
                        - name: rpm_action_enabled
                        - name: has_rpm_info
                    - name: Sleep 1 minute (Allow to fail) ('sample_sleep') (ALWAYS_RUN) (time:'1m10s')
                    - name: Power on by RPM ('rpm_power_on') (ALWAYS_RUN) (time:'2m0s')
                      conditions:
                        - name: rpm_action_enabled
                        - name: has_rpm_info
                    - name: Wait to be SSHable ('cros_access') (ALWAYS_RUN) (time:'10m0s')
                    - name: Start system services (Allow to fail) ('cros_run_command') (ALWAYS_RUN)
                      dependencies:
                        - name: Device is SSHable ('cros_access') (ALWAYS_RUN) (time:'30s')
                    - name: Remove reboot requests (Allow to fail) ('cros_remove_all_reboot_request')
          recoveries:
            - name: Powerwash repair labstation ('sample_pass')
              conditions:
                - name: Device is SSHable ('cros_access') (ALWAYS_RUN) (time:'30s')
                - name: Labstation not in auto-update exempted pool ('dut_not_in_pool') (RUN_ONCE)
              dependencies:
                - name: Write factory-install-reset to file system ('cros_run_shell_command')
                - name: Labstation reboot ('sample_pass') (ALWAYS_RUN)
                  dependencies:
                    - name: cros_stop_powerd (Allow to fail) ('cros_run_shell_command') (ALWAYS_RUN)
                    - name: cros_clean_tmp_owner_request (Allow to fail) (ALWAYS_RUN)
                    - name: cros_allowed_reboot
                    - name: Simple reboot ('cros_run_command') (ALWAYS_RUN)
                      conditions:
                        - name: cros_filesystem_io_not_blocked
                    - name: Sysrq reboot (Allow to fail) ('cros_run_shell_command') (ALWAYS_RUN)
                      conditions:
                        - name: Filesystem IO blocked ('sample_fail') (ALWAYS_RUN)
                          conditions:
                            - name: cros_filesystem_io_not_blocked
                    - name: Sleep 10s (Allow to fail) ('sample_sleep') (ALWAYS_RUN)
                    - name: Wait to be SSHable ('cros_access') (ALWAYS_RUN) (time:'10m0s')
                    - name: Start system services (Allow to fail) ('cros_run_command') (ALWAYS_RUN)
                      dependencies:
                        - name: Device is SSHable ('cros_access') (ALWAYS_RUN) (time:'30s')
                    - name: Remove reboot requests (Allow to fail) ('cros_remove_all_reboot_request')
                - name: Install stable labstation image without reboot ('cros_provision') (time:'1h0m0s')
                  conditions:
                    - name: has_stable_version_cros_image
                    - name: cros_kernel_priority_has_not_changed
                - name: Labstation reboot ('sample_pass') (ALWAYS_RUN)
                  dependencies:
                    - name: cros_stop_powerd (Allow to fail) ('cros_run_shell_command') (ALWAYS_RUN)
                    - name: cros_clean_tmp_owner_request (Allow to fail) (ALWAYS_RUN)
                    - name: cros_allowed_reboot
                    - name: Simple reboot ('cros_run_command') (ALWAYS_RUN)
                      conditions:
                        - name: cros_filesystem_io_not_blocked
                    - name: Sysrq reboot (Allow to fail) ('cros_run_shell_command') (ALWAYS_RUN)
                      conditions:
                        - name: Filesystem IO blocked ('sample_fail') (ALWAYS_RUN)
                          conditions:
                            - name: cros_filesystem_io_not_blocked
                    - name: Sleep 10s (Allow to fail) ('sample_sleep') (ALWAYS_RUN)
                    - name: Wait to be SSHable ('cros_access') (ALWAYS_RUN) (time:'10m0s')
                    - name: Start system services (Allow to fail) ('cros_run_command') (ALWAYS_RUN)
                      dependencies:
                        - name: Device is SSHable ('cros_access') (ALWAYS_RUN) (time:'30s')
                    - name: Remove reboot requests (Allow to fail) ('cros_remove_all_reboot_request')
        - name: cros_is_on_stable_version (Allow to fail)
          conditions:
            - name: has_stable_version_cros_image
            - name: cros_kernel_priority_has_not_changed
            - name: Labstation not in auto-update exempted pool ('dut_not_in_pool') (RUN_ONCE)
          recoveries:
            - name: Install stable labstation image without reboot ('cros_provision') (time:'1h0m0s')
              conditions:
                - name: has_stable_version_cros_image
                - name: cros_kernel_priority_has_not_changed
        - name: Update provisioned info (Allow to fail) ('cros_update_provision_info')
        - name: booted_from_right_kernel ('cros_kernel_priority_has_not_changed')
          conditions:
            - name: cros_has_no_servo_in_use
          recoveries:
            - name: Labstation reboot ('sample_pass') (ALWAYS_RUN)
              dependencies:
                - name: cros_stop_powerd (Allow to fail) ('cros_run_shell_command') (ALWAYS_RUN)
                - name: cros_clean_tmp_owner_request (Allow to fail) (ALWAYS_RUN)
                - name: cros_allowed_reboot
                - name: Simple reboot ('cros_run_command') (ALWAYS_RUN)
                  conditions:
                    - name: cros_filesystem_io_not_blocked
                - name: Sysrq reboot (Allow to fail) ('cros_run_shell_command') (ALWAYS_RUN)
                  conditions:
                    - name: Filesystem IO blocked ('sample_fail') (ALWAYS_RUN)
                      conditions:
                        - name: cros_filesystem_io_not_blocked
                - name: Sleep 10s (Allow to fail) ('sample_sleep') (ALWAYS_RUN)
                - name: Wait to be SSHable ('cros_access') (ALWAYS_RUN) (time:'10m0s')
                - name: Start system services (Allow to fail) ('cros_run_command') (ALWAYS_RUN)
                  dependencies:
                    - name: Device is SSHable ('cros_access') (ALWAYS_RUN) (time:'30s')
                - name: Remove reboot requests (Allow to fail) ('cros_remove_all_reboot_request')
            - name: Power cycle by RPM ('sample_pass') (ALWAYS_RUN)
              conditions:
                - name: rpm_action_enabled
                - name: has_rpm_info
              dependencies:
                - name: rpm_power_cycle
                - name: Wait to be SSHable ('cros_access') (ALWAYS_RUN) (time:'10m0s')
                - name: Start system services (Allow to fail) ('cros_run_command') (ALWAYS_RUN)
                  dependencies:
                    - name: Device is SSHable ('cros_access') (ALWAYS_RUN) (time:'30s')
                - name: Remove reboot requests (Allow to fail) ('cros_remove_all_reboot_request')
        - name: reboot_by_request ('sample_fail')
          conditions:
            - name: cros_has_reboot_request
            - name: cros_has_no_servo_in_use
            - name: labstation_uptime_6_hours ('cros_validate_uptime')
          recoveries:
            - name: Labstation reboot ('sample_pass') (ALWAYS_RUN)
              dependencies:
                - name: cros_stop_powerd (Allow to fail) ('cros_run_shell_command') (ALWAYS_RUN)
                - name: cros_clean_tmp_owner_request (Allow to fail) (ALWAYS_RUN)
                - name: cros_allowed_reboot
                - name: Simple reboot ('cros_run_command') (ALWAYS_RUN)
                  conditions:
                    - name: cros_filesystem_io_not_blocked
                - name: Sysrq reboot (Allow to fail) ('cros_run_shell_command') (ALWAYS_RUN)
                  conditions:
                    - name: Filesystem IO blocked ('sample_fail') (ALWAYS_RUN)
                      conditions:
                        - name: cros_filesystem_io_not_blocked
                - name: Sleep 10s (Allow to fail) ('sample_sleep') (ALWAYS_RUN)
                - name: Wait to be SSHable ('cros_access') (ALWAYS_RUN) (time:'10m0s')
                - name: Start system services (Allow to fail) ('cros_run_command') (ALWAYS_RUN)
                  dependencies:
                    - name: Device is SSHable ('cros_access') (ALWAYS_RUN) (time:'30s')
                - name: Remove reboot requests (Allow to fail) ('cros_remove_all_reboot_request')
            - name: Power cycle by RPM ('sample_pass') (ALWAYS_RUN)
              conditions:
                - name: rpm_action_enabled
                - name: has_rpm_info
              dependencies:
                - name: rpm_power_cycle
                - name: Wait to be SSHable ('cros_access') (ALWAYS_RUN) (time:'10m0s')
                - name: Start system services (Allow to fail) ('cros_run_command') (ALWAYS_RUN)
                  dependencies:
                    - name: Device is SSHable ('cros_access') (ALWAYS_RUN) (time:'30s')
                - name: Remove reboot requests (Allow to fail) ('cros_remove_all_reboot_request')
        - name: Reboot labstation if uptime longer than 7 days ('cros_validate_uptime')
          conditions:
            - name: cros_has_no_servo_in_use
          recoveries:
            - name: Labstation reboot ('sample_pass') (ALWAYS_RUN)
              dependencies:
                - name: cros_stop_powerd (Allow to fail) ('cros_run_shell_command') (ALWAYS_RUN)
                - name: cros_clean_tmp_owner_request (Allow to fail) (ALWAYS_RUN)
                - name: cros_allowed_reboot
                - name: Simple reboot ('cros_run_command') (ALWAYS_RUN)
                  conditions:
                    - name: cros_filesystem_io_not_blocked
                - name: Sysrq reboot (Allow to fail) ('cros_run_shell_command') (ALWAYS_RUN)
                  conditions:
                    - name: Filesystem IO blocked ('sample_fail') (ALWAYS_RUN)
                      conditions:
                        - name: cros_filesystem_io_not_blocked
                - name: Sleep 10s (Allow to fail) ('sample_sleep') (ALWAYS_RUN)
                - name: Wait to be SSHable ('cros_access') (ALWAYS_RUN) (time:'10m0s')
                - name: Start system services (Allow to fail) ('cros_run_command') (ALWAYS_RUN)
                  dependencies:
                    - name: Device is SSHable ('cros_access') (ALWAYS_RUN) (time:'30s')
                - name: Remove reboot requests (Allow to fail) ('cros_remove_all_reboot_request')
            - name: Power cycle by RPM ('sample_pass') (ALWAYS_RUN)
              conditions:
                - name: rpm_action_enabled
                - name: has_rpm_info
              dependencies:
                - name: rpm_power_cycle
                - name: Wait to be SSHable ('cros_access') (ALWAYS_RUN) (time:'10m0s')
                - name: Start system services (Allow to fail) ('cros_run_command') (ALWAYS_RUN)
                  dependencies:
                    - name: Device is SSHable ('cros_access') (ALWAYS_RUN) (time:'30s')
                - name: Remove reboot requests (Allow to fail) ('cros_remove_all_reboot_request')
        - name: Attempt to disable bluetooth adapter (Allow to fail) ('cros_run_shell_command')
        - name: Update GenesysLogic Firmware for all servo_v4.1 (Allow to fail) ('cros_update_genesys_logic_firmware') (time:'10m10s')
          dependencies:
            - name: Device is SSHable ('cros_access') (ALWAYS_RUN) (time:'30s')
              recoveries:
                - name: Power cycle by RPM ('sample_pass') (ALWAYS_RUN)
                  conditions:
                    - name: rpm_action_enabled
                    - name: has_rpm_info
                  dependencies:
                    - name: rpm_power_cycle
                    - name: Wait to be SSHable ('cros_access') (ALWAYS_RUN) (time:'10m0s')
                    - name: Start system services (Allow to fail) ('cros_run_command') (ALWAYS_RUN)
                      dependencies:
                        - name: Device is SSHable ('cros_access') (ALWAYS_RUN) (time:'30s')
                    - name: Remove reboot requests (Allow to fail) ('cros_remove_all_reboot_request')
                - name: Power cycle by RPM with long delay ('sample_pass') (ALWAYS_RUN)
                  conditions:
                    - name: has_rpm_info
                  dependencies:
                    - name: Power off by RPM (Allow to fail) ('rpm_power_off') (ALWAYS_RUN) (time:'2m0s')
                      conditions:
                        - name: rpm_action_enabled
                        - name: has_rpm_info
                    - name: Sleep 1 minute (Allow to fail) ('sample_sleep') (ALWAYS_RUN) (time:'1m10s')
                    - name: Power on by RPM ('rpm_power_on') (ALWAYS_RUN) (time:'2m0s')
                      conditions:
                        - name: rpm_action_enabled
                        - name: has_rpm_info
                    - name: Wait to be SSHable ('cros_access') (ALWAYS_RUN) (time:'10m0s')
                    - name: Start system services (Allow to fail) ('cros_run_command') (ALWAYS_RUN)
                      dependencies:
                        - name: Device is SSHable ('cros_access') (ALWAYS_RUN) (time:'30s')
                    - name: Remove reboot requests (Allow to fail) ('cros_remove_all_reboot_request')
        - name: Is crosid readable (Allow to fail) ('cros_run_command')
          conditions:
            - name: Device is SSHable ('cros_access') (ALWAYS_RUN) (time:'30s')
            - name: Is crosid present ('cros_run_command')
          recoveries:
            - name: Remove whitelabel_tag VPD field ('cros_run_command')
              conditions:
                - name: Device is SSHable ('cros_access') (ALWAYS_RUN) (time:'30s')
        - name: Update inventory info ('sample_pass')
          dependencies:
            - name: cros_update_hwid_to_inventory
            - name: Read serial number from labstation (Allow to fail) ('cros_update_serial_number_inventory')
        - name: 'Set state: ready (''dut_set_state'') (RUN_ONCE)'
          dependencies:
            - name: All repair-requests resolved ('dut_has_no_repair_requests')
            - name: Reset DUT-state reason ('dut_reset_state_reason')
        - name: Collect logs (after) (Allow to fail) ('sample_pass') (RUN_ONCE)
          conditions:
            - name: Device is SSHable ('cros_access') (ALWAYS_RUN) (time:'30s')
            - name: Confirm log collection info does not exist (after) ('cros_confirm_file_not_exists')
          dependencies:
            - name: Create log collection info (after) ('cros_create_log_collection_info') (RUN_ONCE)
              conditions:
                - name: Confirm log collection info does not exist (after) ('cros_confirm_file_not_exists')
            - name: Copy messages (after) (Allow to fail) ('cros_copy_to_logs')
            - name: Copy eventlog.txt (after) (Allow to fail) ('cros_copy_to_logs')
            - name: Collect dmesg (after) (Allow to fail) ('cros_dmesg') (RUN_ONCE)
