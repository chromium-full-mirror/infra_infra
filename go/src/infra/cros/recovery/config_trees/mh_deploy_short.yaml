plans:
    - name: cros_base
      criticalactions:
        - name: 'Set state: needs_deploy (''dut_set_state'')'
        - name: Start ADB-base ('ctr_start_adb_container') (time:'2m0s')
          conditions:
            - name: Do not run on Mobile Harness box ('env_is_not_mh_box') (RUN_ONCE)
            - name: CrosToolRunner is up ('ctr_is_up')
        - name: Start Servo-Nexus ('ctr_servo_nexus_start_container') (time:'4m0s')
          conditions:
            - name: Do not run on Mobile Harness box ('env_is_not_mh_box') (RUN_ONCE)
            - name: Testbed has Servo ('dut_servo_host_present') (RUN_ONCE)
            - name: CrosToolRunner is up ('ctr_is_up')
    - name: servo_fw_update
      criticalactions:
        - name: Set state:MISSING_CONFIG ('servo_set_servo_state') (ALWAYS_RUN)
        - name: Servo serial is specified ('dut_servo_has_serial') (RUN_ONCE)
          dependencies:
            - name: Set state:WRONG_CONFIG ('servo_set_servo_state') (ALWAYS_RUN)
        - name: Initialize docker container ('servo_host_servod_init') (time:'6m0s')
          conditions:
            - name: Uses servod container ('servo_uses_servod_container')
          dependencies:
            - name: Set state:NO_SSH ('servo_set_servo_state') (ALWAYS_RUN)
          recoveries:
            - name: Stop servod (Allow to fail) ('servo_host_servod_stop') (ALWAYS_RUN)
              dependencies:
                - name: Save UART capture (Allow to fail) ('servod_save_uart_capture')
                  dependencies:
                    - name: Stop UART capture (Allow to fail) ('servod_stop_uart_capture')
        - name: Device is SSHable ('cros_access') (ALWAYS_RUN) (time:'15s')
          dependencies:
            - name: Set state:NO_SSH ('servo_set_servo_state') (ALWAYS_RUN)
          recoveries:
            - name: Wait for labstation to load ('cros_access') (time:'2m0s')
        - name: Mark labstation as servod is in-use ('cros_create_servo_in_use')
          conditions:
            - name: Only applies to labstation ('servo_host_is_labstation')
          dependencies:
            - name: Device is SSHable ('cros_access') (ALWAYS_RUN) (time:'15s')
              dependencies:
                - name: Set state:NO_SSH ('servo_set_servo_state') (ALWAYS_RUN)
              recoveries:
                - name: Wait for labstation to load ('cros_access') (time:'2m0s')
            - name: Set state:SERVO_HOST_ISSUE ('servo_set_servo_state') (ALWAYS_RUN)
          recoveries:
            - name: Sleep 1s (Allow to fail) ('sample_sleep') (ALWAYS_RUN)
            - name: Create request to reboot labstation ('sample_fail') (ALWAYS_RUN)
              conditions:
                - name: Only applies to labstation ('servo_host_is_labstation')
              dependencies:
                - name: cros_create_reboot_request
        - name: Has enough free disk space ('cros_has_enough_storage_space')
          conditions:
            - name: Only runs for physical labstation ('servo_uses_servod_container')
          dependencies:
            - name: Device is SSHable ('cros_access') (ALWAYS_RUN) (time:'15s')
              dependencies:
                - name: Set state:NO_SSH ('servo_set_servo_state') (ALWAYS_RUN)
              recoveries:
                - name: Wait for labstation to load ('cros_access') (time:'2m0s')
            - name: Set state:BROKEN ('servo_set_servo_state') (ALWAYS_RUN)
          recoveries:
            - name: Remove logs and other files ('sample_pass')
              conditions:
                - name: Only applies to labstation ('servo_host_is_labstation')
              dependencies:
                - name: servo_labstation_disk_cleanup
                - name: Remove logs older 5 days ('servo_servod_old_logs_cleanup')
            - name: Create request to reboot labstation ('sample_fail') (ALWAYS_RUN)
              conditions:
                - name: Only applies to labstation ('servo_host_is_labstation')
              dependencies:
                - name: cros_create_reboot_request
        - name: Servo_v4(p1) main present ('servo_v4_root_present')
          dependencies:
            - name: Device is SSHable ('cros_access') (ALWAYS_RUN) (time:'15s')
              dependencies:
                - name: Set state:NO_SSH ('servo_set_servo_state') (ALWAYS_RUN)
              recoveries:
                - name: Wait for labstation to load ('cros_access') (time:'2m0s')
            - name: Set state:NOT_CONNECTED ('servo_set_servo_state') (ALWAYS_RUN)
          recoveries:
            - name: Recover servo with Power-cycle by smart-hub ('servo_power_cycle_root_servo') (ALWAYS_RUN) (time:'2m0s')
            - name: Create request to reboot labstation ('sample_fail') (ALWAYS_RUN)
              conditions:
                - name: Only applies to labstation ('servo_host_is_labstation')
              dependencies:
                - name: cros_create_reboot_request
        - name: All servo's fw updated ('servo_fw_need_update') (time:'5m0s')
          dependencies:
            - name: Device is SSHable ('cros_access') (ALWAYS_RUN) (time:'15s')
              dependencies:
                - name: Set state:NO_SSH ('servo_set_servo_state') (ALWAYS_RUN)
              recoveries:
                - name: Wait for labstation to load ('cros_access') (time:'2m0s')
            - name: Set state:SERVO_UPDATER_ISSUE ('servo_set_servo_state') (ALWAYS_RUN)
          recoveries:
            - name: Sleep 1s (Allow to fail) ('sample_sleep') (ALWAYS_RUN)
            - name: Update all servo's firmware ('servo_update_servo_firmware') (RUN_ONCE) (time:'10m0s')
              dependencies:
                - name: Stop servod daemon on servo-host ('servo_host_servod_init') (time:'6m0s')
        - name: Start servod daemon with recovery ('servo_host_servod_init') (time:'2m0s')
          recoveries:
            - name: Stop servod (Allow to fail) ('servo_host_servod_stop') (ALWAYS_RUN)
              dependencies:
                - name: Save UART capture (Allow to fail) ('servod_save_uart_capture')
                  dependencies:
                    - name: Stop UART capture (Allow to fail) ('servod_stop_uart_capture')
            - name: Create request to reboot labstation ('sample_fail') (ALWAYS_RUN)
              conditions:
                - name: Only applies to labstation ('servo_host_is_labstation')
              dependencies:
                - name: cros_create_reboot_request
        - name: Servo Poweron Default Set (Allow to fail) ('servo_set_poweron_defaults')
          conditions:
            - name: is_servo_v4p1
        - name: Stop servod (Allow to fail) ('servo_host_servod_stop') (ALWAYS_RUN)
          dependencies:
            - name: Save UART capture (Allow to fail) ('servod_save_uart_capture')
              dependencies:
                - name: Stop UART capture (Allow to fail) ('servod_stop_uart_capture')
    - name: dolos (Allow to fail)
      criticalactions:
        - name: Set dolos state:DOLOS_NOT_PRESENT ('dolos_set_dolos_state') (ALWAYS_RUN)
        - name: Is Dolos present ('dolos_is_enabled')
        - name: Device is sshable ('cros_access') (time:'30s')
          dependencies:
            - name: Set dolos state:NO_SSH ('dolos_set_dolos_state') (ALWAYS_RUN)
            - name: Device is pingable ('cros_ping') (time:'15s')
        - name: Uartname is known (Allow to fail) ('dolos_is_uartname_cached')
          dependencies:
            - name: Is Dolos present ('dolos_is_enabled')
          recoveries:
            - name: Discover uartname and save to cache ('dolos_update_uartname_cache')
              dependencies:
                - name: Device is sshable ('cros_access') (time:'30s')
                  dependencies:
                    - name: Set dolos state:NO_SSH ('dolos_set_dolos_state') (ALWAYS_RUN)
                    - name: Device is pingable ('cros_ping') (time:'15s')
                - name: Is Dolos present ('dolos_is_enabled')
        - name: Check firmware version is correct. (Allow to fail) ('dolos_check_firmware_up_to_date')
          recoveries:
            - name: dolos_update_firmware
        - name: Update state ('dolos_determine_and_set_dolos_state')
        - name: Dolos does not needs reboot ('dolos_does_not_need_reboot')
          recoveries:
            - name: Reboot dolos ('sample_pass')
              dependencies:
                - name: Set dut RPM OFF ('device_rpm_power_off') (ALWAYS_RUN)
                - name: Set dolos RPM OFF ('device_rpm_power_off') (ALWAYS_RUN)
                - name: Sleep 5s (Allow to fail) ('sample_sleep') (ALWAYS_RUN)
                - name: Power cycle root servo (Allow to fail) ('servo_power_cycle_root_servo') (ALWAYS_RUN)
                - name: Set dolos RPM ON ('device_rpm_power_on') (ALWAYS_RUN)
                - name: Set dut RPM ON ('device_rpm_power_on') (ALWAYS_RUN)
                - name: Sleep 20s (Allow to fail) ('sample_sleep') (ALWAYS_RUN)
    - name: servo
      criticalactions:
        - name: Set state:MISSING_CONFIG ('servo_set_servo_state') (ALWAYS_RUN)
        - name: Servod port specified ('servo_servod_port_present') (RUN_ONCE)
          dependencies:
            - name: Set state:WRONG_CONFIG ('servo_set_servo_state') (ALWAYS_RUN)
        - name: Servo serial is specified ('dut_servo_has_serial') (RUN_ONCE)
          dependencies:
            - name: Set state:WRONG_CONFIG ('servo_set_servo_state') (ALWAYS_RUN)
        - name: Initialize docker container ('servo_host_servod_init') (time:'6m0s')
          conditions:
            - name: Uses servod container ('servo_uses_servod_container')
          dependencies:
            - name: Set state:NO_SSH ('servo_set_servo_state') (ALWAYS_RUN)
          recoveries:
            - name: Stop servod (Allow to fail) ('servo_host_servod_stop') (ALWAYS_RUN)
              dependencies:
                - name: Save UART capture (Allow to fail) ('servod_save_uart_capture')
                  dependencies:
                    - name: Stop UART capture (Allow to fail) ('servod_stop_uart_capture')
        - name: Device is SSHable ('cros_access') (ALWAYS_RUN) (time:'15s')
          dependencies:
            - name: Set state:NO_SSH ('servo_set_servo_state') (ALWAYS_RUN)
          recoveries:
            - name: Wait for labstation to load ('cros_access') (time:'2m0s')
        - name: Mark labstation as servod is in-use ('cros_create_servo_in_use')
          conditions:
            - name: Only applies to labstation ('servo_host_is_labstation')
          dependencies:
            - name: Device is SSHable ('cros_access') (ALWAYS_RUN) (time:'15s')
              dependencies:
                - name: Set state:NO_SSH ('servo_set_servo_state') (ALWAYS_RUN)
              recoveries:
                - name: Wait for labstation to load ('cros_access') (time:'2m0s')
            - name: Set state:SERVO_HOST_ISSUE ('servo_set_servo_state') (ALWAYS_RUN)
          recoveries:
            - name: Sleep 1s (Allow to fail) ('sample_sleep') (ALWAYS_RUN)
            - name: Create request to reboot labstation ('sample_fail') (ALWAYS_RUN)
              conditions:
                - name: Only applies to labstation ('servo_host_is_labstation')
              dependencies:
                - name: cros_create_reboot_request
        - name: Read release info (Allow to fail) ('cros_run_command') (RUN_ONCE)
          conditions:
            - name: Only runs for physical labstation ('servo_uses_servod_container')
          dependencies:
            - name: Device is SSHable ('cros_access') (ALWAYS_RUN) (time:'15s')
              dependencies:
                - name: Set state:NO_SSH ('servo_set_servo_state') (ALWAYS_RUN)
              recoveries:
                - name: Wait for labstation to load ('cros_access') (time:'2m0s')
            - name: Set state:SERVO_HOST_ISSUE ('servo_set_servo_state') (ALWAYS_RUN)
        - name: Power-cycle by smart-hub (Allow to fail) ('servo_power_cycle_root_servo') (RUN_ONCE) (time:'2m0s')
          conditions:
            - name: Only run if DUT ping fails ('sample_fail') (ALWAYS_RUN)
              conditions:
                - name: DUT is pingable ('cros_ping') (ALWAYS_RUN) (time:'15s')
          dependencies:
            - name: Device is SSHable ('cros_access') (ALWAYS_RUN) (time:'15s')
              dependencies:
                - name: Set state:NO_SSH ('servo_set_servo_state') (ALWAYS_RUN)
              recoveries:
                - name: Wait for labstation to load ('cros_access') (time:'2m0s')
        - name: Has enough free disk space ('cros_has_enough_storage_space')
          conditions:
            - name: Only runs for physical labstation ('servo_uses_servod_container')
          dependencies:
            - name: Device is SSHable ('cros_access') (ALWAYS_RUN) (time:'15s')
              dependencies:
                - name: Set state:NO_SSH ('servo_set_servo_state') (ALWAYS_RUN)
              recoveries:
                - name: Wait for labstation to load ('cros_access') (time:'2m0s')
            - name: Set state:BROKEN ('servo_set_servo_state') (ALWAYS_RUN)
          recoveries:
            - name: Remove logs and other files ('sample_pass')
              conditions:
                - name: Only applies to labstation ('servo_host_is_labstation')
              dependencies:
                - name: servo_labstation_disk_cleanup
                - name: Remove logs older 5 days ('servo_servod_old_logs_cleanup')
            - name: Create request to reboot labstation ('sample_fail') (ALWAYS_RUN)
              conditions:
                - name: Only applies to labstation ('servo_host_is_labstation')
              dependencies:
                - name: cros_create_reboot_request
        - name: Cache latest servod start time (Allow to fail) ('cros_register_servod_logs_start')
          conditions:
            - name: Only runs for physical labstation ('servo_uses_servod_container')
        - name: Servo_v4(p1) main present ('servo_v4_root_present')
          dependencies:
            - name: Device is SSHable ('cros_access') (ALWAYS_RUN) (time:'15s')
              dependencies:
                - name: Set state:NO_SSH ('servo_set_servo_state') (ALWAYS_RUN)
              recoveries:
                - name: Wait for labstation to load ('cros_access') (time:'2m0s')
            - name: Set state:NOT_CONNECTED ('servo_set_servo_state') (ALWAYS_RUN)
          recoveries:
            - name: Recover servo with Power-cycle by smart-hub ('servo_power_cycle_root_servo') (ALWAYS_RUN) (time:'2m0s')
            - name: Create request to reboot labstation ('sample_fail') (ALWAYS_RUN)
              conditions:
                - name: Only applies to labstation ('servo_host_is_labstation')
              dependencies:
                - name: cros_create_reboot_request
        - name: All servo's fw updated ('servo_fw_need_update') (time:'5m0s')
          dependencies:
            - name: Device is SSHable ('cros_access') (ALWAYS_RUN) (time:'15s')
              dependencies:
                - name: Set state:NO_SSH ('servo_set_servo_state') (ALWAYS_RUN)
              recoveries:
                - name: Wait for labstation to load ('cros_access') (time:'2m0s')
            - name: Set state:SERVO_UPDATER_ISSUE ('servo_set_servo_state') (ALWAYS_RUN)
          recoveries:
            - name: Sleep 1s (Allow to fail) ('sample_sleep') (ALWAYS_RUN)
            - name: Update all servo's firmware ('servo_update_servo_firmware') (RUN_ONCE) (time:'10m0s')
              dependencies:
                - name: Stop servod daemon on servo-host ('servo_host_servod_init') (time:'6m0s')
        - name: Save UART capture (Allow to fail) ('servod_save_uart_capture')
          dependencies:
            - name: Stop UART capture (Allow to fail) ('servod_stop_uart_capture')
        - name: Start servod daemon ('servo_host_servod_init') (time:'4m0s')
          dependencies:
            - name: Device is SSHable ('cros_access') (ALWAYS_RUN) (time:'15s')
              dependencies:
                - name: Set state:NO_SSH ('servo_set_servo_state') (ALWAYS_RUN)
              recoveries:
                - name: Wait for labstation to load ('cros_access') (time:'2m0s')
            - name: Set state:SERVO_HOST_ISSUE ('servo_set_servo_state') (ALWAYS_RUN)
          recoveries:
            - name: Reboot servo device ('sample_fail') (RUN_ONCE) (time:'1m10s')
              dependencies:
                - name: Stop servod (Allow to fail) ('servo_host_servod_stop') (ALWAYS_RUN)
                  dependencies:
                    - name: Save UART capture (Allow to fail) ('servod_save_uart_capture')
                      dependencies:
                        - name: Stop UART capture (Allow to fail) ('servod_stop_uart_capture')
            - name: Stop servod and request to use recovery-mode for servod ('sample_pass') (RUN_ONCE)
              dependencies:
                - name: Specify to use REC_MODE=1 for servo ('servo_create_flag_to_use_recovery_mode') (RUN_ONCE)
                - name: Stop servod (Allow to fail) ('servo_host_servod_stop') (ALWAYS_RUN)
                  dependencies:
                    - name: Save UART capture (Allow to fail) ('servod_save_uart_capture')
                      dependencies:
                        - name: Stop UART capture (Allow to fail) ('servod_stop_uart_capture')
            - name: Stop servod (Allow to fail) ('servo_host_servod_stop') (ALWAYS_RUN)
              dependencies:
                - name: Save UART capture (Allow to fail) ('servod_save_uart_capture')
                  dependencies:
                    - name: Stop UART capture (Allow to fail) ('servod_stop_uart_capture')
            - name: Reset EC from DUT and stop ('sample_pass') (ALWAYS_RUN)
              conditions:
                - name: DUT is SSHable ('cros_access') (ALWAYS_RUN) (time:'15s')
                - name: is_servo_type_ccd
              dependencies:
                - name: cros_reset_ec (ALWAYS_RUN)
                  dependencies:
                    - name: DUT is SSHable ('cros_access') (ALWAYS_RUN) (time:'15s')
                - name: Stop servod (Allow to fail) ('servo_host_servod_stop') (ALWAYS_RUN)
                  dependencies:
                    - name: Save UART capture (Allow to fail) ('servod_save_uart_capture')
                      dependencies:
                        - name: Stop UART capture (Allow to fail) ('servod_stop_uart_capture')
            - name: Reflash Cr50 fw and stop ('sample_pass') (RUN_ONCE)
              conditions:
                - name: DUT is SSHable ('cros_access') (ALWAYS_RUN) (time:'15s')
                - name: is_servo_type_ccd
                - name: Is reflash Cr50 was done more 24 hours ago ('sample_fail')
                  conditions:
                    - name: Is reflash Cr50 was done within 24 hours ('metrics_found_at_last_time')
              dependencies:
                - name: Reflash Cr50 fw on DUT ('cros_reflash_cr50_fw') (RUN_ONCE) (time:'2m30s')
                  dependencies:
                    - name: DUT is SSHable ('cros_access') (ALWAYS_RUN) (time:'15s')
                - name: Stop servod (Allow to fail) ('servo_host_servod_stop') (ALWAYS_RUN)
                  dependencies:
                    - name: Save UART capture (Allow to fail) ('servod_save_uart_capture')
                      dependencies:
                        - name: Stop UART capture (Allow to fail) ('servod_stop_uart_capture')
            - name: Reset GSC from DUT and stop servod ('sample_pass') (RUN_ONCE)
              conditions:
                - name: DUT is SSHable ('cros_access') (ALWAYS_RUN) (time:'15s')
                - name: Is servo_v4(p1) used with type-c connector ('servo_check_servod_control')
              dependencies:
                - name: Reset GSC on DUT (Allow to fail) ('cros_run_command') (RUN_ONCE)
                  conditions:
                    - name: DUT is SSHable ('cros_access') (ALWAYS_RUN) (time:'15s')
                - name: Stop servod (Allow to fail) ('servo_host_servod_stop') (ALWAYS_RUN)
                  dependencies:
                    - name: Save UART capture (Allow to fail) ('servod_save_uart_capture')
                      dependencies:
                        - name: Stop UART capture (Allow to fail) ('servod_stop_uart_capture')
            - name: Create request to reboot labstation ('sample_fail') (ALWAYS_RUN)
              conditions:
                - name: Only applies to labstation ('servo_host_is_labstation')
              dependencies:
                - name: cros_create_reboot_request
        - name: Start UART capture (Allow to fail) ('servod_start_uart_capture')
        - name: Servod is responsive to dut-control ('servo_servod_echo_host') (time:'30s')
          dependencies:
            - name: Device is SSHable ('cros_access') (ALWAYS_RUN) (time:'15s')
              dependencies:
                - name: Set state:NO_SSH ('servo_set_servo_state') (ALWAYS_RUN)
              recoveries:
                - name: Wait for labstation to load ('cros_access') (time:'2m0s')
            - name: Set state:SERVOD_ISSUE ('servo_set_servo_state') (ALWAYS_RUN)
          recoveries:
            - name: Stop servod and request to use recovery-mode for servod ('sample_pass') (RUN_ONCE)
              dependencies:
                - name: Specify to use REC_MODE=1 for servo ('servo_create_flag_to_use_recovery_mode') (RUN_ONCE)
                - name: Stop servod (Allow to fail) ('servo_host_servod_stop') (ALWAYS_RUN)
                  dependencies:
                    - name: Save UART capture (Allow to fail) ('servod_save_uart_capture')
                      dependencies:
                        - name: Stop UART capture (Allow to fail) ('servod_stop_uart_capture')
            - name: Stop servod (Allow to fail) ('servo_host_servod_stop') (ALWAYS_RUN)
              dependencies:
                - name: Save UART capture (Allow to fail) ('servod_save_uart_capture')
                  dependencies:
                    - name: Stop UART capture (Allow to fail) ('servod_stop_uart_capture')
            - name: Reboot servo device ('sample_fail') (RUN_ONCE) (time:'1m10s')
              dependencies:
                - name: Stop servod (Allow to fail) ('servo_host_servod_stop') (ALWAYS_RUN)
                  dependencies:
                    - name: Save UART capture (Allow to fail) ('servod_save_uart_capture')
                      dependencies:
                        - name: Stop UART capture (Allow to fail) ('servod_stop_uart_capture')
            - name: Reboot by EC console and stop ('sample_pass') (ALWAYS_RUN)
              dependencies:
                - name: Reboot by DUT's EC UART ('servo_set_ec_uart_cmd') (ALWAYS_RUN)
                - name: Stop servod (Allow to fail) ('servo_host_servod_stop') (ALWAYS_RUN)
                  dependencies:
                    - name: Save UART capture (Allow to fail) ('servod_save_uart_capture')
                      dependencies:
                        - name: Stop UART capture (Allow to fail) ('servod_stop_uart_capture')
            - name: Cold reset the DUT by servod and stop ('sample_pass') (ALWAYS_RUN)
              dependencies:
                - name: Cold reset by servod ('servo_power_state_reset') (ALWAYS_RUN)
                - name: Stop servod (Allow to fail) ('servo_host_servod_stop') (ALWAYS_RUN)
                  dependencies:
                    - name: Save UART capture (Allow to fail) ('servod_save_uart_capture')
                      dependencies:
                        - name: Stop UART capture (Allow to fail) ('servod_stop_uart_capture')
            - name: Reset EC from DUT and stop ('sample_pass') (ALWAYS_RUN)
              conditions:
                - name: DUT is SSHable ('cros_access') (ALWAYS_RUN) (time:'15s')
                - name: is_servo_type_ccd
              dependencies:
                - name: cros_reset_ec (ALWAYS_RUN)
                  dependencies:
                    - name: DUT is SSHable ('cros_access') (ALWAYS_RUN) (time:'15s')
                - name: Stop servod (Allow to fail) ('servo_host_servod_stop') (ALWAYS_RUN)
                  dependencies:
                    - name: Save UART capture (Allow to fail) ('servod_save_uart_capture')
                      dependencies:
                        - name: Stop UART capture (Allow to fail) ('servod_stop_uart_capture')
            - name: Create request to reboot labstation ('sample_fail') (ALWAYS_RUN)
              conditions:
                - name: Only applies to labstation ('servo_host_is_labstation')
              dependencies:
                - name: cros_create_reboot_request
        - name: Read servo serial by servod harness ('servod_echo')
          dependencies:
            - name: Set state:SERVOD_PROXY_ISSUE ('servo_set_servo_state') (ALWAYS_RUN)
          recoveries:
            - name: Stop servod (Allow to fail) ('servo_host_servod_stop') (ALWAYS_RUN)
              dependencies:
                - name: Save UART capture (Allow to fail) ('servod_save_uart_capture')
                  dependencies:
                    - name: Stop UART capture (Allow to fail) ('servod_stop_uart_capture')
            - name: Reboot servo device ('sample_fail') (RUN_ONCE) (time:'1m10s')
              dependencies:
                - name: Stop servod (Allow to fail) ('servo_host_servod_stop') (ALWAYS_RUN)
                  dependencies:
                    - name: Save UART capture (Allow to fail) ('servod_save_uart_capture')
                      dependencies:
                        - name: Stop UART capture (Allow to fail) ('servod_stop_uart_capture')
            - name: Toggle DTS Mode and Servo Role ('servo_servod_dts_and_servo_role_toggle_exec') (ALWAYS_RUN)
              conditions:
                - name: is_servo_type_ccd
            - name: Toggle PD once and stop ('sample_pass') (ALWAYS_RUN)
              dependencies:
                - name: Toggle PD once ('servo_servod_toggle_pd_role') (ALWAYS_RUN)
                - name: Stop servod (Allow to fail) ('servo_host_servod_stop') (ALWAYS_RUN)
                  dependencies:
                    - name: Save UART capture (Allow to fail) ('servod_save_uart_capture')
                      dependencies:
                        - name: Stop UART capture (Allow to fail) ('servod_stop_uart_capture')
            - name: Try fake disconnect and stop ('sample_pass') (ALWAYS_RUN)
              conditions:
                - name: is_servo_type_ccd
              dependencies:
                - name: Try fake disconnect ('servo_fake_disconnect_dut')
                  conditions:
                    - name: is_servo_type_ccd
                - name: Stop servod (Allow to fail) ('servo_host_servod_stop') (ALWAYS_RUN)
                  dependencies:
