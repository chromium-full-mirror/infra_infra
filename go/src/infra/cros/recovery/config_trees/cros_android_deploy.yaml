                - mp_firmware_testing
              docs:
                - Verify that DUT is not in the pool that requires MP signed AP firmware.
                - The firmware validation only applies to dev signed AP firmware
                - currently. Depending on how widespread MP signed AP firmware
                - testing is, we could add a parallel validation for MP AP firmware.
            - name: Check stable firmware version exists
              exec_name: has_stable_version_fw_version
              docs:
                - Check the DUT has model specific firmware stable_version configured.
                - Flex device are exampted from this check as they don't run cros firmware
              conditions:
                - name: Run only on ChromeOS hardware (RUN_ONCE)
                  exec_name: dut_check_board
                  exec_args:
                    - string_values:aurora,reven
                    - invert_result:true
                  docs:
                    - Check that DUT is a Chromebook by checking for non-Chromebook boards
                - name: Has a stable-version service (RUN_ONCE)
                  exec_name: has_stable_version_service_path
                  docs:
                    - Verify if we have access to the service provided access to the stable version
            - name: Recovery version has OS image path
              exec_name: has_stable_version_cros_image
              docs:
                - Verify that recovery version has OS image path.
              dependencies:
                - name: Has a stable-version service (RUN_ONCE)
                  exec_name: has_stable_version_service_path
                  docs:
                    - Verify if we have access to the service provided access to the stable version
            - name: Is recovery-version has firmware image path
              exec_name: has_stable_version_fw_image
              docs:
                - Verify that recovery version has firmware image path.
              dependencies:
                - name: Has a stable-version service (RUN_ONCE)
                  exec_name: has_stable_version_service_path
                  docs:
                    - Verify if we have access to the service provided access to the stable version
            - name: Pools required to manage FW on the device (RUN_ONCE)
              exec_name: dut_not_in_pool
              exec_args:
                - no_fw_ro_check
              docs:
                - Verify that device we check in the pool which not required fw management.
        - name: Reset provisioned info (ALWAYS_RUN)
          exec_name: cros_reset_provision_info
          docs:
            - Reset all provision info.
        - name: All repair-requests resolved
          exec_name: dut_has_no_repair_requests
          docs:
            - Checks if all repair requests are resolved
        - name: Reset DUT-state reason
          exec_name: dut_reset_state_reason
          docs:
            - Reset DUT-state-reason for good DUT as it becomes stale.
        - name: Servo is in WORKING state
          exec_name: servo_match_state
          exec_args:
            - state:WORKING
          docs:
            - Some pool requires servo on WORKING state.
            - This action does not have any recovery actions.
          conditions:
            - name: Pools require Servo in WORKING state (RUN_ONCE)
              exec_name: dut_is_in_pool
              exec_args:
                - faft-cr50
                - faft-cr50-debug
                - faft-cr50-tot
                - faft-experimental
                - faft-test
                - satlab_faft
                - need_healthy_servo
              docs:
                - List of pools that require a good servo.
        - name: 'Set state: ready (RUN_ONCE)'
          exec_name: dut_set_state
          exec_args:
            - state:ready
          docs:
            - The action set devices with state ready for the testing.
          dependencies:
            - name: All repair-requests resolved
              exec_name: dut_has_no_repair_requests
              docs:
                - Checks if all repair requests are resolved
            - name: Reset DUT-state reason
              exec_name: dut_reset_state_reason
              docs:
                - Reset DUT-state-reason for good DUT as it becomes stale.
    - name: chameleon (Allow to fail)
      criticalactions:
        - name: Mark as bad (RUN_ONCE)
          exec_name: chameleon_state_broken
        - name: Device is pingable (time:'15s')
          exec_name: cros_ping
          recoveries:
            - name: Chameleon RPM power cycle (ALWAYS_RUN) (time:'2m30s')
              exec_name: cros_access
              docs:
                - Power cycle chameleon if rpm exists
                - Ensure chameleon is SSHable on after power cycle
                - Try to wait device to be sshable after the device being rebooted.
              conditions:
                - name: Has chameleon rpm info (RUN_ONCE)
                  exec_name: device_has_rpm_info
                  exec_args:
                    - device_type:chameleon
                  docs:
                    - Check if chameleon rpm exists
              dependencies:
                - name: Power cycle chameleon by RPM
                  exec_name: device_rpm_power_cycle
                  exec_args:
                    - device_type:chameleon
                  docs:
                    - Run rpm power cycle on chameleon
        - name: cros_access
          exec_name: cros_access
        - name: Update AudioBox JackPlugger State (Allow to fail)
          exec_name: chameleon_check_audiobox_jackplugger
          docs:
            - Update the status of AudioBox JackPlugger.
        - name: Mark as good (RUN_ONCE)
          exec_name: chameleon_state_working
    - name: bluetooth_peer (Allow to fail)
      criticalactions:
        - name: 'Set state: BROKEN (RUN_ONCE)'
          exec_name: btpeer_state_broken
          docs:
            - The device state BROKEN.
        - name: Device is pingable (ALWAYS_RUN) (time:'15s')
          exec_name: cros_ping
          docs:
            - Wait device to be pingable.
            - Waiting time 15 seconds.
        - name: Device is SSHable (ALWAYS_RUN)
          exec_name: cros_access
          docs:
            - Try to wait device to be sshable.
            - Waiting time 150 seconds.
        - name: Fetch btpeer image release config from GCS (RUN_ONCE)
          exec_name: btpeer_image_fetch_release_config
          docs:
            - Retrieves the production btpeer image config from GCS and stores it in the exec state for later reference.
          recoveries:
            - name: Restart networking service on btpeer
              exec_name: btpeer_restart_networking_service
              docs:
                - Restart networking service on btpeer to prevent fails while downloading image and configs from GCS
        - name: OS image is up to date
          exec_name: btpeer_image_assert_expected_installed
          docs:
            - Ensures the OS image installed on the btpeer is the expected OS image release.
            - Checks the btpeer scope state for the expected image UUID and installed image UUID and fails if they differ.
            - Recovers by installing the expected image release.
          conditions:
            - name: Btpeer release process should be image-based (RUN_ONCE)
              exec_name: btpeer_assert_release_process_matches
              exec_args:
                - expected_release_process:image
              docs:
                - Passes if the release process this specific btpeer use is image-based.
                - The btpeer will be chosen to use the image-based process if it currently has a custom image installed (i.e. existence of an image UUID in scope) or the hostname of the primary dut in this testbed is present in the image release config's NextImageVerificationDutPool.
          dependencies:
            - name: Identify expected image release (RUN_ONCE)
              exec_name: btpeer_image_identify_expected
              docs:
                - Identifies which btpeer image this specific btpeer should have installed based on the release config and the primary dut's hostname, and then stores it in the scope.
            - name: Identify installed image release (ALWAYS_RUN)
              exec_name: btpeer_image_fetch_installed_uuid
              exec_args:
                - allow_legacy_image:true
              docs:
                - Reads the image UUID from the image build info file present on all ChromeOS Raspberry Pi btpeer OS image installations and stores it in the scope.
                - Still passes if the image build info file is not present (legacy image assumed), leaving the image UUID unset so that 'Btpeer has expected image release installed' fails and installs the expected image.
          recoveries:
            - name: Provision OS to expected image release (ALWAYS_RUN)
              exec_name: sample_pass
              docs:
                - Installs the expected OS image release onto the btpeer.
                - This process can take about 30 minutes and includes many device reboots.
                - If this fails, a manual recovery of flashing the SD card with a known good image is likely necessary.
              dependencies:
                - name: AB Partition device (ALWAYS_RUN)
                  exec_name: sample_pass
                  docs:
                    - Takes a device with the default partitioning scheme and re-partitions it.
                    - This action is skipped if the device is already AB partitioned.
                  conditions:
                    - name: Device is not AB partitioned (ALWAYS_RUN)
                      exec_name: btpeer_has_partitions_with_labels
                      exec_args:
                        - labels:BOOT_A,ROOT_A,BOOT_B,ROOT_B
                        - expect_match:false
                      docs:
                        - Checks that the raspberry pi is not AB partitioned
                  dependencies:
                    - name: Verify device has space for new B partitions (ALWAYS_RUN)
                      exec_name: btpeer_has_partition_room
                      docs:
                        - Verifies that the device has space to add the new
                        - BOOT_B/ROOT_B partitions
                    - name: Verify device has standard partition scheme (ALWAYS_RUN)
                      exec_name: btpeer_device_has_standard_partitions
                      docs:
                        - Verifies that the device has the default raspberry PI partitioning scheme
                        - consisting of 1 FAT32 boot partition and 1 EXT4 rootfs partition.
                    - name: Enable initrd (ALWAYS_RUN) (time:'10m0s')
                      exec_name: btpeer_enable_initrd
                      docs:
                        - Enable initrd on the btpeers so we can add a pre-mount hook for rootfs.
                    - name: Shrink rootfs (ALWAYS_RUN) (time:'16m40s')
                      exec_name: btpeer_shrink_rootfs
                      docs:
                        - Shrinks the device rootfs so it can be partitioned.
                    - name: Disable initrd (ALWAYS_RUN) (time:'10m0s')
                      exec_name: btpeer_disable_initrd
                      docs:
                        - Disables use of initrd on the btpeer.
                    - name: Create new AB Partitions (ALWAYS_RUN) (time:'16m40s')
                      exec_name: btpeer_partition_device
                      docs:
                        - Takes a normal-partitioned raspberry PI partitions it for AB booting.
                - name: Temp Boot into A partition (ALWAYS_RUN) (time:'10m0s')
                  exec_name: btpeer_temp_boot_into_partition
                  exec_args:
                    - boot_partition_label:BOOT_A
                  docs:
                    - 'Temporarily boots into the A partition on the device so we can '
                    - verify it's ok before setting it as the permanent boot device.
                  dependencies:
                    - name: Enable temp booting (ALWAYS_RUN)
                      exec_name: sample_pass
                      docs:
                        - Applies necessary configurations to ensure temp booting is
                        - supported on the device.
                      conditions:
                        - name: btpeer_is_raspi_4b_less_than_revision_14
                          exec_name: btpeer_is_raspi_4b_less_than_revision_14
                      dependencies:
                        - name: btpeer_enable_debug_quirks
                          exec_name: btpeer_enable_debug_quirks
                        - name: Reboot device and wait for SSH (ALWAYS_RUN) (time:'5m0s')
                          exec_name: btpeer_reboot
                          docs:
                            - Reboots the device over ssh and waits for the device to become ssh-able again.
                - name: Set permanent boot partition as A (ALWAYS_RUN) (time:'10m0s')
                  exec_name: btpeer_set_permanent_boot_partition
                  exec_args:
                    - boot_partition_label:BOOT_A
                  docs:
                    - Sets boot partition A as the default boot partition to use on reboot.
                - name: Download expected OS image release to device (ALWAYS_RUN) (time:'25m0s')
                  exec_name: btpeer_download_image
                  docs:
                    - Downloads and decompresses the expected OS image release to the device.
                    - The overall timeout is set to 25m, with a 10m timeout for the download and a 10m timeout for decompression.
                - name: Flash B partitions with downloaded OS image (ALWAYS_RUN) (time:'40m0s')
                  exec_name: btpeer_provision_device
                  docs:
                    - Flashes a new OS onto the BOOT_B/ROOT_B partitions.
                    - The overall timeout is set to 40m, with a 5m timeout for the BOOT_B partition flash and a 30m timeout for the ROOT_B partition flash.
                - name: Temp Boot into B partition (ALWAYS_RUN) (time:'10m0s')
                  exec_name: btpeer_temp_boot_into_partition
                  exec_args:
                    - boot_partition_label:BOOT_B
                  docs:
                    - 'Temporarily boots into the B partition on the device so we can '
                    - verify it's ok before setting it as the permanent boot device.
                  dependencies:
                    - name: Enable temp booting (ALWAYS_RUN)
                      exec_name: sample_pass
                      docs:
                        - Applies necessary configurations to ensure temp booting is
                        - supported on the device.
                      conditions:
                        - name: btpeer_is_raspi_4b_less_than_revision_14
                          exec_name: btpeer_is_raspi_4b_less_than_revision_14
                      dependencies:
                        - name: btpeer_enable_debug_quirks
                          exec_name: btpeer_enable_debug_quirks
                        - name: Reboot device and wait for SSH (ALWAYS_RUN) (time:'5m0s')
                          exec_name: btpeer_reboot
                          docs:
                            - Reboots the device over ssh and waits for the device to become ssh-able again.
                - name: Set permanent boot partition as B (ALWAYS_RUN) (time:'10m0s')
                  exec_name: btpeer_set_permanent_boot_partition
                  exec_args:
                    - boot_partition_label:BOOT_B
                  docs:
                    - Sets boot partition B as the default boot partition to use on reboot.
                - name: Verify newly installed image has an image UUID (ALWAYS_RUN)
                  exec_name: btpeer_image_fetch_installed_uuid
                  exec_args:
                    - allow_legacy_image:false
                  docs:
                    - Reads the image UUID from the image build info file present on all ChromeOS Raspberry Pi btpeer OS image installations and stores it in the scope.
                    - Fails if unable to get the image UUID from the newly installed image release, as all image releases are expected to have UUIDs.
        - name: Chameleond version is up to date
          exec_name: sample_pass
          docs:
            - Checks if the chameleond version on the btpeer is outdated and updates it if it is.
          conditions:
            - name: Btpeer release process should be chameleond-based (RUN_ONCE)
              exec_name: btpeer_assert_release_process_matches
              exec_args:
                - expected_release_process:chameleond
              docs:
                - Passes if the release process this specific btpeer use is image-based.
                - The btpeer will be chosen to use the chameleond-based process if it is not chosen to use the new image-based release process.
          dependencies:
            - name: Fetch btpeer chameleond release config from GCS (RUN_ONCE)
              exec_name: btpeer_fetch_btpeer_chameleond_release_config
              docs:
                - Retrieves the production btpeer chameleond config from GCS and stores it in the exec state for later reference.
            - name: Identify expected chameleond release bundle (RUN_ONCE)
              exec_name: btpeer_identify_expected_chameleond_release_bundle
              docs:
                - Identifies the expected chameleond release bundle based off of the config and DUT host.
                - 'Note: For now this step ignores the DUT host and always selects the latest, non-next bundle.'
            - name: Fetch installed chameleond bundle commit from btpeer (ALWAYS_RUN)
              exec_name: btpeer_fetch_installed_chameleond_bundle_commit
              docs:
                - Retrieves the chameleond commit of the currently installed chameleond version from a log file on the btpeer.
                - If it fails to retrieve the commit we assume the chameleond version is too old to have the needed log file and we recover by installing the expected chameleond bundle.
              recoveries:
                - name: Install expected chameleond release bundle and then reboot device (ALWAYS_RUN)
                  exec_name: sample_pass
                  docs:
                    - Installs/updates chameleond on the btpeer and then reboots the device.
                  dependencies:
                    - name: Install expected chameleond release bundle (time:'15m0s')
                      exec_name: btpeer_install_expected_chameleond_release_bundle
                      docs:
                        - Installs/updates chameleond on the btpeer with the expected chameleond bundle.
                        - The expected bundle archive is downloaded from GCS to the btpeer through the cache, extracted, and installed via make.
                    - name: Reboot device and wait for SSH (ALWAYS_RUN) (time:'5m0s')
                      exec_name: btpeer_reboot
                      docs:
                        - Reboots the device over ssh and waits for the device to become ssh-able again.
            - name: Btpeer has expected chameleond bundle installed (ALWAYS_RUN)
              exec_name: btpeer_assert_btpeer_has_expected_chameleond_release_bundle_installed
              docs:
                - Checks if the installed chameleond commit matches the expected chameleond bundle commit.
                - If the check fails, it attempts to recover by updating chameleond with the expected bundle.
              recoveries:
                - name: Install expected chameleond release bundle and then reboot device (ALWAYS_RUN)
                  exec_name: sample_pass
                  docs:
                    - Installs/updates chameleond on the btpeer and then reboots the device.
                  dependencies:
                    - name: Install expected chameleond release bundle (time:'15m0s')
                      exec_name: btpeer_install_expected_chameleond_release_bundle
                      docs:
                        - Installs/updates chameleond on the btpeer with the expected chameleond bundle.
                        - The expected bundle archive is downloaded from GCS to the btpeer through the cache, extracted, and installed via make.
                    - name: Reboot device and wait for SSH (ALWAYS_RUN) (time:'5m0s')
                      exec_name: btpeer_reboot
                      docs:
                        - Reboots the device over ssh and waits for the device to become ssh-able again.
        - name: Chameleond service is running (ALWAYS_RUN)
          exec_name: btpeer_assert_chameleond_service_is_running
          docs:
            - Checks the status of the chameleond service on the device to see if it is running.
            - Fails if the service is not running and attempts recovery by rebooting.
          recoveries:
            - name: Reboot device and wait for SSH (ALWAYS_RUN) (time:'5m0s')
              exec_name: btpeer_reboot
              docs:
                - Reboots the device over ssh and waits for the device to become ssh-able again.
        - name: Device has been rebooted recently
          exec_name: btpeer_assert_uptime_is_less_than_duration
          exec_args:
            - duration_min:1440
          docs:
            - Checks the device's uptime and fails if it is not less than one day.
            - Recovers by rebooting the device.
          recoveries:
            - name: Reboot device and wait for SSH (ALWAYS_RUN) (time:'5m0s')
              exec_name: btpeer_reboot
              docs:
                - Reboots the device over ssh and waits for the device to become ssh-able again.
        - name: 'Set state: WORKING (RUN_ONCE)'
          exec_name: btpeer_state_working
          docs:
            - The device state WORKING.
    - name: wifi_router (Allow to fail)
      criticalactions:
        - name: Set WifiRouter state to BROKEN (RUN_ONCE)
          exec_name: wifi_router_set_state
          exec_args:
            - state:BROKEN
          docs:
            - Set the WifiRouter state to BROKEN
        - name: Device is ping-able (time:'15s')
          exec_name: cros_ping
        - name: Identify and set WifiRouter device_type
          exec_name: wifi_router_identify_device_type
          docs:
            - Identifies the device type of the test AP by probing the device over ssh.
            - APs that fail to be identified as one of the supported device types will be left in a broken state.
        - name: Check ChromeOS Gale device
          exec_name: sample_pass
          docs:
            - Recovery checks preformed only for ChromeOS Gale router devices.
          conditions:
            - name: Is ChromeOS Gale (RUN_ONCE)
              exec_name: wifi_router_device_type_in_list
              exec_args:
                - device_types:WIFI_ROUTER_DEVICE_TYPE_CHROMEOS_GALE
              docs:
                - Checks if the router's device type is WIFI_ROUTER_DEVICE_TYPE_CHROMEOS_GALE.
          dependencies:
            - name: Set Gale WifiRouter model and features
              exec_name: wifi_router_update_model_and_features
              docs:
                - 'All ChromeOS Gale devices are expected to have the same model and '
                - features, so we can set these as hardcoded values.
            - name: Device is on stable-version
              exec_name: cros_is_on_stable_version
              exec_args:
                - device_type:wifi_router
              docs:
                - Checks the ChromeOS image on the Gale device to see if it is on the stable-version.
              recoveries:
                - name: Provision Gale device to stable version (time:'1h0m0s')
                  exec_name: cros_provision
                  exec_args:
                    - device_type:wifi_router
                  docs:
                    - Install wifirouter stable os.
                    - Currently only has one version
            - name: Device has required wifi tools
              exec_name: cros_is_tool_present
              exec_args:
                - tools:tcpdump,hostapd,dnsmasq,netperf,iperf,iw
              docs:
                - 'check whether wifirouter critical tools present: '
                - tcpdump, hostapd, dnsmasq, netperf, iperf, iw
              dependencies:
                - name: cros_access
                  exec_name: cros_access
              recoveries:
                - name: Provision Gale device to stable version (time:'1h0m0s')
                  exec_name: cros_provision
                  exec_args:
                    - device_type:wifi_router
                  docs:
                    - Install wifirouter stable os.
                    - Currently only has one version
            - name: Device has 50 percent tmp diskspace
              exec_name: cros_has_enough_storage_space_percentage
              exec_args:
                - path:/tmp
                - expected:50
              docs:
                - Check if there are more than 50 percent of diskspace in /tmp
              recoveries:
                - name: Clean up tmp space
                  exec_name: cros_run_shell_command
                  exec_args:
                    - rm -Rf /tmp/*
                  docs:
                    - Clean up tmp space
                  dependencies:
                    - name: Log usage report of tmp space (Allow to fail) (ALWAYS_RUN)
                      exec_name: wifi_router_log_usage_report_of_dir
                      exec_args:
                        - path:/tmp
                      docs:
                        - Logs a usage report of the /tmp directory
            - name: Device has 50 percent stateful partition diskspace
              exec_name: cros_has_enough_storage_space_percentage
              exec_args:
                - path:/mnt/stateful_partition
                - expected:50
              docs:
                - Check if there are more than 50 percent of diskspace in /mnt/stateful_partition
              recoveries:
                - name: Clean up stateful sub space
                  exec_name: cros_run_shell_command
                  exec_args:
                    - rm -Rf /mnt/stateful_partition/home/.shadow /mnt/stateful_partition/dev_image/telemetry /mnt/stateful_partition/var/log/metrics/*
                  docs:
                    - Remove unneeded files in /mnt/stateful_partition that grow over time.
                    - Specifically './home/.shadow', './dev_image/telemetry', and './var/log/metrics/*'.
                  dependencies:
                    - name: Log usage report of stateful partition diskspace (Allow to fail) (ALWAYS_RUN)
                      exec_name: wifi_router_log_usage_report_of_dir
                      exec_args:
                        - path:/mnt/stateful_partition
                      docs:
                        - Logs a usage report of the /mnt/stateful_partition directory
        - name: Check OpenWrt device
          exec_name: sample_pass
          docs:
            - Recovery checks preformed only for OpenWrt router devices.
          conditions:
            - name: Is OpenWrt (RUN_ONCE)
              exec_name: wifi_router_device_type_in_list
              exec_args:
                - device_types:WIFI_ROUTER_DEVICE_TYPE_OPENWRT
              docs:
                - Checks if the router's device type is WIFI_ROUTER_DEVICE_TYPE_OPENWRT.
          dependencies:
            - name: Fetch OpenWrt OS image build info from device
              exec_name: wifi_router_openwrt_fetch_build_info
              docs:
                - Retrieves the OpenWrt OS image build info from the device and stores it in the controller state for later reference.
            - name: Fetch OpenWrt image config from GCS (RUN_ONCE)
              exec_name: wifi_router_openwrt_fetch_config
              docs:
                - Retrieves the production OpenWrt image config from GCS and stores it in the controller state for later reference.
            - name: Identify expected OS image for this OpenWrt device (RUN_ONCE)
              exec_name: wifi_router_openwrt_identify_expected_image
              docs:
                - Identifies the expected OS image for this OpenWrt device based off of its image build info, the image config, and the host.
                - The UUID of the expected image is stored in the controller state for later reference.
            - name: Device has expected OpenWrt OS image
              exec_name: wifi_router_openwrt_has_expected_image
              docs:
                - Checks if the UUID of the image installed on the device (from the image build info) matches the expected image UUID.
                - If the check fails, it attempts to recover by updating the image to the expected image.
              recoveries:
                - name: Update OpenWrt OS image with expected image (ALWAYS_RUN) (time:'10m0s')
                  exec_name: wifi_router_openwrt_update_to_expected_image
                  docs:
                    - Updates the device to the expected image by preforming a sysupgrade with the expected OS image binary.
                    - The archive containing the expected image binary is downloaded from GCS to the OpenWrt device through the cache server and then extracted and used directly on the device.
                    - Once the new image is installed, the image build info is re-retrieved from the device and this new copy replaces the image build info in the controller state.
                - name: Reboot then update OpenWrt OS image with expected image
                  exec_name: sample_pass
                  docs:
                    - Reboots the device before trying to update it.
                    - This allows the update to succeed even if the /tmp dir started off corrupted, since rebooting refreshes it.
                  dependencies:
                    - name: Reboot device (ALWAYS_RUN) (time:'3m20s')
                      exec_name: wifi_router_reboot
                      docs:
                        - Reboots the device over ssh and waits for it to be ssh-able again.
                    - name: Update OpenWrt OS image with expected image (ALWAYS_RUN) (time:'10m0s')
                      exec_name: wifi_router_openwrt_update_to_expected_image
                      docs:
                        - Updates the device to the expected image by preforming a sysupgrade with the expected OS image binary.
                        - The archive containing the expected image binary is downloaded from GCS to the OpenWrt device through the cache server and then extracted and used directly on the device.
                        - Once the new image is installed, the image build info is re-retrieved from the device and this new copy replaces the image build info in the controller state.
            - name: Set WifiRouter model and features based on this OpenWrt device
              exec_name: wifi_router_update_model_and_features
              docs:
                - Sets the WifiRouter model and features based on the image build info.
        - name: Check AsusWrt device
          exec_name: sample_pass
          docs:
            - Recovery checks preformed only for AsusWrt router devices.
          conditions:
            - name: Is AsusWrt (RUN_ONCE)
              exec_name: wifi_router_device_type_in_list
              exec_args:
                - device_types:WIFI_ROUTER_DEVICE_TYPE_ASUSWRT
              docs:
                - Checks if the router's device type is WIFI_ROUTER_DEVICE_TYPE_ASUSWRT.
          dependencies:
            - name: Fetch model from AsusWrt device
              exec_name: wifi_router_asuswrt_fetch_model
              docs:
                - Retrieves the AsusWrt device's model name from the device and stores it in the controller state for later reference.
            - name: Update model and features based on this AsusWrt device
              exec_name: wifi_router_update_model_and_features
              docs:
                - 'Sets model based on data read from the AsusWrt device and sets the '
                - features based on known, hardcoded values based on model.
        - name: Check Ubuntu device
          exec_name: sample_pass
          docs:
            - Recovery checks preformed only for Ubuntu router devices.
          conditions:
            - name: Is Ubuntu (RUN_ONCE)
              exec_name: wifi_router_device_type_in_list
              exec_args:
                - device_types:WIFI_ROUTER_DEVICE_TYPE_UBUNTU
              docs:
                - Checks if the router's device type is WIFI_ROUTER_DEVICE_TYPE_UBUNTU.
          dependencies:
            - name: Fetch system product name from Ubuntu device
              exec_name: wifi_router_ubuntu_fetch_system_product_name
              docs:
                - Retrieves the Ubuntu device's system product name from the device and stores it in the controller state for later reference.
            - name: Fetch network controller name from Ubuntu device
              exec_name: wifi_router_ubuntu_fetch_network_controller_name
              docs:
                - Retrieves the Ubuntu device's network controller name from the device and stores it in the controller state for later reference.
            - name: Update model and features based on this Ubuntu device
              exec_name: wifi_router_update_model_and_features
              docs:
                - 'Sets model based on data read from the Ubuntu device and sets the '
                - features based on known, hardcoded values based on model.
        - name: Reboot device (ALWAYS_RUN) (time:'3m20s')
          exec_name: wifi_router_reboot
          docs:
            - Reboots the device over ssh and waits for it to be ssh-able again.
        - name: Set WifiRouter state to WORKING (RUN_ONCE)
          exec_name: wifi_router_set_state
          exec_args:
            - state:WORKING
          docs:
            - Set the WifiRouter state to WORKING
    - name: human_motion_robot (Allow to fail)
      criticalactions:
        - name: Set state:BROKEN (RUN_ONCE) (time:'15s')
          exec_name: set_hmr_state
          exec_args:
            - state:BROKEN
        - name: Device is pingable (time:'15s')
          exec_name: cros_ping
        - name: Device is sshable (time:'1m0s')
          exec_name: cros_access
        - name: Check HMR state with XMLRPC call GetErrors
          exec_name: check_hmr_state
          docs:
            - Check the state of Touchhost of HMR with XMLRPC API call GetErrors.
        - name: Set state:WORKING (RUN_ONCE) (time:'15s')
          exec_name: set_hmr_state
          exec_args:
            - state:WORKING
    - name: amt_manager (Allow to fail)
      criticalactions:
        - name: Set AMT state to BROKEN
          exec_name: amt_manager_set_state
          exec_args:
            - state:BROKEN
        - name: Intel AMT is working (time:'15s')
          exec_name: amt_manager_is_healthy
          conditions:
            - name: Intel AMT is available (ALWAYS_RUN) (time:'1m31s')
              exec_name: amt_manager_amt_available
              docs:
                - Ping the AMT interface until it responds to pings.
        - name: Set AMT state to WORKING
          exec_name: amt_manager_set_state
          exec_args:
            - state:WORKING
    - name: pasit (Allow to fail)
      criticalactions:
        - name: Do not run on Mobile Harness box (RUN_ONCE)
          exec_name: env_is_not_mh_box
          docs:
            - Check that the process is not running on Mobile Harness box.
        - name: Start container (time:'2m0s')
          exec_name: ctr_passport_start
          docs:
            - Starts a PassPort container and opens a client to it.
          conditions:
            - name: ctr_passport_address_not_in_scope
              exec_name: ctr_passport_address_not_in_scope
            - name: CrosToolRunner is up
              exec_name: ctr_is_up
              docs:
                - 'Verify that cros-tool-runner service is up and running, '
                - the tool expected to start as part of system preparation.
        - name: Reset switches (time:'2m0s')
          exec_name: ctr_passport_reset_switches
          docs:
            - Resets all switches connected to the host.
        - name: Audit switches (Allow to fail)
          exec_name: pasit_audit_switches
          docs:
            - Verifies that the switches reported by passport match those reported by PassPort.
        - name: Stop container (Allow to fail)
          exec_name: ctr_passport_stop
          docs:
            - Stops the PassPort container (crt only).
    - name: close (Allow to fail)
      criticalactions:
        - name: Update AMT state (Allow to fail)
          exec_name: amt_manager_set_state
          exec_args:
            - state:NOT_APPLICABLE
          docs:
            - Update the AMT state for DUTs without AMT.
          conditions:
            - name: amt_manager_not_present
              exec_name: amt_manager_not_present
        - name: Update peripheral wifi state (Allow to fail)
          exec_name: update_peripheral_wifi_state
          docs:
            - Update peripheral wifi state based on wifi router states
        - name: Update wifi router features (Allow to fail)
          exec_name: update_wifi_router_features
          docs:
            - Update wifi router features based on the features of all wifi routers
        - name: Update chameleon state for chameleonless dut (Allow to fail)
          exec_name: chameleon_state_not_applicable
          docs:
            - Update chameleon state to not applicable for chameleonless dut
          conditions:
            - name: chameleon_not_present
              exec_name: chameleon_not_present
        - name: Update DUT state based on servo state
          exec_name: dut_set_state_reason
          exec_args:
            - allow_override:false
            - reason:CRITICAL_SERVO_ISSUE
          docs:
            - 'Set the DUT state based on the state of servo. '
            - 'This applies only if the count of failures is '
            - not above a threshold amount
          conditions:
            - name: DUT state is repair_failed
              exec_name: dut_state_match
              exec_args:
                - state:repair_failed
              docs:
                - Check if the DUT's state is in repair_failed state, if not then fail.
            - name: Failure count are not above threshold
              exec_name: sample_fail
              docs:
                - 'Check if the number of times the recovery task '
                - has failed is not greater than a threshold value
              dependencies:
                - name: Failure count above threshold
                  exec_name: metrics_check_task_failures
                  exec_args:
                    - task_name:recovery
                    - repair_failed_count:6
                  docs:
                    - 'Check if the number of recovery task failures '
                    - on a servo-attached DUT is greater than a threshold
                  conditions:
                    - name: Servo-host known
                      exec_name: dut_servo_host_present
            - name: Servo-host known
              exec_name: dut_servo_host_present
            - name: Servo state demands manual repair
              exec_name: dut_servo_state_required_manual_attention
              exec_args:
                - servo_states:NEED_REPLACEMENT,DUT_NOT_CONNECTED
              docs:
                - 'Check whether the state of servo mandates a '
                - manual repair on the DUT.
            - name: 'Set state: needs_manual_repair (Allow to fail) (ALWAYS_RUN)'
              exec_name: dut_set_state
              exec_args:
                - state:needs_manual_repair
              docs:
                - Set DUT state as needs_manual_repair.
        - name: Update DUT state for failures more than threshold
          exec_name: dut_set_state_reason
          exec_args:
            - allow_override:false
            - reason:REPAIR_RETRY_REACHED_THRESHOLD
          docs:
            - 'Set the DUT state to the value passed in the '
            - extra args.
          conditions:
            - name: DUT state is repair_failed
              exec_name: dut_state_match
              exec_args:
                - state:repair_failed
              docs:
                - Check if the DUT's state is in repair_failed state, if not then fail.
            - name: Failure count above threshold
              exec_name: metrics_check_task_failures
              exec_args:
                - task_name:recovery
                - repair_failed_count:6
              docs:
                - 'Check if the number of recovery task failures '
                - on a servo-attached DUT is greater than a threshold
              conditions:
                - name: Servo-host known
                  exec_name: dut_servo_host_present
            - name: Failure count above threshold (Servo-less)
              exec_name: metrics_check_task_failures
              exec_args:
                - task_name:recovery
                - repair_failed_count:3
              docs:
                - 'Check if the number of recovery task failures '
                - on a non-servo-attached DUT is greater than a threshold
              conditions:
                - name: No Servo-host
                  exec_name: sample_fail
                  conditions:
                    - name: Servo-host known
                      exec_name: dut_servo_host_present
            - name: 'Set state: needs_manual_repair (Allow to fail) (ALWAYS_RUN)'
              exec_name: dut_set_state
              exec_args:
                - state:needs_manual_repair
              docs:
                - Set DUT state as needs_manual_repair.
        - name: Update cellular modem state for non-cellular pools (Allow to fail)
          exec_name: set_cellular_modem_state
          exec_args:
            - state:hardware_not_detected
          docs:
            - Set cellular modem state for DUTs in non-cellular pools.
          conditions:
            - name: Is not in cellular pool (RUN_ONCE)
              exec_name: dut_not_in_pool_regex
              exec_args:
                - regex:(?i)^cellular|dut_pool_quota
              docs:
                - Verify that DUT is not in a pool that runs cellular tests
            - name: has_cellular_info
              exec_name: has_cellular_info
        - name: Close Servo-host (Allow to fail) (ALWAYS_RUN)
          exec_name: servo_host_servod_stop
          docs:
            - Stop the servod daemon.
            - Collect all logs and files from the host.
          conditions:
            - name: Servo-host known
              exec_name: dut_servo_host_present
            - name: Servo-host is sshable (RUN_ONCE) (time:'15s')
              exec_name: cros_access
              exec_args:
                - device_type:servo
              docs:
                - Stop the servod daemon.
                - Allowed to fail as can be run when servod is not running.
          dependencies:
            - name: Copy messages from servo-host (Allow to fail)
              exec_name: cros_copy_to_logs
              exec_args:
                - src_host_type:servo_host
                - src_path:/var/log/messages
                - src_type:file
                - use_host_dir:true
              docs:
                - Try to collect /var/log/messages from servo-host.
              conditions:
                - name: Servo-host known
                  exec_name: dut_servo_host_present
            - name: Copy eventlog.txt from servo-host (Allow to fail)
              exec_name: cros_copy_to_logs
              exec_args:
                - src_host_type:servo_host
                - src_path:/var/log/eventlog.txt
                - src_type:file
                - use_host_dir:true
              docs:
                - Try to collect /var/log/eventlog.txt from servo-host.
              conditions:
                - name: Servo-host known
                  exec_name: dut_servo_host_present
            - name: Collect dmesg logs from Servo-host (Allow to fail)
              exec_name: cros_dmesg
              exec_args:
                - device_type:servo_host
                - use_host_dir:true
              docs:
                - Collect the entire output of dmesg
            - name: Collect servod logs (Allow to fail)
              exec_name: cros_collect_servod_logs
              docs:
                - Try to collect all servod logs since latest start time.
              conditions:
                - name: Servo-host known
                  exec_name: dut_servo_host_present
            - name: Remove in-use flag on servo-host (Allow to fail)
              exec_name: cros_remove_servo_in_use
              conditions:
                - name: Servo-host known
                  exec_name: dut_servo_host_present
            - name: Remove request to reboot if servo is good (Allow to fail)
              exec_name: cros_remove_reboot_request
              conditions:
                - name: Servo-host known
                  exec_name: dut_servo_host_present
                - name: Is servo_state:working
                  exec_name: servo_match_state
                  exec_args:
                    - state:WORKING
                  docs:
                    - check the servo's state is ServoStateWorking.
            - name: Turn off servo usbkey power (Allow to fail) (ALWAYS_RUN)
              exec_name: servo_set
              exec_args:
                - command:image_usbkey_pwr
                - string_value:off
              docs:
                - Ensure that servo usbkey power is in off state.
              conditions:
                - name: Servo-host known
                  exec_name: dut_servo_host_present
            - name: Save UART capture (Allow to fail)
              exec_name: servod_save_uart_capture
              dependencies:
                - name: Stop UART capture (Allow to fail)
                  exec_name: servod_stop_uart_capture
