plans:
    - name: cros_base
      criticalactions:
        - name: 'Set state: needs_deploy'
          exec_name: dut_set_state
          exec_args:
            - state:needs_deploy
          docs:
            - The action set devices with request to be redeployed.
        - name: Start ADB-base (time:'2m0s')
          exec_name: ctr_start_adb_container
          docs:
            - Pull and run adb-base container
          conditions:
            - name: Do not run on Mobile Harness box (RUN_ONCE)
              exec_name: env_is_not_mh_box
              docs:
                - Check that the process is not running on Mobile Harness box.
            - name: CrosToolRunner is up
              exec_name: ctr_is_up
              docs:
                - 'Verify that cros-tool-runner service is up and running, '
                - the tool expected to start as part of system preparation.
        - name: Start Servo-Nexus (time:'4m0s')
          exec_name: ctr_servo_nexus_start_container
          docs:
            - Pull and run servo-nexus container
          conditions:
            - name: Do not run on Mobile Harness box (RUN_ONCE)
              exec_name: env_is_not_mh_box
              docs:
                - Check that the process is not running on Mobile Harness box.
            - name: Testbed has Servo (RUN_ONCE)
              exec_name: dut_servo_host_present
            - name: CrosToolRunner is up
              exec_name: ctr_is_up
              docs:
                - 'Verify that cros-tool-runner service is up and running, '
                - the tool expected to start as part of system preparation.
    - name: servo_fw_update
      criticalactions:
        - name: Set state:MISSING_CONFIG (ALWAYS_RUN)
          exec_name: servo_set_servo_state
          exec_args:
            - state:MISSING_CONFIG
        - name: Servo serial is specified (RUN_ONCE)
          exec_name: dut_servo_has_serial
          docs:
            - Check if root servo serial is present.
          dependencies:
            - name: Set state:WRONG_CONFIG (ALWAYS_RUN)
              exec_name: servo_set_servo_state
              exec_args:
                - state:WRONG_CONFIG
        - name: Initialize docker container (time:'6m0s')
          exec_name: servo_host_servod_init
          exec_args:
            - no_servod:true
          docs:
            - Initiate docker to have access to the host.
            - Servod is not needed as on this stage we just verify that servo host is good.
            - If start container with servod and root servo device is not connected it will fail.
          conditions:
            - name: Uses servod container
              exec_name: servo_uses_servod_container
              docs:
                - Condition to check if servo uses servod container.
          dependencies:
            - name: Set state:NO_SSH (ALWAYS_RUN)
              exec_name: servo_set_servo_state
              exec_args:
                - state:NO_SSH
          recoveries:
            - name: Stop servod (Allow to fail) (ALWAYS_RUN)
              exec_name: servo_host_servod_stop
              docs:
                - Stop the servod daemon.
                - Allowed to fail as can be run when servod is not running.
              dependencies:
                - name: Save UART capture (Allow to fail)
                  exec_name: servod_save_uart_capture
                  dependencies:
                    - name: Stop UART capture (Allow to fail)
                      exec_name: servod_stop_uart_capture
        - name: Device is SSHable (ALWAYS_RUN) (time:'15s')
          exec_name: cros_access
          docs:
            - Verify that device is reachable by SSH.
            - Limited to 15 seconds.
          dependencies:
            - name: Set state:NO_SSH (ALWAYS_RUN)
              exec_name: servo_set_servo_state
              exec_args:
                - state:NO_SSH
          recoveries:
            - name: Wait for labstation to load (time:'2m0s')
              exec_name: cros_access
              docs:
                - Sometimes we can try to connect when labstation is the middle of reboot, so we wait.
                - Labstation is expected to complete the reboot within 2 minutes.
        - name: Mark labstation as servod is in-use
          exec_name: cros_create_servo_in_use
          docs:
            - Create lock file is_in_use.
          conditions:
            - name: Only applies to labstation
              exec_name: servo_host_is_labstation
              docs:
                - Condition to check if the servohost is a labstation.
          dependencies:
            - name: Device is SSHable (ALWAYS_RUN) (time:'15s')
              exec_name: cros_access
              docs:
                - Verify that device is reachable by SSH.
                - Limited to 15 seconds.
              dependencies:
                - name: Set state:NO_SSH (ALWAYS_RUN)
                  exec_name: servo_set_servo_state
                  exec_args:
                    - state:NO_SSH
              recoveries:
                - name: Wait for labstation to load (time:'2m0s')
                  exec_name: cros_access
                  docs:
                    - Sometimes we can try to connect when labstation is the middle of reboot, so we wait.
                    - Labstation is expected to complete the reboot within 2 minutes.
            - name: Set state:SERVO_HOST_ISSUE (ALWAYS_RUN)
              exec_name: servo_set_servo_state
              exec_args:
                - state:SERVO_HOST_ISSUE
          recoveries:
            - name: Sleep 1s (Allow to fail) (ALWAYS_RUN) (time:'2s')
              exec_name: sample_sleep
              exec_args:
                - sleep:1
            - name: Create request to reboot labstation (ALWAYS_RUN)
              exec_name: sample_pass
              docs:
                - Try to create reboot flag file request.
              conditions:
                - name: Only applies to labstation
                  exec_name: servo_host_is_labstation
                  docs:
                    - Condition to check if the servohost is a labstation.
              dependencies:
                - name: cros_create_reboot_request
                  exec_name: cros_create_reboot_request
        - name: Has enough free disk space
          exec_name: cros_has_enough_storage_space
          exec_args:
            - /mnt/stateful_partition:0.5
          docs:
            - Check if stateful partition have enough disk space that is at least 0.5GB.
          conditions:
            - name: Only runs for physical labstation
              exec_name: servo_uses_servod_container
              exec_args:
                - reverse:true
          dependencies:
            - name: Device is SSHable (ALWAYS_RUN) (time:'15s')
              exec_name: cros_access
              docs:
                - Verify that device is reachable by SSH.
                - Limited to 15 seconds.
              dependencies:
                - name: Set state:NO_SSH (ALWAYS_RUN)
                  exec_name: servo_set_servo_state
                  exec_args:
                    - state:NO_SSH
              recoveries:
                - name: Wait for labstation to load (time:'2m0s')
                  exec_name: cros_access
                  docs:
                    - Sometimes we can try to connect when labstation is the middle of reboot, so we wait.
                    - Labstation is expected to complete the reboot within 2 minutes.
            - name: Set state:BROKEN (ALWAYS_RUN)
              exec_name: servo_set_servo_state
              exec_args:
                - state:BROKEN
          recoveries:
            - name: Remove logs and other files
              exec_name: sample_pass
              docs:
                - Clean up the old servod files as well as labstation.
              conditions:
                - name: Only applies to labstation
                  exec_name: servo_host_is_labstation
                  docs:
                    - Condition to check if the servohost is a labstation.
              dependencies:
                - name: servo_labstation_disk_cleanup
                  exec_name: servo_labstation_disk_cleanup
                - name: Remove logs older 5 days
                  exec_name: servo_servod_old_logs_cleanup
                  exec_args:
                    - max_days:5
                  docs:
                    - Clean up the old servod logs which older than 5 days.
            - name: Create request to reboot labstation (ALWAYS_RUN)
              exec_name: sample_pass
              docs:
                - Try to create reboot flag file request.
              conditions:
                - name: Only applies to labstation
                  exec_name: servo_host_is_labstation
                  docs:
                    - Condition to check if the servohost is a labstation.
              dependencies:
                - name: cros_create_reboot_request
                  exec_name: cros_create_reboot_request
        - name: Servo_v4(p1) main present
          exec_name: servo_v4_root_present
          exec_args:
            - update_topology:true
          docs:
            - Verify that servo_v4(p1) board is present
          dependencies:
            - name: Device is SSHable (ALWAYS_RUN) (time:'15s')
              exec_name: cros_access
              docs:
                - Verify that device is reachable by SSH.
                - Limited to 15 seconds.
              dependencies:
                - name: Set state:NO_SSH (ALWAYS_RUN)
                  exec_name: servo_set_servo_state
                  exec_args:
                    - state:NO_SSH
              recoveries:
                - name: Wait for labstation to load (time:'2m0s')
                  exec_name: cros_access
                  docs:
                    - Sometimes we can try to connect when labstation is the middle of reboot, so we wait.
                    - Labstation is expected to complete the reboot within 2 minutes.
            - name: Set state:NOT_CONNECTED (ALWAYS_RUN)
              exec_name: servo_set_servo_state
              exec_args:
                - state:NOT_CONNECTED
          recoveries:
            - name: Recover servo with Power-cycle by smart-hub (ALWAYS_RUN) (time:'2m0s')
              exec_name: servo_power_cycle_root_servo
              exec_args:
                - reset_timeout:60
                - wait_timeout:20
                - reset_authorized:false
              docs:
                - Try to power-cycle the servo via smart usbhub to recover it.
            - name: Create request to reboot labstation (ALWAYS_RUN)
              exec_name: sample_pass
              docs:
                - Try to create reboot flag file request.
              conditions:
                - name: Only applies to labstation
                  exec_name: servo_host_is_labstation
                  docs:
                    - Condition to check if the servohost is a labstation.
              dependencies:
                - name: cros_create_reboot_request
                  exec_name: cros_create_reboot_request
        - name: Update GenesysLogic Firmware for all servo_v4.1 (Allow to fail) (time:'10m10s')
          exec_name: cros_update_genesys_logic_firmware
          docs:
            - Attempt to update GenesysLogic firmware for all servos on the labstation if needed.
            - The update run will be a no-op if a servo is already updated to the target firmware.
          conditions:
            - name: Only runs for physical labstation
              exec_name: servo_uses_servod_container
              exec_args:
                - reverse:true
            - name: is_servo_v4p1_by_serial_number
              exec_name: is_servo_v4p1_by_serial_number
          dependencies:
            - name: Device is SSHable (ALWAYS_RUN) (time:'15s')
              exec_name: cros_access
              docs:
                - Verify that device is reachable by SSH.
                - Limited to 15 seconds.
              dependencies:
                - name: Set state:NO_SSH (ALWAYS_RUN)
                  exec_name: servo_set_servo_state
                  exec_args:
                    - state:NO_SSH
              recoveries:
                - name: Wait for labstation to load (time:'2m0s')
                  exec_name: cros_access
                  docs:
                    - Sometimes we can try to connect when labstation is the middle of reboot, so we wait.
                    - Labstation is expected to complete the reboot within 2 minutes.
        - name: All servo's fw updated (time:'5m0s')
          exec_name: servo_fw_need_update
          docs:
            - Check whether servo devices required firmware update.
            - Check running agains version specified by servo_updater channel.
          dependencies:
            - name: Device is SSHable (ALWAYS_RUN) (time:'15s')
              exec_name: cros_access
              docs:
                - Verify that device is reachable by SSH.
                - Limited to 15 seconds.
              dependencies:
                - name: Set state:NO_SSH (ALWAYS_RUN)
                  exec_name: servo_set_servo_state
                  exec_args:
                    - state:NO_SSH
              recoveries:
                - name: Wait for labstation to load (time:'2m0s')
                  exec_name: cros_access
                  docs:
                    - Sometimes we can try to connect when labstation is the middle of reboot, so we wait.
                    - Labstation is expected to complete the reboot within 2 minutes.
            - name: Set state:SERVO_UPDATER_ISSUE (ALWAYS_RUN)
              exec_name: servo_set_servo_state
              exec_args:
                - state:SERVO_UPDATER_ISSUE
          recoveries:
            - name: Sleep 1s (Allow to fail) (ALWAYS_RUN) (time:'2s')
              exec_name: sample_sleep
              exec_args:
                - sleep:1
            - name: Update all servo's firmware (RUN_ONCE) (time:'10m0s')
              exec_name: servo_update_servo_firmware
              exec_args:
                - try_attempt_count:3
                - try_force_update_after_fail:true
              docs:
                - Try to update in  normal ways 3 times, if fail allow run force update.
              dependencies:
                - name: Stop servod daemon on servo-host (time:'6m0s')
                  exec_name: servo_host_servod_init
                  exec_args:
                    - no_servod:true
                  docs:
                    - Make sure servod daemon is not running on servo-host.
                    - If container then run without daemon.
                    - If daemon is running it will be stopped.
        - name: Start servod daemon with recovery (time:'2m0s')
          exec_name: servo_host_servod_init
          exec_args:
            - recovery_mode:true
          docs:
            - Start servod daemon on servo-host with recovery mode.
          recoveries:
            - name: Stop servod (Allow to fail) (ALWAYS_RUN)
              exec_name: servo_host_servod_stop
              docs:
                - Stop the servod daemon.
                - Allowed to fail as can be run when servod is not running.
              dependencies:
                - name: Save UART capture (Allow to fail)
                  exec_name: servod_save_uart_capture
                  dependencies:
                    - name: Stop UART capture (Allow to fail)
                      exec_name: servod_stop_uart_capture
            - name: Create request to reboot labstation (ALWAYS_RUN)
              exec_name: sample_pass
              docs:
                - Try to create reboot flag file request.
              conditions:
                - name: Only applies to labstation
                  exec_name: servo_host_is_labstation
                  docs:
                    - Condition to check if the servohost is a labstation.
              dependencies:
                - name: cros_create_reboot_request
                  exec_name: cros_create_reboot_request
        - name: Servo Poweron Default Set (Allow to fail)
          exec_name: servo_set_poweron_defaults
          docs:
            - Configure servo to have correct default config values on power on
            - Set direction to servo-host ( current and default ) if Dolos configured for testbed.
          conditions:
            - name: is_servo_v4p1
              exec_name: is_servo_v4p1
        - name: Stop servod (Allow to fail) (ALWAYS_RUN)
          exec_name: servo_host_servod_stop
          docs:
            - Stop the servod daemon.
            - Allowed to fail as can be run when servod is not running.
          dependencies:
            - name: Save UART capture (Allow to fail)
              exec_name: servod_save_uart_capture
              dependencies:
                - name: Stop UART capture (Allow to fail)
                  exec_name: servod_stop_uart_capture
    - name: dolos (Allow to fail)
      criticalactions:
        - name: Set dolos state:DOLOS_NOT_PRESENT (ALWAYS_RUN)
          exec_name: dolos_set_dolos_state
          exec_args:
            - state:DOLOS_NOT_PRESENT
        - name: Is Dolos present
          exec_name: dolos_is_enabled
        - name: Device is sshable (time:'30s')
          exec_name: cros_access
          dependencies:
            - name: Set dolos state:NO_SSH (ALWAYS_RUN)
              exec_name: dolos_set_dolos_state
              exec_args:
                - state:NO_SSH
            - name: Device is pingable (time:'15s')
              exec_name: cros_ping
        - name: Uartname is known (Allow to fail)
          exec_name: dolos_is_uartname_cached
          dependencies:
            - name: Is Dolos present
              exec_name: dolos_is_enabled
          recoveries:
            - name: Discover uartname and save to cache
              exec_name: dolos_update_uartname_cache
              dependencies:
                - name: Device is sshable (time:'30s')
                  exec_name: cros_access
                  dependencies:
                    - name: Set dolos state:NO_SSH (ALWAYS_RUN)
                      exec_name: dolos_set_dolos_state
                      exec_args:
                        - state:NO_SSH
                    - name: Device is pingable (time:'15s')
                      exec_name: cros_ping
                - name: Is Dolos present
                  exec_name: dolos_is_enabled
        - name: Check firmware version is correct. (Allow to fail)
          exec_name: dolos_check_firmware_up_to_date
          recoveries:
            - name: dolos_update_firmware
              exec_name: dolos_update_firmware
        - name: Update state
          exec_name: dolos_determine_and_set_dolos_state
        - name: Dolos does not needs reboot
          exec_name: dolos_does_not_need_reboot
          recoveries:
            - name: Dolos call repair (Allow to fail)
              exec_name: dolos_call_repair
              docs:
                - Call the <doloscmd repair> utility which preforms a sequence of dolos
                - console commands to attempt to recover the device depending on the problems
                - the console is reporting.
            - name: Reboot dolos
              exec_name: sample_pass
              docs:
                - Dolos has two independent power sources, the wall power and the USB hub
                - power.  Both have to be disconnected for a reboot.
                - First switch off the RPM, then power cycle the USB hub port, then switch
                - on the RPM to accomplish this.
                - 20s reboot time allows dolos to boot ( 4-5 seconds ) and the USB devices
                - to be re-enumerated in the labstation kernel.
              dependencies:
                - name: Set dut RPM OFF (ALWAYS_RUN)
                  exec_name: device_rpm_power_off
                  exec_args:
                    - device_type:dut
                - name: Set dolos RPM OFF (ALWAYS_RUN) (time:'2m0s')
                  exec_name: device_rpm_power_off
                  exec_args:
                    - device_type:dolos
                - name: Sleep 5s (Allow to fail) (ALWAYS_RUN)
                  exec_name: sample_sleep
                  exec_args:
                    - sleep:5
                - name: Power cycle root servo (Allow to fail) (ALWAYS_RUN)
                  exec_name: servo_power_cycle_root_servo
                - name: Set dolos RPM ON (ALWAYS_RUN) (time:'2m0s')
                  exec_name: device_rpm_power_on
                  exec_args:
                    - device_type:dolos
                - name: Set dut RPM ON (ALWAYS_RUN)
                  exec_name: device_rpm_power_on
                  exec_args:
                    - device_type:dut
                - name: Sleep 20s (Allow to fail) (ALWAYS_RUN)
                  exec_name: sample_sleep
                  exec_args:
                    - sleep:20
    - name: servo
      criticalactions:
        - name: Set state:MISSING_CONFIG (ALWAYS_RUN)
          exec_name: servo_set_servo_state
          exec_args:
            - state:MISSING_CONFIG
        - name: Servod port specified (RUN_ONCE)
          exec_name: servo_servod_port_present
          docs:
            - Verify that servod port is present in servo data.
          dependencies:
            - name: Set state:WRONG_CONFIG (ALWAYS_RUN)
              exec_name: servo_set_servo_state
              exec_args:
                - state:WRONG_CONFIG
        - name: Servo serial is specified (RUN_ONCE)
          exec_name: dut_servo_has_serial
          docs:
            - Check if root servo serial is present.
          dependencies:
            - name: Set state:WRONG_CONFIG (ALWAYS_RUN)
              exec_name: servo_set_servo_state
              exec_args:
                - state:WRONG_CONFIG
        - name: Initialize docker container (time:'6m0s')
          exec_name: servo_host_servod_init
          exec_args:
            - no_servod:true
          docs:
            - Initiate docker to have access to the host.
            - Servod is not needed as on this stage we just verify that servo host is good.
            - If start container with servod and root servo device is not connected it will fail.
          conditions:
            - name: Uses servod container
              exec_name: servo_uses_servod_container
              docs:
                - Condition to check if servo uses servod container.
          dependencies:
            - name: Set state:NO_SSH (ALWAYS_RUN)
              exec_name: servo_set_servo_state
              exec_args:
                - state:NO_SSH
          recoveries:
            - name: Stop servod (Allow to fail) (ALWAYS_RUN)
              exec_name: servo_host_servod_stop
              docs:
                - Stop the servod daemon.
                - Allowed to fail as can be run when servod is not running.
              dependencies:
                - name: Save UART capture (Allow to fail)
                  exec_name: servod_save_uart_capture
                  dependencies:
                    - name: Stop UART capture (Allow to fail)
                      exec_name: servod_stop_uart_capture
        - name: Device is SSHable (ALWAYS_RUN) (time:'15s')
          exec_name: cros_access
          docs:
            - Verify that device is reachable by SSH.
            - Limited to 15 seconds.
          dependencies:
            - name: Set state:NO_SSH (ALWAYS_RUN)
              exec_name: servo_set_servo_state
              exec_args:
                - state:NO_SSH
          recoveries:
            - name: Wait for labstation to load (time:'2m0s')
              exec_name: cros_access
              docs:
                - Sometimes we can try to connect when labstation is the middle of reboot, so we wait.
                - Labstation is expected to complete the reboot within 2 minutes.
        - name: Mark labstation as servod is in-use
          exec_name: cros_create_servo_in_use
          docs:
            - Create lock file is_in_use.
          conditions:
            - name: Only applies to labstation
              exec_name: servo_host_is_labstation
              docs:
                - Condition to check if the servohost is a labstation.
          dependencies:
            - name: Device is SSHable (ALWAYS_RUN) (time:'15s')
              exec_name: cros_access
              docs:
                - Verify that device is reachable by SSH.
                - Limited to 15 seconds.
              dependencies:
                - name: Set state:NO_SSH (ALWAYS_RUN)
                  exec_name: servo_set_servo_state
                  exec_args:
                    - state:NO_SSH
              recoveries:
                - name: Wait for labstation to load (time:'2m0s')
                  exec_name: cros_access
                  docs:
                    - Sometimes we can try to connect when labstation is the middle of reboot, so we wait.
                    - Labstation is expected to complete the reboot within 2 minutes.
            - name: Set state:SERVO_HOST_ISSUE (ALWAYS_RUN)
              exec_name: servo_set_servo_state
              exec_args:
                - state:SERVO_HOST_ISSUE
          recoveries:
            - name: Sleep 1s (Allow to fail) (ALWAYS_RUN) (time:'2s')
              exec_name: sample_sleep
              exec_args:
                - sleep:1
            - name: Create request to reboot labstation (ALWAYS_RUN)
              exec_name: sample_pass
              docs:
                - Try to create reboot flag file request.
              conditions:
                - name: Only applies to labstation
                  exec_name: servo_host_is_labstation
                  docs:
                    - Condition to check if the servohost is a labstation.
              dependencies:
                - name: cros_create_reboot_request
                  exec_name: cros_create_reboot_request
        - name: Read release info (Allow to fail) (RUN_ONCE)
          exec_name: cros_run_command
          exec_args:
            - 'host:'
            - command:cat /etc/lsb-release
          docs:
            - Read host release data for future analysis.
          conditions:
            - name: Only runs for physical labstation
              exec_name: servo_uses_servod_container
              exec_args:
                - reverse:true
          dependencies:
            - name: Device is SSHable (ALWAYS_RUN) (time:'15s')
              exec_name: cros_access
              docs:
                - Verify that device is reachable by SSH.
                - Limited to 15 seconds.
              dependencies:
                - name: Set state:NO_SSH (ALWAYS_RUN)
                  exec_name: servo_set_servo_state
                  exec_args:
                    - state:NO_SSH
              recoveries:
                - name: Wait for labstation to load (time:'2m0s')
                  exec_name: cros_access
                  docs:
                    - Sometimes we can try to connect when labstation is the middle of reboot, so we wait.
                    - Labstation is expected to complete the reboot within 2 minutes.
            - name: Set state:SERVO_HOST_ISSUE (ALWAYS_RUN)
              exec_name: servo_set_servo_state
              exec_args:
                - state:SERVO_HOST_ISSUE
        - name: Power-cycle by smart-hub (Allow to fail) (RUN_ONCE) (time:'2m0s')
          exec_name: servo_power_cycle_root_servo
          exec_args:
            - reset_timeout:60
            - wait_timeout:20
            - reset_authorized:false
          docs:
            - Try to reset(power-cycle) the servo via smart usbhub.
          conditions:
            - name: Only run if DUT ping fails (ALWAYS_RUN)
              exec_name: sample_fail
              docs:
                - Verify if DUT is not SSH-able
              conditions:
                - name: DUT is pingable (ALWAYS_RUN) (time:'15s')
                  exec_name: cros_ping
                  exec_args:
                    - device_type:dut
                  docs:
                    - verify if DUT is SSH-able
          dependencies:
            - name: Device is SSHable (ALWAYS_RUN) (time:'15s')
              exec_name: cros_access
              docs:
                - Verify that device is reachable by SSH.
                - Limited to 15 seconds.
              dependencies:
                - name: Set state:NO_SSH (ALWAYS_RUN)
                  exec_name: servo_set_servo_state
                  exec_args:
                    - state:NO_SSH
              recoveries:
                - name: Wait for labstation to load (time:'2m0s')
                  exec_name: cros_access
                  docs:
                    - Sometimes we can try to connect when labstation is the middle of reboot, so we wait.
                    - Labstation is expected to complete the reboot within 2 minutes.
        - name: Has enough free disk space
          exec_name: cros_has_enough_storage_space
          exec_args:
            - /mnt/stateful_partition:0.5
          docs:
            - Check if stateful partition have enough disk space that is at least 0.5GB.
          conditions:
            - name: Only runs for physical labstation
              exec_name: servo_uses_servod_container
              exec_args:
                - reverse:true
          dependencies:
            - name: Device is SSHable (ALWAYS_RUN) (time:'15s')
              exec_name: cros_access
              docs:
                - Verify that device is reachable by SSH.
                - Limited to 15 seconds.
