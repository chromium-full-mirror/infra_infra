plans:
    - name: cros_base
      criticalactions:
        - name: 'Set state: needs_repair'
          exec_name: dut_set_state
          exec_args:
            - state:needs_repair
          docs:
            - The action set devices with state means that DUT requires repair.
        - name: Start ADB-base (time:'2m0s')
          exec_name: ctr_start_adb_container
          docs:
            - Pull and run adb-base container
          conditions:
            - name: Do not run on Mobile Harness box (RUN_ONCE)
              exec_name: env_is_not_mh_box
              docs:
                - Check that the process is not running on Mobile Harness box.
            - name: CrosToolRunner is up
              exec_name: ctr_is_up
              docs:
                - 'Verify that cros-tool-runner service is up and running, '
                - the tool expected to start as part of system preparation.
        - name: Start Servo-Nexus (time:'4m0s')
          exec_name: ctr_servo_nexus_start_container
          docs:
            - Pull and run servo-nexus container
          conditions:
            - name: Do not run on Mobile Harness box (RUN_ONCE)
              exec_name: env_is_not_mh_box
              docs:
                - Check that the process is not running on Mobile Harness box.
            - name: Testbed has Servo (RUN_ONCE)
              exec_name: dut_servo_host_present
            - name: CrosToolRunner is up
              exec_name: ctr_is_up
              docs:
                - 'Verify that cros-tool-runner service is up and running, '
                - the tool expected to start as part of system preparation.
    - name: cros
      criticalactions:
        - name: Mark labstation as servod is in-use (Allow to fail)
          exec_name: cros_create_servo_in_use
          docs:
            - Create lock file is_in_use.
          conditions:
            - name: Only applies to labstation (ALWAYS_RUN)
              exec_name: servo_host_is_labstation
              docs:
                - Condition to check if the servohost is a labstation.
        - name: Mark base on OS-restriction
          exec_name: cros_set_from_os_restriction
          docs:
            - Mark DUT base on OS restriction.
        - name: Has repair-request for re-image USB-key
          exec_name: dut_has_any_repair_requests
          exec_args:
            - requests:UPDATE_USBKEY_IMAGE
          docs:
            - Check if UPDATE_USBKEY_IMAGE repair-request is present.
        - name: Has repair-request for reflash-firmware
          exec_name: dut_has_any_repair_requests
          exec_args:
            - requests:REFLASH_FW
          docs:
            - Check if REFLASH_FW repair-request is present.
        - name: Has repair-request for re-image by USB-key
          exec_name: dut_has_any_repair_requests
          exec_args:
            - requests:REIMAGE_BY_USBKEY
          docs:
            - Check if REIMAGE_BY_USBKEY repair-request is present.
        - name: Device is pingable (ALWAYS_RUN) (time:'15s')
          exec_name: cros_ping
          docs:
            - Verify that device is reachable by ping.
            - Limited to 15 seconds.
        - name: Mark DUT as Android if applicable
          exec_name: cros_set_as_android_based
          docs:
            - Mark DUT as Android, based on ADB responses.
          conditions:
            - name: Run if not restricted to ChromeOS only
              exec_name: cros_not_match_os_restriction
              exec_args:
                - restrictions:OSR_CHROMEOS_ONLY
              docs:
                - OS does not limited by ChromeOS only
            - name: Mark as ChromeOS based (ALWAYS_RUN)
              exec_name: cros_set_as_chrome_based
              docs:
                - Mark DUT as Chrome based.
            - name: Device is not accessible (simple) (ALWAYS_RUN)
              exec_name: sample_fail
              docs:
                - Verify that device is not reachable by SSH.
              conditions:
                - name: Device is accessible (simple) (ALWAYS_RUN) (time:'15s')
                  exec_name: cros_access
                  docs:
                    - Verify that device is reachable by SSH.
                    - Limited to 15 seconds.
            - name: ADB Connect DUT (ALWAYS_RUN)
              exec_name: ctr_adb_connect
              exec_args:
                - retry_count:3
                - retry_interval:1
                - timeout:10
                - skip_when_connected:true
              docs:
                - Exec ADB connect to the DUT by ethernet.
        - name: Chrome OS checks
          exec_name: sample_pass
          docs:
            - Run DUT readiness checks for Chrome based DUTs.
          conditions:
            - name: Run only on ChromeOS based DUT (ALWAYS_RUN)
              exec_name: cros_is_not_android_based
              docs:
                - Check if device is marked as ChromeOS based
          dependencies:
            - name: Mark as ChromeOS based (ALWAYS_RUN)
              exec_name: cros_set_as_chrome_based
              docs:
                - Mark DUT as Chrome based.
            - name: Reset provisioned info (ALWAYS_RUN)
              exec_name: cros_reset_provision_info
              docs:
                - Reset all provision info.
            - name: Enable verbose network logging for cellular DUTs (Allow to fail)
              exec_name: sample_pass
              docs:
                - Enables verbose logging of networking daemons.
              conditions:
                - name: Is in cellular pool (RUN_ONCE)
                  exec_name: dut_is_in_pool_regex
                  exec_args:
                    - regex:(?i)^cellular
                  docs:
                    - Verify that DUT is not in a cellular pool.
                - name: Device is accessible (ALWAYS_RUN) (time:'15s')
                  exec_name: cros_access
                  docs:
                    - Verify that device is reachable by SSH.
                    - Limited to 15 seconds.
              dependencies:
                - name: Enable verbose shill logs (Allow to fail)
                  exec_name: cros_set_verbose_shill_logs
                  exec_args:
                    - is_enabled:true
                  docs:
                    - Enables verbose logging of shill network manager.
                  dependencies:
                    - name: Device is accessible (ALWAYS_RUN) (time:'15s')
                      exec_name: cros_access
                      docs:
                        - Verify that device is reachable by SSH.
                        - Limited to 15 seconds.
                    - name: Is shill debug CLI present
                      exec_name: cros_is_tool_present
                      exec_args:
                        - tools:ff_debug
                      docs:
                        - Checks if shill debug utility can be found in DUT cli.
                      dependencies:
                        - name: Device is accessible (ALWAYS_RUN) (time:'15s')
                          exec_name: cros_access
                          docs:
                            - Verify that device is reachable by SSH.
                            - Limited to 15 seconds.
                - name: Enable verbose ModemManager logs (Allow to fail)
                  exec_name: cros_set_verbose_mm_logs
                  exec_args:
                    - is_enabled:true
                  docs:
                    - Enables verbose logging of modem manager.
                  dependencies:
                    - name: Device is accessible (ALWAYS_RUN) (time:'15s')
                      exec_name: cros_access
                      docs:
                        - Verify that device is reachable by SSH.
                        - Limited to 15 seconds.
                    - name: Is modem CLI present
                      exec_name: cros_is_tool_present
                      exec_args:
                        - tools:modem
                      docs:
                        - Checks if modem utility can be found in DUT cli.
                      dependencies:
                        - name: Device is accessible (ALWAYS_RUN) (time:'15s')
                          exec_name: cros_access
                          docs:
                            - Verify that device is reachable by SSH.
                            - Limited to 15 seconds.
            - name: Collect logs and crashinfo (Allow to fail) (RUN_ONCE)
              exec_name: sample_pass
              docs:
                - 'We collect any pre-existing logs from before deletes such logs '
                - 'on the DUT. Any logs collection are not critical, and we marks '
                - that action attempt to perform to avoid repeating it.
              conditions:
                - name: Device is accessible (ALWAYS_RUN) (time:'15s')
                  exec_name: cros_access
                  docs:
                    - Verify that device is reachable by SSH.
                    - Limited to 15 seconds.
                - name: Confirm log collection info does not exist
                  exec_name: cros_confirm_file_not_exists
                  exec_args:
                    - target_file:log_collection_info
                  docs:
                    - 'We need to check whether the log collection info file already '
                    - 'exists in the file system. A pre-existing file indicates that '
                    - 'the collection of any pre-existing logs has already been '
                    - tried to be collected.
              dependencies:
                - name: Create log collection info (RUN_ONCE)
                  exec_name: cros_create_log_collection_info
                  exec_args:
                    - info_file:log_collection_info
                  docs:
                    - 'When the log collection completes, we create an info file that '
                    - indicates the successful completion of the collection process.
                  conditions:
                    - name: Confirm log collection info does not exist
                      exec_name: cros_confirm_file_not_exists
                      exec_args:
                        - target_file:log_collection_info
                      docs:
                        - 'We need to check whether the log collection info file already '
                        - 'exists in the file system. A pre-existing file indicates that '
                        - 'the collection of any pre-existing logs has already been '
                        - tried to be collected.
                - name: Collect logs from DUT on /var/log/* (Allow to fail) (RUN_ONCE)
                  exec_name: cros_copy_to_logs
                  exec_args:
                    - src_host_type:dut
                    - src_path:/var/log
                    - src_type:dir
                    - use_host_dir:true
                    - dest_suffix:prior_logs
                  docs:
                    - 'We collect any pre-existing logs before executing repairs on '
                    - 'the DUT. Any failures with this initial log collection are '
                    - not critical.
                  conditions:
                    - name: Device is accessible (ALWAYS_RUN) (time:'15s')
                      exec_name: cros_access
                      docs:
                        - Verify that device is reachable by SSH.
                        - Limited to 15 seconds.
                - name: Collect logs from DUT on /sys/fs/pstore/* (Allow to fail) (RUN_ONCE)
                  exec_name: cros_copy_to_logs
                  exec_args:
                    - src_host_type:dut
                    - src_path:/sys/fs/pstore
                    - src_type:dir
                    - use_host_dir:true
                    - dest_suffix:prior_pstore
                  docs:
                    - 'We collect kernel persistent storage file system before '
                    - 'executing repairs on the DUT. Any failures with this initial '
                    - log collection are not critical.
                  conditions:
                    - name: Device is accessible (ALWAYS_RUN) (time:'15s')
                      exec_name: cros_access
                      docs:
                        - Verify that device is reachable by SSH.
                        - Limited to 15 seconds.
                - name: Collect dmesg (Allow to fail) (RUN_ONCE)
                  exec_name: cros_dmesg
                  exec_args:
                    - human_readable:false
                    - device_type:dut
                    - create_crashinfo_dir:true
                  docs:
                    - We collect the dmesg output.
                  conditions:
                    - name: Device is accessible (ALWAYS_RUN) (time:'15s')
                      exec_name: cros_access
                      docs:
                        - Verify that device is reachable by SSH.
                        - Limited to 15 seconds.
                - name: Collect crash dumps (Allow to fail) (RUN_ONCE)
                  exec_name: cros_collect_crash_dumps
                  exec_args:
                    - clean:true
                    - cleanup_timeout:10
                  docs:
                    - 'We collect the crash dumps on the DUT. Additionally, the files '
                    - 'on the source are deleted, irrespective of whether the '
                    - copy-attempt completes with success or not.
                  conditions:
                    - name: Device is accessible (ALWAYS_RUN) (time:'15s')
                      exec_name: cros_access
                      docs:
                        - Verify that device is reachable by SSH.
                        - Limited to 15 seconds.
            - name: Device is accessible (ALWAYS_RUN) (time:'15s')
              exec_name: cros_access
              docs:
                - Verify that device is reachable by SSH.
                - Limited to 15 seconds.
            - name: Read bootId
              exec_name: cros_read_bootid
              exec_args:
                - skip_empty:true
                - publish:true
              docs:
                - Read bootid and public to config scope.
            - name: Device Uptime (Allow to fail)
              exec_name: cros_uptime_print
              docs:
                - Print uptime of the DUT.
            - name: Verify access to cache (Allow to fail) (ALWAYS_RUN)
              exec_name: cache_download_check
              docs:
                - Verifies connection to the cache service.
                - Connection checked from the DUT.
              conditions:
                - name: Run only in main lab
                  exec_name: sample_fail
                  docs:
                    - Verify that DUT name is in main lab.
                  conditions:
                    - name: Run only on Satlab
                      exec_name: dut_regex_name_match
                      exec_args:
                        - regex:^satlab
                      docs:
                        - Verify that DUT name is belong Satlab.
            - name: Set dev_boot_usb is enabled (Allow to fail) (RUN_ONCE)
              exec_name: cros_update_crossystem
              exec_args:
                - command:dev_boot_usb
                - value:1
                - check_after_update:true
              docs:
                - Set dev_boot_usb=1 to enable booting from USB drive in DEV mode.
              conditions:
                - name: Run only on ChromeOS hardware (RUN_ONCE)
                  exec_name: dut_check_board
                  exec_args:
                    - string_values:aurora,reven
                    - invert_result:true
                  docs:
                    - Check that DUT is a Chromebook by checking for non-Chromebook boards
            - name: Internal storage is responsive
              exec_name: cros_is_file_system_writable
              exec_args:
                - paths:/mnt/stateful_partition,/var/tmp
              docs:
                - Verify that internal storage is responsive
              dependencies:
                - name: Run only on ChromeOS based DUT (ALWAYS_RUN)
                  exec_name: cros_is_not_android_based
                  docs:
                    - Check if device is marked as ChromeOS based
                - name: Device is accessible (ALWAYS_RUN) (time:'15s')
                  exec_name: cros_access
                  docs:
                    - Verify that device is reachable by SSH.
                    - Limited to 15 seconds.
            - name: Kernel does not know issues
              exec_name: cros_has_critical_kernel_error
              docs:
                - Verify instrenal storage is writable.
                - If linux has some hardware error then file system can became read-only.
              dependencies:
                - name: Device is accessible (ALWAYS_RUN) (time:'15s')
                  exec_name: cros_access
                  docs:
                    - Verify that device is reachable by SSH.
                    - Limited to 15 seconds.
            - name: Stateful partition has enough free index nodes
              exec_name: cros_has_enough_index_nodes
              exec_args:
                - /mnt/stateful_partition:100
              docs:
                - Check the stateful partition path has enough index nodes.
            - name: Stateful partition has enough free space
              exec_name: cros_has_enough_storage_space
              exec_args:
                - /mnt/stateful_partition:0.7
              docs:
                - Check the stateful partition have enough disk space.
                - Expected to have free 0.1GB storage unit.
            - name: Stateful partition (encrypted) has enough free space
              exec_name: cros_has_enough_storage_space
              exec_args:
                - /var/tmp:0.1
              docs:
                - Check the encrypted stateful partition have enough disk space.
                - Expected to have free 0.1GB storage unit.
            - name: Verify if booted from priority kernel
              exec_name: cros_kernel_priority_has_not_changed
              docs:
                - Kernel can wait for reboot as the last provisioning waiting for some issue.
                - Verified if DUT's kernel doesn't waiting for update.
              conditions:
                - name: Device is accessible (ALWAYS_RUN) (time:'15s')
                  exec_name: cros_access
                  docs:
                    - Verify that device is reachable by SSH.
                    - Limited to 15 seconds.
            - name: Verify rootfs is on fs-verity (ALWAYS_RUN)
              exec_name: cros_verify_rootfs_verity
              docs:
                - Run rootdev to check rootfs
              conditions:
                - name: Run only on ChromeOS hardware (RUN_ONCE)
                  exec_name: dut_check_board
                  exec_args:
                    - string_values:aurora,reven
                    - invert_result:true
                  docs:
                    - Check that DUT is a Chromebook by checking for non-Chromebook boards
              dependencies:
                - name: Device is accessible (ALWAYS_RUN) (time:'15s')
                  exec_name: cros_access
                  docs:
                    - Verify that device is reachable by SSH.
                    - Limited to 15 seconds.
            - name: Check KVM is enabled (Allow to fail) (time:'15s')
              exec_name: cros_run_command
              exec_args:
                - host:dut
                - command:ls /dev/kvm
                - background:false
              docs:
                - Check KVM is enabled from KVM device path on the DUT
              dependencies:
                - name: Internal storage is responsive
                  exec_name: cros_is_file_system_writable
                  exec_args:
                    - paths:/mnt/stateful_partition,/var/tmp
                  docs:
                    - Verify that internal storage is responsive
                  dependencies:
                    - name: Run only on ChromeOS based DUT (ALWAYS_RUN)
                      exec_name: cros_is_not_android_based
                      docs:
                        - Check if device is marked as ChromeOS based
                    - name: Device is accessible (ALWAYS_RUN) (time:'15s')
                      exec_name: cros_access
                      docs:
                        - Verify that device is reachable by SSH.
                        - Limited to 15 seconds.
            - name: Has repair-request for re-provision
              exec_name: dut_has_any_repair_requests
              exec_args:
                - requests:PROVISION
              docs:
                - Check if PROVISION repair-request is present.
            - name: Check if last provision was good
              exec_name: cros_is_last_provision_successful
              docs:
                - Check if last provision fail on the DUT
              dependencies:
                - name: Internal storage is responsive
                  exec_name: cros_is_file_system_writable
                  exec_args:
                    - paths:/mnt/stateful_partition,/var/tmp
                  docs:
                    - Verify that internal storage is responsive
                  dependencies:
                    - name: Run only on ChromeOS based DUT (ALWAYS_RUN)
                      exec_name: cros_is_not_android_based
                      docs:
                        - Check if device is marked as ChromeOS based
                    - name: Device is accessible (ALWAYS_RUN) (time:'15s')
                      exec_name: cros_access
                      docs:
                        - Verify that device is reachable by SSH.
                        - Limited to 15 seconds.
            - name: Read OS version
              exec_name: cros_read_os_version
              docs:
                - Read and log current OS version.
            - name: Python is present
              exec_name: cros_has_python_interpreter_working
              docs:
                - Verify that device has python on it.
              dependencies:
                - name: Internal storage is responsive
                  exec_name: cros_is_file_system_writable
                  exec_args:
                    - paths:/mnt/stateful_partition,/var/tmp
                  docs:
                    - Verify that internal storage is responsive
                  dependencies:
                    - name: Run only on ChromeOS based DUT (ALWAYS_RUN)
                      exec_name: cros_is_not_android_based
                      docs:
                        - Check if device is marked as ChromeOS based
                    - name: Device is accessible (ALWAYS_RUN) (time:'15s')
                      exec_name: cros_access
                      docs:
                        - Verify that device is reachable by SSH.
                        - Limited to 15 seconds.
            - name: Verify that device is not enrolled (Allow to fail)
              exec_name: cros_is_enrollment_in_clean_state
              docs:
                - Verify that the device's enrollment state is clean.
              dependencies:
                - name: Internal storage is responsive
                  exec_name: cros_is_file_system_writable
                  exec_args:
                    - paths:/mnt/stateful_partition,/var/tmp
                  docs:
                    - Verify that internal storage is responsive
                  dependencies:
                    - name: Run only on ChromeOS based DUT (ALWAYS_RUN)
                      exec_name: cros_is_not_android_based
                      docs:
                        - Check if device is marked as ChromeOS based
                    - name: Device is accessible (ALWAYS_RUN) (time:'15s')
                      exec_name: cros_access
                      docs:
                        - Verify that device is reachable by SSH.
                        - Limited to 15 seconds.
            - name: Check power sources
              exec_name: sample_pass
              docs:
                - Check for the AC power, and battery charging capability.
              conditions:
                - name: Run only on ChromeOS hardware (RUN_ONCE)
                  exec_name: dut_check_board
                  exec_args:
                    - string_values:aurora,reven
                    - invert_result:true
                  docs:
                    - Check that DUT is a Chromebook by checking for non-Chromebook boards
                - name: cros_is_not_virtual_machine
                  exec_name: cros_is_not_virtual_machine
              dependencies:
                - name: Power is recognized by DUT
                  exec_name: cros_is_ac_power_connected
                  docs:
                    - Verify that power is recognized by the DUT as marker as online.
                - name: Battery is changing or have accepted level
                  exec_name: cros_is_battery_chargable_or_good_level
                  docs:
                    - Check the battery charging state.
                  conditions:
                    - name: cros_is_battery_expected
                      exec_name: cros_is_battery_expected
                    - name: cros_is_not_virtual_machine
                      exec_name: cros_is_not_virtual_machine
                    - name: Battery is expected on device
                      exec_name: dut_has_battery
                      docs:
                        - Verifies that device is expected to have battery based on DUT info.
                    - name: Battery is present on device (ALWAYS_RUN)
                      exec_name: cros_is_battery_present
                      docs:
                        - Verifies if battery present is reported as present in power supply info.
            - name: Check TPM statuses
              exec_name: cros_is_tpm_in_good_status
              docs:
                - Verify that TPM statuses is ok.
              conditions:
                - name: Run only on ChromeOS hardware (RUN_ONCE)
                  exec_name: dut_check_board
                  exec_args:
                    - string_values:aurora,reven
                    - invert_result:true
                  docs:
                    - Check that DUT is a Chromebook by checking for non-Chromebook boards
                - name: cros_is_not_virtual_machine
                  exec_name: cros_is_not_virtual_machine
                - name: cros_is_tpm_present
                  exec_name: cros_is_tpm_present
            - name: Read TPM ownership (Allow to fail)
              exec_name: cros_run_command
              exec_args:
                - host:dut
                - command:hwsec-ownership-id id
              docs:
                - That is initiate action to detect issues for b/246476353
                - No recovery action just verify and report of issue.
                - Verify that we can read ownership on device.
              conditions:
                - name: Device is accessible (ALWAYS_RUN) (time:'15s')
                  exec_name: cros_access
                  docs:
                    - Verify that device is reachable by SSH.
                    - Limited to 15 seconds.
                - name: Is hwsec-ownership-id expected
                  exec_name: cros_is_on_expected_version
                  exec_args:
                    - min_version:101
                  docs:
                    - The hwsec-ownership-id is expected from R101 version of ChromeOS on the DUT.
                  conditions:
                    - name: Device is accessible (ALWAYS_RUN) (time:'15s')
                      exec_name: cros_access
                      docs:
                        - Verify that device is reachable by SSH.
                        - Limited to 15 seconds.
            - name: Verify tpm_fwver is updated correctly
              exec_name: cros_match_dev_tpm_firmware_version
              docs:
                - For dev-signed firmware, tpm_fwver reported from crossystem should always be 0x10001.
                - Firmware update on DUTs with incorrect tpm_fwver may fail due to firmware rollback protection.
              conditions:
                - name: Run only on ChromeOS hardware (RUN_ONCE)
                  exec_name: dut_check_board
                  exec_args:
                    - string_values:aurora,reven
                    - invert_result:true
                  docs:
                    - Check that DUT is a Chromebook by checking for non-Chromebook boards
              dependencies:
                - name: Internal storage is responsive
                  exec_name: cros_is_file_system_writable
                  exec_args:
                    - paths:/mnt/stateful_partition,/var/tmp
                  docs:
                    - Verify that internal storage is responsive
                  dependencies:
                    - name: Run only on ChromeOS based DUT (ALWAYS_RUN)
                      exec_name: cros_is_not_android_based
                      docs:
                        - Check if device is marked as ChromeOS based
                    - name: Device is accessible (ALWAYS_RUN) (time:'15s')
                      exec_name: cros_access
                      docs:
                        - Verify that device is reachable by SSH.
                        - Limited to 15 seconds.
            - name: Verify tpm_kernver is updated correctly
              exec_name: cros_match_dev_tpm_kernel_version
              docs:
                - For dev-signed firmware, tpm_kernver reported from crossystem should always be 0x10001.
                - Firmware update on DUTs with incorrect tpm_kernver may fail due to firmware rollback protection.
              conditions:
                - name: Run only on ChromeOS hardware (RUN_ONCE)
                  exec_name: dut_check_board
                  exec_args:
                    - string_values:aurora,reven
                    - invert_result:true
                  docs:
                    - Check that DUT is a Chromebook by checking for non-Chromebook boards
              dependencies:
                - name: Internal storage is responsive
                  exec_name: cros_is_file_system_writable
                  exec_args:
                    - paths:/mnt/stateful_partition,/var/tmp
                  docs:
                    - Verify that internal storage is responsive
                  dependencies:
                    - name: Run only on ChromeOS based DUT (ALWAYS_RUN)
                      exec_name: cros_is_not_android_based
                      docs:
                        - Check if device is marked as ChromeOS based
                    - name: Device is accessible (ALWAYS_RUN) (time:'15s')
                      exec_name: cros_access
                      docs:
                        - Verify that device is reachable by SSH.
                        - Limited to 15 seconds.
            - name: Verify present of gsctool (Allow to fail)
              exec_name: cros_run_shell_command
              exec_args:
                - gsctool -a -f
              docs:
                - Confirm that the GSC tool is function.
                - Applicable only if device has Google security chip.
              conditions:
                - name: Run only on ChromeOS hardware (RUN_ONCE)
                  exec_name: dut_check_board
                  exec_args:
                    - string_values:aurora,reven
                    - invert_result:true
                  docs:
                    - Check that DUT is a Chromebook by checking for non-Chromebook boards
                - name: DUT has Cr50 phase label
                  exec_name: dut_has_cr50
                  docs:
                    - Check if the DUT has Cr50.
              dependencies:
                - name: Device is accessible (simple) (ALWAYS_RUN) (time:'15s')
                  exec_name: cros_access
                  docs:
                    - Verify that device is reachable by SSH.
                    - Limited to 15 seconds.
            - name: Audit battery (Allow to fail)
              exec_name: cros_audit_battery
              docs:
                - Check battery on the DUT is normal and update battery hardware state accordingly.
              conditions:
                - name: Run only on ChromeOS hardware (RUN_ONCE)
                  exec_name: dut_check_board
                  exec_args:
                    - string_values:aurora,reven
                    - invert_result:true
                  docs:
                    - Check that DUT is a Chromebook by checking for non-Chromebook boards
