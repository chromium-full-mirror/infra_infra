                - name: Device is accessible (ALWAYS_RUN) (time:'15s')
                  exec_name: cros_access
                  docs:
                    - Verify that device is reachable by SSH.
                    - Limited to 15 seconds.
                - name: Is crosid present
                  exec_name: cros_run_command
                  exec_args:
                    - 'host:'
                    - command:which crosid
                  docs:
                    - Verify if crosid cli is present on the ChromeOS
            - name: Update special device labels
              exec_name: sample_pass
              docs:
                - Read special labels everytime as part of repair process.
              dependencies:
                - name: Collect SKU value (Allow to fail)
                  exec_name: cros_update_device_sku
                  docs:
                    - Update the device_sku label from the device if not present in inventory data.
                  conditions:
                    - name: Run only on ChromeOS hardware (RUN_ONCE)
                      exec_name: dut_check_board
                      exec_args:
                        - string_values:aurora,reven
                        - invert_result:true
                      docs:
                        - Check that DUT is a Chromebook by checking for non-Chromebook boards
                - name: Read Cr50 PHASE (Allow to fail)
                  exec_name: cros_update_cr50_label
                  docs:
                    - Update the cr50 phase label from device.
                  conditions:
                    - name: Is gsctool present on the host
                      exec_name: cros_run_shell_command
                      exec_args:
                        - gsctool -a -f
                      docs:
                        - Checks if the cr 50 firmware exists on the DUT by running the gsctool version command.
                        - The action working as condition. Please do not exclude based on labels.
                      dependencies:
                        - name: Device is accessible (simple) (ALWAYS_RUN) (time:'15s')
                          exec_name: cros_access
                          docs:
                            - Verify that device is reachable by SSH.
                            - Limited to 15 seconds.
                - name: Read Cr50 key ID (Allow to fail)
                  exec_name: cros_update_cr50_key_id_label
                  docs:
                    - Update the cr50 key ID from device.
                  conditions:
                    - name: Is gsctool present on the host
                      exec_name: cros_run_shell_command
                      exec_args:
                        - gsctool -a -f
                      docs:
                        - Checks if the cr 50 firmware exists on the DUT by running the gsctool version command.
                        - The action working as condition. Please do not exclude based on labels.
                      dependencies:
                        - name: Device is accessible (simple) (ALWAYS_RUN) (time:'15s')
                          exec_name: cros_access
                          docs:
                            - Verify that device is reachable by SSH.
                            - Limited to 15 seconds.
                - name: Read if audio loopback present (Allow to fail)
                  exec_name: cros_update_audio_loopback_state_label
                  docs:
                    - Update the audio_loop_back label on the cros Device.
                  conditions:
                    - name: Audio loopback state is not WORKING
                      exec_name: sample_fail
                      docs:
                        - Confirm that the DUT's audio loopback state is in not working state
                      conditions:
                        - name: cros_is_audio_loopback_state_working
                          exec_name: cros_is_audio_loopback_state_working
                - name: Read dlm_sku_id (Allow to fail)
                  exec_name: cros_update_dlm_sku_id
                  docs:
                    - Update the dlm_sku_id label from the device if not present in inventory data.
                  conditions:
                    - name: Run only on ChromeOS hardware (RUN_ONCE)
                      exec_name: dut_check_board
                      exec_args:
                        - string_values:aurora,reven
                        - invert_result:true
                      docs:
                        - Check that DUT is a Chromebook by checking for non-Chromebook boards
                - name: Update RO_VPD from DUT to Inventory
                  exec_name: cros_update_ro_vpd_inventory
                  exec_args:
                    - allow_override:false
                  docs:
                    - Record data that is present in RO_VPD of DUT to inventory.
                    - Skip update values if already known by inventory.
                  dependencies:
                    - name: Device is accessible (ALWAYS_RUN) (time:'15s')
                      exec_name: cros_access
                      docs:
                        - Verify that device is reachable by SSH.
                        - Limited to 15 seconds.
                - name: Collect storage type (Allow to fail) (ALWAYS_RUN)
                  exec_name: cros_update_storage_type_to_inventory
                  docs:
                    - Read storage type from DUT.
                  conditions:
                    - name: Run only on ChromeOS hardware (RUN_ONCE)
                      exec_name: dut_check_board
                      exec_args:
                        - string_values:aurora,reven
                        - invert_result:true
                      docs:
                        - Check that DUT is a Chromebook by checking for non-Chromebook boards
            - name: Collect dmesg logs from DUT (Allow to fail)
              exec_name: cros_dmesg
              exec_args:
                - device_type:dut
              docs:
                - Collect the entire output of dmesg
            - name: Disable verbose network logging for cellular DUTs (Allow to fail)
              exec_name: sample_pass
              docs:
                - Disables verbose logging of networking daemons.
              conditions:
                - name: Is in cellular pool (RUN_ONCE)
                  exec_name: dut_is_in_pool_regex
                  exec_args:
                    - regex:(?i)^cellular
                  docs:
                    - Verify that DUT is not in a cellular pool.
              dependencies:
                - name: Disable verbose shill logs (Allow to fail)
                  exec_name: cros_set_verbose_shill_logs
                  exec_args:
                    - is_enabled:false
                  docs:
                    - Enables verbose logging of shill network manager.
                  dependencies:
                    - name: Device is accessible (ALWAYS_RUN) (time:'15s')
                      exec_name: cros_access
                      docs:
                        - Verify that device is reachable by SSH.
                        - Limited to 15 seconds.
                    - name: Is shill debug CLI present
                      exec_name: cros_is_tool_present
                      exec_args:
                        - tools:ff_debug
                      docs:
                        - Checks if shill debug utility can be found in DUT cli.
                      dependencies:
                        - name: Device is accessible (ALWAYS_RUN) (time:'15s')
                          exec_name: cros_access
                          docs:
                            - Verify that device is reachable by SSH.
                            - Limited to 15 seconds.
                - name: Disable verbose ModemManager logs (Allow to fail)
                  exec_name: cros_set_verbose_mm_logs
                  exec_args:
                    - is_enabled:false
                  docs:
                    - Enables verbose logging of modem manager.
                  dependencies:
                    - name: Device is accessible (ALWAYS_RUN) (time:'15s')
                      exec_name: cros_access
                      docs:
                        - Verify that device is reachable by SSH.
                        - Limited to 15 seconds.
                    - name: Is modem CLI present
                      exec_name: cros_is_tool_present
                      exec_args:
                        - tools:modem
                      docs:
                        - Checks if modem utility can be found in DUT cli.
                      dependencies:
                        - name: Device is accessible (ALWAYS_RUN) (time:'15s')
                          exec_name: cros_access
                          docs:
                            - Verify that device is reachable by SSH.
                            - Limited to 15 seconds.
            - name: Verify bootId and compare
              exec_name: cros_read_bootid
              exec_args:
                - skip_empty:true
                - compare:true
              docs:
                - Read bootid and compare with bootId when we started this plan.
        - name: Android OS checks
          exec_name: sample_pass
          docs:
            - Run DUT readiness checks for Android based DUTs.
          conditions:
            - name: Is Android based? (ALWAYS_RUN)
              exec_name: cros_is_android_based
          dependencies:
            - name: ADB reconnect (ALWAYS_RUN)
              exec_name: ctr_adb_connect
              exec_args:
                - retry_count:3
                - retry_interval:1
                - timeout:10
                - skip_when_connected:true
              docs:
                - Connect to DUT by ADB if not connected.
                - Only executed if DUT is Android based.
              conditions:
                - name: Is Android based on previous DUT OS
                  exec_name: cros_is_previous_android_os_type
                  docs:
                    - Validate that OS on the DUT was provisioned with Android.
            - name: Android is accessible (ALWAYS_RUN) (time:'15s')
              exec_name: cros_access
              docs:
                - Validate is Andoid OS is accessible by reading data from the host.
            - name: ADB set Android as always awake (ALWAYS_RUN)
              exec_name: ctr_make_awake_always
              docs:
                - Set Android to be awake always.
            - name: 'Android: Collect logs (Allow to fail) (RUN_ONCE)'
              exec_name: sample_pass
              docs:
                - 'We collect any pre-existing logs from before deletes such logs '
                - 'on the DUT. Any logs collection are not critical, and we marks '
                - that action attempt to perform to avoid repeating it.
              conditions:
                - name: Android:Device is pingable (ALWAYS_RUN) (time:'15s')
                  exec_name: cros_ping
                  docs:
                    - Verify that device is pingable.
                    - Limited to 15 seconds.
                    - Only for Mobile Harness box execution.
                - name: Android is accessible (ALWAYS_RUN) (time:'15s')
                  exec_name: cros_access
                  docs:
                    - Validate is Andoid OS is accessible by reading data from the host.
                - name: Confirm log collection info does not exist
                  exec_name: cros_confirm_file_not_exists
                  exec_args:
                    - target_file:log_collection_info
                  docs:
                    - 'We need to check whether the log collection info file already '
                    - 'exists in the file system. A pre-existing file indicates that '
                    - 'the collection of any pre-existing logs has already been '
                    - tried to be collected.
              dependencies:
                - name: Create log collection info (RUN_ONCE)
                  exec_name: cros_create_log_collection_info
                  exec_args:
                    - info_file:log_collection_info
                  docs:
                    - 'When the log collection completes, we create an info file that '
                    - indicates the successful completion of the collection process.
                  conditions:
                    - name: Confirm log collection info does not exist
                      exec_name: cros_confirm_file_not_exists
                      exec_args:
                        - target_file:log_collection_info
                      docs:
                        - 'We need to check whether the log collection info file already '
                        - 'exists in the file system. A pre-existing file indicates that '
                        - 'the collection of any pre-existing logs has already been '
                        - tried to be collected.
                - name: 'Android: Collect dmesg logs from DUT (Allow to fail)'
                  exec_name: cros_dmesg
                  exec_args:
                    - device_type:dut
                    - human_readable:false
                  docs:
                    - Collect the entire output of dmesg
            - name: Read bootId
              exec_name: cros_read_bootid
              exec_args:
                - skip_empty:true
                - publish:true
              docs:
                - Read bootid and public to config scope.
            - name: Device Uptime (Allow to fail)
              exec_name: cros_uptime_print
              docs:
                - Print uptime of the DUT.
            - name: Has repair-request for re-provision
              exec_name: dut_has_any_repair_requests
              exec_args:
                - requests:PROVISION
              docs:
                - Check if PROVISION repair-request is present.
            - name: Reset provisioned info (ALWAYS_RUN)
              exec_name: cros_reset_provision_info
              docs:
                - Reset all provision info.
            - name: Verify by host that DUT has default GBB flags
              exec_name: cros_has_default_gbb_flags
              docs:
                - Check if the device booted with default GBB flags.
              conditions:
                - name: Run only on ChromeOS hardware (RUN_ONCE)
                  exec_name: dut_check_board
                  exec_args:
                    - string_values:aurora,reven
                    - invert_result:true
                  docs:
                    - Check that DUT is a Chromebook by checking for non-Chromebook boards
                - name: Pools required to be in Secure mode (RUN_ONCE)
                  exec_name: sample_fail
                  docs:
                    - Verify that DUT need to be in Secure mode.
                  conditions:
                    - name: Pools allowed to stay in DEV mode (RUN_ONCE)
                      exec_name: dut_is_in_pool
                      exec_args:
                        - keep_dev_mode
                        - mp_firmware_testing
                      docs:
                        - Verify that pools are allowed to stay in DEV mode.
            - name: Verify that DUT is not in DEV mode
              exec_name: cros_is_not_in_dev_mode
              docs:
                - Verify that devices is not in DEV mode.
                - Mostly devices in the lab required to be in Secure mode, not DEV mode.
              conditions:
                - name: Run only on ChromeOS hardware (RUN_ONCE)
                  exec_name: dut_check_board
                  exec_args:
                    - string_values:aurora,reven
                    - invert_result:true
                  docs:
                    - Check that DUT is a Chromebook by checking for non-Chromebook boards
                - name: Pools required to be in Secure mode (RUN_ONCE)
                  exec_name: sample_fail
                  docs:
                    - Verify that DUT need to be in Secure mode.
                  conditions:
                    - name: Pools allowed to stay in DEV mode (RUN_ONCE)
                      exec_name: dut_is_in_pool
                      exec_args:
                        - keep_dev_mode
                        - mp_firmware_testing
                      docs:
                        - Verify that pools are allowed to stay in DEV mode.
            - name: Missing HWID
              exec_name: sample_fail
              docs:
                - Verify if device missing HWID because deployment was skipped.
              conditions:
                - name: Run only on ChromeOS hardware (RUN_ONCE)
                  exec_name: dut_check_board
                  exec_args:
                    - string_values:aurora,reven
                    - invert_result:true
                  docs:
                    - Check that DUT is a Chromebook by checking for non-Chromebook boards
                - name: Run only in main lab
                  exec_name: sample_fail
                  docs:
                    - Verify that DUT name is in main lab.
                  conditions:
                    - name: Run only on Satlab
                      exec_name: dut_regex_name_match
                      exec_args:
                        - regex:^satlab
                      docs:
                        - Verify that DUT name is belong Satlab.
                - name: Is HWID empty (ALWAYS_RUN)
                  exec_name: sample_fail
                  docs:
                    - Check whether the DUT information includes its HWID.
                  conditions:
                    - name: Is HWID known (ALWAYS_RUN)
                      exec_name: dut_has_hwid
                      docs:
                        - Check whether the DUT information includes its HWID.
              dependencies:
                - name: 'Set state: needs_deploy'
                  exec_name: dut_set_state
                  exec_args:
                    - state:needs_deploy
                  docs:
                    - The action set devices with request to be redeployed.
            - name: Match HWID (Allow to fail)
              exec_name: cros_match_hwid_to_inventory
              docs:
                - Match HWID to value in inventory
                - Allowed to fail if HWID is not matched
              conditions:
                - name: Run only on ChromeOS hardware (RUN_ONCE)
                  exec_name: dut_check_board
                  exec_args:
                    - string_values:aurora,reven
                    - invert_result:true
                  docs:
                    - Check that DUT is a Chromebook by checking for non-Chromebook boards
                - name: Is HWID known (ALWAYS_RUN)
                  exec_name: dut_has_hwid
                  docs:
                    - Check whether the DUT information includes its HWID.
            - name: Missing serial-number
              exec_name: sample_fail
              docs:
                - Verify if device missing serial number because deployment was skipped.
              conditions:
                - name: Run only on ChromeOS hardware (RUN_ONCE)
                  exec_name: dut_check_board
                  exec_args:
                    - string_values:aurora,reven
                    - invert_result:true
                  docs:
                    - Check that DUT is a Chromebook by checking for non-Chromebook boards
                - name: Run only in main lab
                  exec_name: sample_fail
                  docs:
                    - Verify that DUT name is in main lab.
                  conditions:
                    - name: Run only on Satlab
                      exec_name: dut_regex_name_match
                      exec_args:
                        - regex:^satlab
                      docs:
                        - Verify that DUT name is belong Satlab.
                - name: Is serial-number empty (ALWAYS_RUN)
                  exec_name: sample_fail
                  docs:
                    - 'Check whether the DUT information includes its '
                    - serial number.
                  conditions:
                    - name: Is serial-number known (ALWAYS_RUN)
                      exec_name: dut_has_serial_number
                      docs:
                        - 'Check whether the DUT information includes its '
                        - serial number.
              dependencies:
                - name: 'Set state: needs_deploy'
                  exec_name: dut_set_state
                  exec_args:
                    - state:needs_deploy
                  docs:
                    - The action set devices with request to be redeployed.
            - name: Match serial-number (Allow to fail)
              exec_name: cros_match_serial_number_inventory
              docs:
                - Match serial number to value in inventory
              conditions:
                - name: Run only on ChromeOS hardware (RUN_ONCE)
                  exec_name: dut_check_board
                  exec_args:
                    - string_values:aurora,reven
                    - invert_result:true
                  docs:
                    - Check that DUT is a Chromebook by checking for non-Chromebook boards
                - name: Is serial-number known (ALWAYS_RUN)
                  exec_name: dut_has_serial_number
                  docs:
                    - 'Check whether the DUT information includes its '
                    - serial number.
        - name: All repair-requests resolved
          exec_name: dut_has_no_repair_requests
          docs:
            - Checks if all repair requests are resolved
        - name: Reset DUT-state reason
          exec_name: dut_reset_state_reason
          docs:
            - Reset DUT-state-reason for good DUT as it becomes stale.
        - name: Servo is in WORKING state
          exec_name: servo_match_state
          exec_args:
            - state:WORKING
          docs:
            - Some pool requires servo on WORKING state.
            - This action does not have any recovery actions.
          conditions:
            - name: Pools require Servo in WORKING state (RUN_ONCE)
              exec_name: dut_is_in_pool
              exec_args:
                - faft-cr50
                - faft-cr50-debug
                - faft-cr50-tot
                - faft-experimental
                - faft-test
                - satlab_faft
                - need_healthy_servo
              docs:
                - List of pools that require a good servo.
        - name: 'Set state: ready (RUN_ONCE)'
          exec_name: dut_set_state
          exec_args:
            - state:ready
          docs:
            - The action set devices with state ready for the testing.
          dependencies:
            - name: All repair-requests resolved
              exec_name: dut_has_no_repair_requests
              docs:
                - Checks if all repair requests are resolved
            - name: Reset DUT-state reason
              exec_name: dut_reset_state_reason
              docs:
                - Reset DUT-state-reason for good DUT as it becomes stale.
