plans:
    - name: cros_base
      criticalactions:
        - name: 'Set state: needs_repair (''dut_set_state'')'
        - name: Start ADB-base ('ctr_start_adb_container') (time:'2m0s')
          conditions:
            - name: Do not run on Mobile Harness box ('env_is_not_mh_box') (RUN_ONCE)
            - name: CrosToolRunner is up ('ctr_is_up')
        - name: Start Servo-Nexus ('ctr_servo_nexus_start_container') (time:'4m0s')
          conditions:
            - name: Do not run on Mobile Harness box ('env_is_not_mh_box') (RUN_ONCE)
            - name: Testbed has Servo ('dut_servo_host_present') (RUN_ONCE)
            - name: CrosToolRunner is up ('ctr_is_up')
    - name: cros
      criticalactions:
        - name: Mark labstation as servod is in-use (Allow to fail) ('cros_create_servo_in_use')
          conditions:
            - name: Only applies to labstation ('servo_host_is_labstation') (ALWAYS_RUN)
        - name: Mark base on OS-restriction ('cros_set_from_os_restriction')
        - name: Has repair-request for re-image USB-key ('dut_has_any_repair_requests')
        - name: Has repair-request for reflash-firmware ('dut_has_any_repair_requests')
        - name: Has repair-request for re-image by USB-key ('dut_has_any_repair_requests')
        - name: Device is pingable ('cros_ping') (ALWAYS_RUN) (time:'15s')
        - name: Mark DUT as Android if applicable ('cros_set_as_android_based')
          conditions:
            - name: Run if not restricted to ChromeOS only ('cros_not_match_os_restriction')
            - name: Mark as ChromeOS based ('cros_set_as_chrome_based') (ALWAYS_RUN)
            - name: Device is not accessible (simple) ('sample_fail') (ALWAYS_RUN)
              conditions:
                - name: Device is accessible (simple) ('cros_access') (ALWAYS_RUN) (time:'15s')
            - name: ADB Connect DUT ('ctr_adb_connect') (ALWAYS_RUN)
        - name: Chrome OS checks ('sample_pass')
          conditions:
            - name: Run only on ChromeOS based DUT ('cros_is_not_android_based') (ALWAYS_RUN)
          dependencies:
            - name: Mark as ChromeOS based ('cros_set_as_chrome_based') (ALWAYS_RUN)
            - name: Reset provisioned info ('cros_reset_provision_info') (ALWAYS_RUN)
            - name: Enable verbose network logging for cellular DUTs (Allow to fail) ('sample_pass')
              conditions:
                - name: Is in cellular pool ('dut_is_in_pool_regex') (RUN_ONCE)
                - name: Device is accessible ('cros_access') (ALWAYS_RUN) (time:'15s')
              dependencies:
                - name: Enable verbose shill logs (Allow to fail) ('cros_set_verbose_shill_logs')
                  dependencies:
                    - name: Device is accessible ('cros_access') (ALWAYS_RUN) (time:'15s')
                    - name: Is shill debug CLI present ('cros_is_tool_present')
                      dependencies:
                        - name: Device is accessible ('cros_access') (ALWAYS_RUN) (time:'15s')
                - name: Enable verbose ModemManager logs (Allow to fail) ('cros_set_verbose_mm_logs')
                  dependencies:
                    - name: Device is accessible ('cros_access') (ALWAYS_RUN) (time:'15s')
                    - name: Is modem CLI present ('cros_is_tool_present')
                      dependencies:
                        - name: Device is accessible ('cros_access') (ALWAYS_RUN) (time:'15s')
            - name: Collect logs and crashinfo (Allow to fail) ('sample_pass') (RUN_ONCE)
              conditions:
                - name: Device is accessible ('cros_access') (ALWAYS_RUN) (time:'15s')
                - name: Confirm log collection info does not exist ('cros_confirm_file_not_exists')
              dependencies:
                - name: Create log collection info ('cros_create_log_collection_info') (RUN_ONCE)
                  conditions:
                    - name: Confirm log collection info does not exist ('cros_confirm_file_not_exists')
                - name: Collect logs from DUT on /var/log/* (Allow to fail) ('cros_copy_to_logs') (RUN_ONCE)
                  conditions:
                    - name: Device is accessible ('cros_access') (ALWAYS_RUN) (time:'15s')
                - name: Collect logs from DUT on /sys/fs/pstore/* (Allow to fail) ('cros_copy_to_logs') (RUN_ONCE)
                  conditions:
                    - name: Device is accessible ('cros_access') (ALWAYS_RUN) (time:'15s')
                - name: Collect dmesg (Allow to fail) ('cros_dmesg') (RUN_ONCE)
                  conditions:
                    - name: Device is accessible ('cros_access') (ALWAYS_RUN) (time:'15s')
                - name: Collect crash dumps (Allow to fail) ('cros_collect_crash_dumps') (RUN_ONCE)
                  conditions:
                    - name: Device is accessible ('cros_access') (ALWAYS_RUN) (time:'15s')
            - name: Device is accessible ('cros_access') (ALWAYS_RUN) (time:'15s')
            - name: Read bootId ('cros_read_bootid')
            - name: Device Uptime (Allow to fail) ('cros_uptime_print')
            - name: Verify access to cache (Allow to fail) ('cache_download_check') (ALWAYS_RUN)
              conditions:
                - name: Run only in main lab ('sample_fail')
                  conditions:
                    - name: Run only on Satlab ('dut_regex_name_match')
            - name: Set dev_boot_usb is enabled (Allow to fail) ('cros_update_crossystem') (RUN_ONCE)
              conditions:
                - name: Run only on ChromeOS hardware ('dut_check_board') (RUN_ONCE)
            - name: Internal storage is responsive ('cros_is_file_system_writable')
              dependencies:
                - name: Run only on ChromeOS based DUT ('cros_is_not_android_based') (ALWAYS_RUN)
                - name: Device is accessible ('cros_access') (ALWAYS_RUN) (time:'15s')
            - name: Kernel does not know issues ('cros_has_critical_kernel_error')
              dependencies:
                - name: Device is accessible ('cros_access') (ALWAYS_RUN) (time:'15s')
            - name: Stateful partition has enough free index nodes ('cros_has_enough_index_nodes')
            - name: Stateful partition has enough free space ('cros_has_enough_storage_space')
            - name: Stateful partition (encrypted) has enough free space ('cros_has_enough_storage_space')
            - name: Verify if booted from priority kernel ('cros_kernel_priority_has_not_changed')
              conditions:
                - name: Device is accessible ('cros_access') (ALWAYS_RUN) (time:'15s')
            - name: Verify rootfs is on fs-verity ('cros_verify_rootfs_verity') (ALWAYS_RUN)
              conditions:
                - name: Run only on ChromeOS hardware ('dut_check_board') (RUN_ONCE)
              dependencies:
                - name: Device is accessible ('cros_access') (ALWAYS_RUN) (time:'15s')
            - name: Check KVM is enabled (Allow to fail) ('cros_run_command') (time:'15s')
              dependencies:
                - name: Internal storage is responsive ('cros_is_file_system_writable')
                  dependencies:
                    - name: Run only on ChromeOS based DUT ('cros_is_not_android_based') (ALWAYS_RUN)
                    - name: Device is accessible ('cros_access') (ALWAYS_RUN) (time:'15s')
            - name: Has repair-request for re-provision ('dut_has_any_repair_requests')
            - name: Check if last provision was good ('cros_is_last_provision_successful')
              dependencies:
                - name: Internal storage is responsive ('cros_is_file_system_writable')
                  dependencies:
                    - name: Run only on ChromeOS based DUT ('cros_is_not_android_based') (ALWAYS_RUN)
                    - name: Device is accessible ('cros_access') (ALWAYS_RUN) (time:'15s')
            - name: Read OS version ('cros_read_os_version')
            - name: Python is present ('cros_has_python_interpreter_working')
              dependencies:
                - name: Internal storage is responsive ('cros_is_file_system_writable')
                  dependencies:
                    - name: Run only on ChromeOS based DUT ('cros_is_not_android_based') (ALWAYS_RUN)
                    - name: Device is accessible ('cros_access') (ALWAYS_RUN) (time:'15s')
            - name: Verify that device is not enrolled (Allow to fail) ('cros_is_enrollment_in_clean_state')
              dependencies:
                - name: Internal storage is responsive ('cros_is_file_system_writable')
                  dependencies:
                    - name: Run only on ChromeOS based DUT ('cros_is_not_android_based') (ALWAYS_RUN)
                    - name: Device is accessible ('cros_access') (ALWAYS_RUN) (time:'15s')
            - name: Check power sources ('sample_pass')
              conditions:
                - name: Run only on ChromeOS hardware ('dut_check_board') (RUN_ONCE)
                - name: cros_is_not_virtual_machine
              dependencies:
                - name: Power is recognized by DUT ('cros_is_ac_power_connected')
                - name: Battery is changing or have accepted level ('cros_is_battery_chargable_or_good_level')
                  conditions:
                    - name: cros_is_battery_expected
                    - name: cros_is_not_virtual_machine
                    - name: Battery is expected on device ('dut_has_battery')
                    - name: Battery is present on device ('cros_is_battery_present') (ALWAYS_RUN)
            - name: Check TPM statuses ('cros_is_tpm_in_good_status')
              conditions:
                - name: Run only on ChromeOS hardware ('dut_check_board') (RUN_ONCE)
                - name: cros_is_not_virtual_machine
                - name: cros_is_tpm_present
            - name: Read TPM ownership (Allow to fail) ('cros_run_command')
              conditions:
                - name: Device is accessible ('cros_access') (ALWAYS_RUN) (time:'15s')
                - name: Is hwsec-ownership-id expected ('cros_is_on_expected_version')
                  conditions:
                    - name: Device is accessible ('cros_access') (ALWAYS_RUN) (time:'15s')
            - name: Verify tpm_fwver is updated correctly ('cros_match_dev_tpm_firmware_version')
              conditions:
                - name: Run only on ChromeOS hardware ('dut_check_board') (RUN_ONCE)
              dependencies:
                - name: Internal storage is responsive ('cros_is_file_system_writable')
                  dependencies:
                    - name: Run only on ChromeOS based DUT ('cros_is_not_android_based') (ALWAYS_RUN)
                    - name: Device is accessible ('cros_access') (ALWAYS_RUN) (time:'15s')
            - name: Verify tpm_kernver is updated correctly ('cros_match_dev_tpm_kernel_version')
              conditions:
                - name: Run only on ChromeOS hardware ('dut_check_board') (RUN_ONCE)
              dependencies:
                - name: Internal storage is responsive ('cros_is_file_system_writable')
                  dependencies:
                    - name: Run only on ChromeOS based DUT ('cros_is_not_android_based') (ALWAYS_RUN)
                    - name: Device is accessible ('cros_access') (ALWAYS_RUN) (time:'15s')
            - name: Verify present of gsctool (Allow to fail) ('cros_run_shell_command')
              conditions:
                - name: Run only on ChromeOS hardware ('dut_check_board') (RUN_ONCE)
                - name: DUT has Cr50 phase label ('dut_has_cr50')
              dependencies:
                - name: Device is accessible (simple) ('cros_access') (ALWAYS_RUN) (time:'15s')
            - name: Audit battery (Allow to fail) ('cros_audit_battery')
              conditions:
                - name: Run only on ChromeOS hardware ('dut_check_board') (RUN_ONCE)
                - name: cros_is_battery_expected
                - name: cros_is_not_virtual_machine
                - name: Battery is expected on device ('dut_has_battery')
                - name: Battery is present on device ('cros_is_battery_present') (ALWAYS_RUN)
                - name: Internal storage is responsive ('cros_is_file_system_writable')
                  dependencies:
                    - name: Run only on ChromeOS based DUT ('cros_is_not_android_based') (ALWAYS_RUN)
                    - name: Device is accessible ('cros_access') (ALWAYS_RUN) (time:'15s')
              dependencies:
                - name: Battery temperature below threshold (Allow to fail) ('servo_check_servod_control')
                  conditions:
                    - name: Run only in main lab ('sample_fail')
                      conditions:
                        - name: Run only on Satlab ('dut_regex_name_match')
                    - name: Servo state is working ('servo_match_state')
                    - name: Is servod running ('sample_pass') (ALWAYS_RUN)
                      dependencies:
                        - name: Setup has servo info ('dut_servo_host_present') (RUN_ONCE)
                        - name: Verify servod is responsive ('servod_echo') (ALWAYS_RUN) (time:'10s')
                          dependencies:
                            - name: Setup has servo info ('dut_servo_host_present') (RUN_ONCE)
                    - name: Servod has battery_tempc control ('servod_has')
            - name: Audit storage (SMART only) (Allow to fail) ('cros_audit_storage_smart')
            - name: Audit wifi (Allow to fail) ('cros_audit_wifi')
              dependencies:
                - name: Device is accessible ('cros_access') (ALWAYS_RUN) (time:'15s')
            - name: Audit bluetooth (Allow to fail) ('cros_audit_bluetooth')
              dependencies:
                - name: Device is accessible ('cros_access') (ALWAYS_RUN) (time:'15s')
            - name: Audit camera (Allow to fail) ('cros_audit_camera') (time:'10m0s')
              dependencies:
                - name: Device is accessible ('cros_access') (ALWAYS_RUN) (time:'15s')
            - name: Audit cellular (Allow to fail) ('sample_pass')
              conditions:
                - name: Is in cellular pool ('dut_is_in_pool_regex') (RUN_ONCE)
              dependencies:
                - name: Audit cellular modem (Allow to fail) ('sample_pass')
                  dependencies:
                    - name: Cellular modem is up ('cros_audit_cellular_modem') (time:'3m0s')
                      conditions:
                        - name: Is in cellular pool ('dut_is_in_pool_regex') (RUN_ONCE)
                        - name: cros_has_mmcli
                        - name: has_cellular_info
                      dependencies:
                        - name: Device is accessible ('cros_access') (ALWAYS_RUN) (time:'15s')
                - name: Update cellular sim labels if missing ('sample_pass')
                  conditions:
                    - name: Is in cellular pool ('dut_is_in_pool_regex') (RUN_ONCE)
                    - name: has_cellular_info
                    - name: cros_sim_info_empty
                  dependencies:
                    - name: Cellular modem is up ('cros_audit_cellular_modem') (time:'3m0s')
                      conditions:
                        - name: Is in cellular pool ('dut_is_in_pool_regex') (RUN_ONCE)
                        - name: cros_has_mmcli
                        - name: has_cellular_info
                      dependencies:
                        - name: Device is accessible ('cros_access') (ALWAYS_RUN) (time:'15s')
                    - name: Update cellular sim labels ('cros_update_cellular_sim_labels') (RUN_ONCE) (time:'6m0s')
                      conditions:
                        - name: Is in cellular pool ('dut_is_in_pool_regex') (RUN_ONCE)
                        - name: has_cellular_info
                        - name: Is not starfish device ('carrier_not_in') (RUN_ONCE)
                          conditions:
                            - name: Is in cellular pool ('dut_is_in_pool_regex') (RUN_ONCE)
                            - name: has_cellular_info
                      dependencies:
                        - name: Cellular modem is up ('cros_audit_cellular_modem') (time:'3m0s')
                          conditions:
                            - name: Is in cellular pool ('dut_is_in_pool_regex') (RUN_ONCE)
                            - name: cros_has_mmcli
                            - name: has_cellular_info
                          dependencies:
                            - name: Device is accessible ('cros_access') (ALWAYS_RUN) (time:'15s')
                        - name: cros_has_only_one_sim_profile
                - name: Update cellular modem labels if missing ('sample_pass')
                  conditions:
                    - name: Is in cellular pool ('dut_is_in_pool_regex') (RUN_ONCE)
                    - name: has_cellular_info
                    - name: cros_imei_empty
                  dependencies:
                    - name: Cellular modem is up ('cros_audit_cellular_modem') (time:'3m0s')
                      conditions:
                        - name: Is in cellular pool ('dut_is_in_pool_regex') (RUN_ONCE)
                        - name: cros_has_mmcli
                        - name: has_cellular_info
                      dependencies:
                        - name: Device is accessible ('cros_access') (ALWAYS_RUN) (time:'15s')
                    - name: Update cellular modem labels ('cros_update_cellular_modem_labels') (RUN_ONCE)
                      conditions:
                        - name: Is in cellular pool ('dut_is_in_pool_regex') (RUN_ONCE)
                        - name: has_cellular_info
                      dependencies:
                        - name: Cellular modem is up ('cros_audit_cellular_modem') (time:'3m0s')
                          conditions:
                            - name: Is in cellular pool ('dut_is_in_pool_regex') (RUN_ONCE)
                            - name: cros_has_mmcli
                            - name: has_cellular_info
                          dependencies:
                            - name: Device is accessible ('cros_access') (ALWAYS_RUN) (time:'15s')
                - name: Audit cellular network connection (Allow to fail) ('cros_audit_cellular_connection') (time:'3m0s')
                  conditions:
                    - name: Is in cellular pool ('dut_is_in_pool_regex') (RUN_ONCE)
                    - name: cros_has_mmcli
                    - name: has_cellular_info
                    - name: Has live carrier ('carrier_not_in') (RUN_ONCE)
                      conditions:
                        - name: Is in cellular pool ('dut_is_in_pool_regex') (RUN_ONCE)
                        - name: has_cellular_info
                  dependencies:
                    - name: Device is accessible ('cros_access') (ALWAYS_RUN) (time:'15s')
                    - name: Cellular modem is up ('cros_audit_cellular_modem') (time:'3m0s')
                      conditions:
                        - name: Is in cellular pool ('dut_is_in_pool_regex') (RUN_ONCE)
                        - name: cros_has_mmcli
                        - name: has_cellular_info
                      dependencies:
                        - name: Device is accessible ('cros_access') (ALWAYS_RUN) (time:'15s')
                    - name: Cellular modem is not in failed state ('cros_modem_state_not_in')
                      conditions:
                        - name: Is in cellular pool ('dut_is_in_pool_regex') (RUN_ONCE)
                        - name: cros_has_mmcli
                      dependencies:
                        - name: Device is accessible ('cros_access') (ALWAYS_RUN) (time:'15s')
                        - name: Cellular modem is up ('cros_audit_cellular_modem') (time:'3m0s')
                          conditions:
                            - name: Is in cellular pool ('dut_is_in_pool_regex') (RUN_ONCE)
                            - name: cros_has_mmcli
                            - name: has_cellular_info
                          dependencies:
                            - name: Device is accessible ('cros_access') (ALWAYS_RUN) (time:'15s')
                - name: Audit cellular starfish (Allow to fail) ('cros_audit_cellular_starfish')
                  conditions:
                    - name: Is in cellular pool ('dut_is_in_pool_regex') (RUN_ONCE)
                    - name: Is starfish device ('carrier_is_in') (RUN_ONCE)
                      conditions:
                        - name: Is in cellular pool ('dut_is_in_pool_regex') (RUN_ONCE)
                        - name: has_cellular_info
                  dependencies:
                    - name: Device is accessible ('cros_access') (ALWAYS_RUN) (time:'15s')
                - name: Audit cellular configuration (Allow to fail) ('cros_audit_cellular_configuration')
                  conditions:
                    - name: Is in cellular pool ('dut_is_in_pool_regex') (RUN_ONCE)
                    - name: has_cellular_info
                - name: Collect additional cellular labels (Allow to fail) ('cros_collect_supported_carriers')
                  conditions:
                    - name: Is in cellular pool ('dut_is_in_pool_regex') (RUN_ONCE)
                    - name: has_cellular_info
                - name: Collect var/log/messages from DUT (Allow to fail) ('cros_copy_to_logs') (RUN_ONCE)
                  dependencies:
                    - name: Device is accessible ('cros_access') (ALWAYS_RUN) (time:'15s')
                - name: Collect var/log/net.log from DUT (Allow to fail) ('cros_copy_to_logs') (RUN_ONCE)
                  dependencies:
                    - name: Device is accessible ('cros_access') (ALWAYS_RUN) (time:'15s')
            - name: Audit cellular modem on non-cellular pools (Allow to fail) ('cros_audit_cellular_modem') (time:'3m0s')
              conditions:
                - name: Is in non-cellular pool that runs cellular tests ('dut_is_in_pool_regex') (RUN_ONCE)
                - name: cros_has_mmcli
                - name: has_cellular_info
              dependencies:
                - name: Device is accessible ('cros_access') (ALWAYS_RUN) (time:'15s')
            - name: Stop if DUT needs replacement ('dut_state_match')
            - name: FWMP is overriding WP (Allow to fail) ('cros_is_fwmp_override_wp')
              conditions:
                - name: Run only on ChromeOS hardware ('dut_check_board') (RUN_ONCE)
                - name: Device not in MP Signed AP FW pool ('dut_not_in_pool') (RUN_ONCE)
                - name: DUT has Cr50 phase label ('dut_has_cr50')
                - name: Is gsctool present on the host ('cros_run_shell_command')
                  dependencies:
                    - name: Device is accessible (simple) ('cros_access') (ALWAYS_RUN) (time:'15s')
            - name: Ensure firmware is in good state ('cros_is_firmware_in_good_state')
              conditions:
                - name: Run only on ChromeOS hardware ('dut_check_board') (RUN_ONCE)
                - name: Device not in MP Signed AP FW pool ('dut_not_in_pool') (RUN_ONCE)
              dependencies:
                - name: Internal storage is responsive ('cros_is_file_system_writable')
                  dependencies:
                    - name: Run only on ChromeOS based DUT ('cros_is_not_android_based') (ALWAYS_RUN)
                    - name: Device is accessible ('cros_access') (ALWAYS_RUN) (time:'15s')
            - name: RO Firmware version matches the recovery-version (Allow to fail) ('cros_is_on_stable_firmware_version')
              conditions:
                - name: Run only on ChromeOS hardware ('dut_check_board') (RUN_ONCE)
                - name: Device not in MP Signed AP FW pool ('dut_not_in_pool') (RUN_ONCE)
                - name: Check stable firmware version exists ('has_stable_version_fw_version')
                  conditions:
                    - name: Run only on ChromeOS hardware ('dut_check_board') (RUN_ONCE)
                    - name: Has a stable-version service ('has_stable_version_service_path') (RUN_ONCE)
                - name: Is recovery-version has firmware image path ('has_stable_version_fw_image')
                  dependencies:
                    - name: Has a stable-version service ('has_stable_version_service_path') (RUN_ONCE)
                - name: Pools required to manage FW on the device ('dut_not_in_pool') (RUN_ONCE)
              dependencies:
                - name: Internal storage is responsive ('cros_is_file_system_writable')
                  dependencies:
                    - name: Run only on ChromeOS based DUT ('cros_is_not_android_based') (ALWAYS_RUN)
                    - name: Device is accessible ('cros_access') (ALWAYS_RUN) (time:'15s')
            - name: Verify servo keyboard firmware (Allow to fail) ('cros_run_shell_command')
              conditions:
                - name: Run only on ChromeOS hardware ('dut_check_board') (RUN_ONCE)
                - name: Device not in MP Signed AP FW pool ('dut_not_in_pool') (RUN_ONCE)
                - name: Is servod running ('sample_pass') (ALWAYS_RUN)
                  dependencies:
                    - name: Setup has servo info ('dut_servo_host_present') (RUN_ONCE)
                    - name: Verify servod is responsive ('servod_echo') (ALWAYS_RUN) (time:'10s')
                      dependencies:
                        - name: Setup has servo info ('dut_servo_host_present') (RUN_ONCE)
                - name: is_servo_keyboard_image_tool_present ('cros_is_tool_present')
                  dependencies:
                    - name: Setup has servo info ('dut_servo_host_present') (RUN_ONCE)
              dependencies:
                - name: servo_init_usb_keyboard ('servo_set')
                  dependencies:
                    - name: Setup has servo info ('dut_servo_host_present') (RUN_ONCE)
                - name: lufa_keyboard_found ('cros_run_shell_command')
            - name: FPMCU is working (Allow to fail) ('cros_run_command')
              conditions:
                - name: Run only on ChromeOS hardware ('dut_check_board') (RUN_ONCE)
                - name: Device not in MP Signed AP FW pool ('dut_not_in_pool') (RUN_ONCE)
                - name: Has valid Fingerprint board value ('cros_is_valid_fingerprint_board') (ALWAYS_RUN)
            - name: Validate btclient adapter output (Allow to fail) ('cros_run_command') (ALWAYS_RUN)
              conditions:
                - name: Run only on ChromeOS based DUT ('cros_is_not_android_based') (ALWAYS_RUN)
                - name: Has Bluetooth peers ('cros_has_btpeers') (ALWAYS_RUN)
              dependencies:
                - name: Device is accessible ('cros_access') (ALWAYS_RUN) (time:'15s')
            - name: FW WP is disabled (Allow to fail) ('servo_check_servod_control') (ALWAYS_RUN)
              conditions:
                - name: Run only on ChromeOS hardware ('dut_check_board') (RUN_ONCE)
                - name: Device not in MP Signed AP FW pool ('dut_not_in_pool') (RUN_ONCE)
            - name: Check if OS on required version for camerabox tablet ('is_camerabox_tablet_on_os_version')
              conditions:
                - name: Run only for camerabox_tablet pool ('dut_is_in_pool') (RUN_ONCE)
              dependencies:
                - name: Internal storage is responsive ('cros_is_file_system_writable')
                  dependencies:
                    - name: Run only on ChromeOS based DUT ('cros_is_not_android_based') (ALWAYS_RUN)
                    - name: Device is accessible ('cros_access') (ALWAYS_RUN) (time:'15s')
            - name: Check audio latency toolkit state (Allow to fail) ('cros_update_audio_latency_toolkit_state')
            - name: Collect audio beamforming type (Allow to fail) ('cros_update_audio_beamforming_type')
              conditions:
                - name: Run only on ChromeOS hardware ('dut_check_board') (RUN_ONCE)
            - name: Login UI is up ('cros_stop_start_ui') (time:'45s')
            - name: Can list RW VPD Keys ('cros_can_list_rw_vpd_keys')
              conditions:
                - name: Run only on ChromeOS hardware ('dut_check_board') (RUN_ONCE)
            - name: Verify keys of RW_VPD (Allow to fail) ('cros_are_required_rw_vpd_keys_present')
              conditions:
                - name: Run only on ChromeOS hardware ('dut_check_board') (RUN_ONCE)
            - name: Set VPD region:us (Allow to fail) ('cros_set_vpd_value')
              conditions:
                - name: Run only on ChromeOS hardware ('dut_check_board') (RUN_ONCE)
