            - This verifier checks whether the host filesystem is writable.
        - name: Used Inodes percentage on stateful partition is lower than 50%
          exec_name: cros_check_used_inode_percentage_lower_than_threshold
          exec_args:
            - targetPath:/mnt/stateful_partition
