              exec_name: cros_access
              docs:
                - This verifier checks whether the host is accessible over ssh.
          recoveries:
            - name: Powerwash repair labstation
              exec_name: sample_pass
              docs:
                - Powerwash and then install stable_version image on the labstation.
              conditions:
