plans:
    - name: cros_base
      criticalactions:
        - name: 'Set state: needs_repair (''dut_set_state'')'
        - name: Start ADB-base ('ctr_start_adb_container') (time:'2m0s')
          conditions:
            - name: Do not run on Mobile Harness box ('env_is_not_mh_box') (RUN_ONCE)
            - name: CrosToolRunner is up ('ctr_is_up')
        - name: Start Servo-Nexus ('ctr_servo_nexus_start_container') (time:'4m0s')
          conditions:
            - name: Do not run on Mobile Harness box ('env_is_not_mh_box') (RUN_ONCE)
            - name: Testbed has Servo ('dut_servo_host_present') (RUN_ONCE)
            - name: CrosToolRunner is up ('ctr_is_up')
    - name: cros
      criticalactions:
        - name: Mark as Android based (Allow to fail) ('cros_set_as_android_based') (ALWAYS_RUN)
        - name: Set CacheService address ('cache_service_address_detection') (RUN_ONCE)
          conditions:
            - name: Execution on Mobile Harness box ('env_is_mh_box') (RUN_ONCE)
        - name: Has repair-request for re-image USB-key ('dut_has_any_repair_requests')
        - name: Has repair-request for reflash-firmware ('dut_has_any_repair_requests')
        - name: 'Android: Has repair-request for re-image by USB-key (''dut_has_any_repair_requests'')'
        - name: Android:Device is pingable ('cros_ping') (ALWAYS_RUN) (time:'15s')
        - name: ADB Connect DUT ('ctr_adb_connect') (ALWAYS_RUN)
        - name: Android is accessible ('cros_access') (ALWAYS_RUN) (time:'15s')
        - name: ADB set Android as always awake ('ctr_make_awake_always') (ALWAYS_RUN)
        - name: 'Android: Collect logs (Allow to fail) (''sample_pass'') (RUN_ONCE)'
          conditions:
            - name: Android:Device is pingable ('cros_ping') (ALWAYS_RUN) (time:'15s')
            - name: Android is accessible ('cros_access') (ALWAYS_RUN) (time:'15s')
            - name: Confirm log collection info does not exist ('cros_confirm_file_not_exists')
          dependencies:
            - name: Create log collection info ('cros_create_log_collection_info') (RUN_ONCE)
              conditions:
                - name: Confirm log collection info does not exist ('cros_confirm_file_not_exists')
            - name: 'Android: Collect dmesg logs from DUT (Allow to fail) (''cros_dmesg'')'
        - name: Read bootId ('cros_read_bootid')
        - name: Device Uptime (Allow to fail) ('cros_uptime_print')
        - name: 'Android: Has repair-request for re-provision (''dut_has_any_repair_requests'')'
        - name: Provision to stable-version if required ('android_is_on_os_stable_version')
          conditions:
            - name: Is Android based? ('cros_is_android_based') (ALWAYS_RUN)
            - name: Is in stable version required pools ('dut_is_in_pool') (RUN_ONCE)
        - name: Verify by host that DUT has default GBB flags ('cros_has_default_gbb_flags')
          conditions:
            - name: Run only on ChromeOS hardware ('dut_check_board') (RUN_ONCE)
            - name: Pools required to be in Secure mode ('sample_fail') (RUN_ONCE)
              conditions:
                - name: Pools allowed to stay in DEV mode ('dut_is_in_pool') (RUN_ONCE)
        - name: Verify that DUT is not in DEV mode ('cros_is_not_in_dev_mode')
          conditions:
            - name: Run only on ChromeOS hardware ('dut_check_board') (RUN_ONCE)
            - name: Pools required to be in Secure mode ('sample_fail') (RUN_ONCE)
              conditions:
                - name: Pools allowed to stay in DEV mode ('dut_is_in_pool') (RUN_ONCE)
        - name: Missing HWID ('sample_fail')
          conditions:
            - name: Run only on ChromeOS hardware ('dut_check_board') (RUN_ONCE)
            - name: Run only in main lab ('sample_fail')
              conditions:
                - name: Run only on Satlab ('dut_regex_name_match')
            - name: Is HWID empty ('sample_fail') (ALWAYS_RUN)
              conditions:
                - name: Is HWID known ('dut_has_hwid') (ALWAYS_RUN)
          dependencies:
            - name: 'Set state: needs_deploy (''dut_set_state'')'
        - name: Match HWID (Allow to fail) ('cros_match_hwid_to_inventory')
          conditions:
            - name: Run only on ChromeOS hardware ('dut_check_board') (RUN_ONCE)
            - name: Is HWID known ('dut_has_hwid') (ALWAYS_RUN)
        - name: Missing serial-number ('sample_fail')
          conditions:
            - name: Run only on ChromeOS hardware ('dut_check_board') (RUN_ONCE)
            - name: Run only in main lab ('sample_fail')
              conditions:
                - name: Run only on Satlab ('dut_regex_name_match')
            - name: Is serial-number empty ('sample_fail') (ALWAYS_RUN)
              conditions:
                - name: Is serial-number known ('dut_has_serial_number') (ALWAYS_RUN)
          dependencies:
            - name: 'Set state: needs_deploy (''dut_set_state'')'
        - name: Match serial-number (Allow to fail) ('cros_match_serial_number_inventory')
          conditions:
            - name: Run only on ChromeOS hardware ('dut_check_board') (RUN_ONCE)
            - name: Is serial-number known ('dut_has_serial_number') (ALWAYS_RUN)
        - name: Reset provisioned info ('cros_reset_provision_info') (ALWAYS_RUN)
        - name: All repair-requests resolved ('dut_has_no_repair_requests')
        - name: Reset DUT-state reason ('dut_reset_state_reason')
        - name: Servo is in WORKING state ('servo_match_state')
          conditions:
            - name: Pools require Servo in WORKING state ('dut_is_in_pool') (RUN_ONCE)
        - name: 'Set state: ready (''dut_set_state'') (RUN_ONCE)'
          dependencies:
            - name: All repair-requests resolved ('dut_has_no_repair_requests')
            - name: Reset DUT-state reason ('dut_reset_state_reason')
