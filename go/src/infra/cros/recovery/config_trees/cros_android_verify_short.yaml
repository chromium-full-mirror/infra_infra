plans:
    - name: cros_base
      criticalactions:
        - name: 'Set state: repair_failed (''dut_set_state'')'
        - name: Start ADB-base ('ctr_start_adb_container') (time:'2m0s')
          conditions:
            - name: Do not run on Mobile Harness box ('env_is_not_mh_box') (RUN_ONCE)
            - name: CrosToolRunner is up ('ctr_is_up')
        - name: Start Servo-Nexus ('ctr_servo_nexus_start_container') (time:'4m0s')
          conditions:
            - name: Do not run on Mobile Harness box ('env_is_not_mh_box') (RUN_ONCE)
            - name: Testbed has Servo ('dut_servo_host_present') (RUN_ONCE)
            - name: CrosToolRunner is up ('ctr_is_up')
    - name: cros
      criticalactions:
        - name: Mark as Android based (Allow to fail) ('cros_set_as_android_based') (ALWAYS_RUN)
        - name: Set CacheService address ('cache_service_address_detection') (RUN_ONCE)
          conditions:
            - name: Execution on Mobile Harness box ('env_is_mh_box') (RUN_ONCE)
        - name: Has repair-request for re-image USB-key ('dut_has_any_repair_requests')
          recoveries:
            - name: Download stable image to USB-key (Allow to fail) ('sample_pass') (ALWAYS_RUN)
              dependencies:
                - name: Setup has servo info ('dut_servo_host_present') (RUN_ONCE)
                - name: Is servo USB key detected ('servo_usbkey_is_detected')
                  dependencies:
                    - name: Is servod running ('sample_pass') (ALWAYS_RUN)
                      dependencies:
                        - name: Setup has servo info ('dut_servo_host_present') (RUN_ONCE)
                        - name: Verify servod is responsive ('servod_echo') (ALWAYS_RUN) (time:'10s')
                          dependencies:
                            - name: Setup has servo info ('dut_servo_host_present') (RUN_ONCE)
                - name: Call servod to download image to USB-key ('servo_download_image_to_usb') (ALWAYS_RUN) (time:'50m0s')
                - name: Remove UPDATE_USBKEY_IMAGE repair-request ('dut_remove_repair_requests') (ALWAYS_RUN)
            - name: Call servod to download image to USB-key ('servo_download_image_to_usb') (ALWAYS_RUN) (time:'50m0s')
        - name: Has repair-request for reflash-firmware ('dut_has_any_repair_requests')
          recoveries:
            - name: Update FW from fw-image by servo and wait for boot ('sample_pass')
              conditions:
                - name: Can become ChromeOS-based ('dut_is_chromeos_hw') (ALWAYS_RUN)
                  dependencies:
                    - name: Do not run on Mobile Harness box ('env_is_not_mh_box') (RUN_ONCE)
                    - name: Run if not restricted to Android only ('cros_not_match_os_restriction')
                - name: Run only on ChromeOS hardware ('dut_check_board') (RUN_ONCE)
                - name: Is recovery-version has firmware image path ('has_stable_version_fw_image')
                  dependencies:
                    - name: Has a stable-version service ('has_stable_version_service_path') (RUN_ONCE)
                - name: Is servod running ('sample_pass') (ALWAYS_RUN)
                  dependencies:
                    - name: Setup has servo info ('dut_servo_host_present') (RUN_ONCE)
                    - name: Verify servod is responsive ('servod_echo') (ALWAYS_RUN) (time:'10s')
                      dependencies:
                        - name: Setup has servo info ('dut_servo_host_present') (RUN_ONCE)
              dependencies:
                - name: Flash EC (FW) by servo (allowed failed) (Allow to fail) ('cros_update_fw_with_fw_image_by_servo') (time:'1h50m0s')
                  conditions:
                    - name: Is servod running ('sample_pass') (ALWAYS_RUN)
                      dependencies:
                        - name: Setup has servo info ('dut_servo_host_present') (RUN_ONCE)
                        - name: Verify servod is responsive ('servod_echo') (ALWAYS_RUN) (time:'10s')
                          dependencies:
                            - name: Setup has servo info ('dut_servo_host_present') (RUN_ONCE)
                  dependencies:
                    - name: Is recovery-version has firmware image path ('has_stable_version_fw_image')
                      dependencies:
                        - name: Has a stable-version service ('has_stable_version_service_path') (RUN_ONCE)
                - name: Sleep 120 seconds (Allow to fail) ('sample_sleep') (ALWAYS_RUN) (time:'2m5s')
                - name: Disable software write protection via servo (Allow to fail) ('cros_disable_software_write_protection_by_servo') (ALWAYS_RUN) (time:'1m0s')
                  dependencies:
                    - name: Is servod running ('sample_pass') (ALWAYS_RUN)
                      dependencies:
                        - name: Setup has servo info ('dut_servo_host_present') (RUN_ONCE)
                        - name: Verify servod is responsive ('servod_echo') (ALWAYS_RUN) (time:'10s')
                          dependencies:
                            - name: Setup has servo info ('dut_servo_host_present') (RUN_ONCE)
                - name: Flash AP (FW) by servo with GBB (dev mode + USB boot) (Allow to fail) ('cros_update_fw_with_fw_image_by_servo') (time:'1h30m0s')
                  conditions:
                    - name: Is servod running ('sample_pass') (ALWAYS_RUN)
                      dependencies:
                        - name: Setup has servo info ('dut_servo_host_present') (RUN_ONCE)
                        - name: Verify servod is responsive ('servod_echo') (ALWAYS_RUN) (time:'10s')
                          dependencies:
                            - name: Setup has servo info ('dut_servo_host_present') (RUN_ONCE)
                  dependencies:
                    - name: Is recovery-version has firmware image path ('has_stable_version_fw_image')
                      dependencies:
                        - name: Has a stable-version service ('has_stable_version_service_path') (RUN_ONCE)
                - name: Wait to be pingable (normal boot) ('cros_ping') (ALWAYS_RUN) (time:'2m30s')
                - name: Remove REFLASH_FW repair-request ('dut_remove_repair_requests') (ALWAYS_RUN)
        - name: 'Android: Has repair-request for re-image by USB-key (''dut_has_any_repair_requests'')'
          recoveries:
            - name: Install Android OS by booting from servo USB-drive ('sample_pass') (ALWAYS_RUN)
              conditions:
                - name: Run only on ChromeOS hardware ('dut_check_board') (RUN_ONCE)
                - name: Is servod running ('sample_pass') (ALWAYS_RUN)
                  dependencies:
                    - name: Setup has servo info ('dut_servo_host_present') (RUN_ONCE)
                    - name: Verify servod is responsive ('servod_echo') (ALWAYS_RUN) (time:'10s')
                      dependencies:
                        - name: Setup has servo info ('dut_servo_host_present') (RUN_ONCE)
                - name: Is Android based by ADB or provision-info ('cros_is_previous_android_based_or_os_type') (ALWAYS_RUN)
                - name: Run for Android boards ('dut_check_board') (RUN_ONCE)
                - name: Is servo USB key detected ('servo_usbkey_is_detected')
                  dependencies:
                    - name: Is servod running ('sample_pass') (ALWAYS_RUN)
                      dependencies:
                        - name: Setup has servo info ('dut_servo_host_present') (RUN_ONCE)
                        - name: Verify servod is responsive ('servod_echo') (ALWAYS_RUN) (time:'10s')
                          dependencies:
                            - name: Setup has servo info ('dut_servo_host_present') (RUN_ONCE)
              dependencies:
                - name: Mark as Android based (Allow to fail) ('cros_set_as_android_based') (ALWAYS_RUN)
                - name: Detect CacheService address ('cache_service_address_detection')
                  conditions:
                    - name: Do not run on Mobile Harness box ('env_is_not_mh_box') (RUN_ONCE)
                - name: Call servod to download provision image to USB-key ('servo_download_provision_image_to_usb') (ALWAYS_RUN) (time:'10m0s')
                - name: Boot on USB-key and install AndroidOS ('cros_provision_actions_from_recovery_mode') (ALWAYS_RUN) (time:'2h46m40s')
                - name: Wait to be pingable (long boot) ('cros_ping') (ALWAYS_RUN) (time:'5m0s')
                - name: ADB reconnect ('ctr_adb_connect') (ALWAYS_RUN)
                  conditions:
                    - name: Is Android based on previous DUT OS ('cros_is_previous_android_os_type')
                - name: ADB set Android as always awake ('ctr_make_awake_always') (ALWAYS_RUN)
                - name: Remove REIMAGE_BY_USBKEY repair-request ('dut_remove_repair_requests') (ALWAYS_RUN)
            - name: Update FW and install Android OS from servo USB-drive ('sample_pass') (ALWAYS_RUN)
              conditions:
                - name: Run only on ChromeOS hardware ('dut_check_board') (RUN_ONCE)
                - name: Is servod running ('sample_pass') (ALWAYS_RUN)
                  dependencies:
                    - name: Setup has servo info ('dut_servo_host_present') (RUN_ONCE)
                    - name: Verify servod is responsive ('servod_echo') (ALWAYS_RUN) (time:'10s')
                      dependencies:
                        - name: Setup has servo info ('dut_servo_host_present') (RUN_ONCE)
                - name: Is Android based by ADB or provision-info ('cros_is_previous_android_based_or_os_type') (ALWAYS_RUN)
                - name: Is servo USB key detected ('servo_usbkey_is_detected')
                  dependencies:
                    - name: Is servod running ('sample_pass') (ALWAYS_RUN)
                      dependencies:
                        - name: Setup has servo info ('dut_servo_host_present') (RUN_ONCE)
                        - name: Verify servod is responsive ('servod_echo') (ALWAYS_RUN) (time:'10s')
