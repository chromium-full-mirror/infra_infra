syntax = "proto3";

package fleetcost.api.models;

option go_package = "go.chromium.org/infra/cros/fleetcost/api/models;fleetcostpb";

// Variable is a global variable stored in the cost database.
message Variable {
  string name = 1;
  double value = 2;
}
