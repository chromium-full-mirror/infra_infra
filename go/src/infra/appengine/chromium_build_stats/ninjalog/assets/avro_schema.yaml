# This is yaml format of avro schema used to store ninjalog to BigQuery.
# See https://avro.apache.org/docs/++version++/specification/ about the AVRO schema.

# This should be sync with schema in http://google3/configs/cloud/gong/services/chrome_cloud/chrome_ops_browser_build/modules/ninjalog/main.tf

type: record
name: ninjalog
fields:
  - name: build_id
    type: long
  - name: invocation_id
    type: string
  - name: user
    type: string
    default: ''
  - name: exit_code
    type: int
  - name: build_duration_sec
    type: int
  - name: targets
    type:
      type: array
      items: string
  - name: step_name
    type: string
    default: ''
  - name: jobs
    type: int
  - name: os
    type: string
  - name: cpu_core
    type: int
  - name: build_configs
    type:
      type: array
      items:
        name: build_config
        type: record
        fields:
          - name: key
            type: string
          - name: value
            type: string
          - name: explicit
            type: ["null", boolean]
            default: "null"
  - name: log_entries
    type:
      type: array
      items:
        name: log_entry
        type: record
        fields:
          - name: outputs
            type:
              type: array
              items: string
          - name: start_duration_sec
            type: double
          - name: end_duration_sec
            type: double
          - name: weighted_duration_sec
            type: double
  # This is also used for time partitioning in BQ table.
  - name: created_at
    type:
      type: long
      logicalType: timestamp-micros
