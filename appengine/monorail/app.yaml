runtime: python311

entrypoint: gunicorn -b :$PORT --timeout 60 --workers ${WORKERS} main:app

default_expiration: "10d"

automatic_scaling:
  min_idle_instances: ${MIN_IDLE_INSTANCES}
  min_instances: ${MIN_INSTANCES}
  max_instances: ${MAX_INSTANCES}
  max_pending_latency: ${MAX_PENDING_LATENCY}

# Note: this is interpreted by gae.py, it maps the app ID being deployed to
# values of ${...} vars.
# Reference: https://chromium.googlesource.com/infra/luci/luci-go/+/HEAD/examples/appengine/helloworld_v2/app.yaml

luci_gae_vars:
  monorail-dev:
    WORKERS: "2"
    MIN_IDLE_INSTANCES: "0"
    MIN_INSTANCES: "0"
    MAX_INSTANCES: "2"
    MAX_PENDING_LATENCY: "automatic"
  monorail-staging:
    WORKERS: "2"
    MIN_IDLE_INSTANCES: "0"
    MIN_INSTANCES: "0"
    MAX_INSTANCES: "5"
    MAX_PENDING_LATENCY: "automatic"
  monorail-prod:
    WORKERS: "2"
    MIN_IDLE_INSTANCES: "1"
    MIN_INSTANCES: "2"
    MAX_INSTANCES: "10"
    MAX_PENDING_LATENCY: "0.2s"

handlers:
- url: /.*
  script: main.app
  secure: always
