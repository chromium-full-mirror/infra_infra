package: infra/fleet/findswarm/${platform}
description: CLI tool for finding bot names across multiple swarming instances.
platforms:
  - linux-amd64
  - linux-arm64
  - mac-amd64
  - mac-arm64
  - windows-amd64
  - windows-arm64
go_packages:
  - go.chromium.org/infra/fleet/findswarm
root: ../../go/bin
data:
  - file: findswarm${exe_suffix}
  - version_file: .versions/findswarm${exe_suffix}.cipd_version
