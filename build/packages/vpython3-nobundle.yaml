# This file is for platforms where we do not have a cpython package to bundle.
package: infra/tools/luci/vpython3/${platform}
description: vpython3 is a VirtualEnv Python3 bootstrap tool.
platforms:
  - aix-ppc64
  - dragonfly-amd64
  - freebsd-amd64
  - freebsd-arm64
  - freebsd-armv7l
  - freebsd-riscv64
  - illumos-amd64
  - linux-386
  - linux-loong64
  - linux-mips
  - linux-mips64
  - linux-mips64le
  - linux-mipsle
  - linux-ppc64
  - linux-ppc64le
  - linux-s390x
  - netbsd-amd64
  - netbsd-arm64
  - netbsd-armv7l
  - openbsd-amd64
  - openbsd-arm64
  - openbsd-armv7l
  - openbsd-ppc64
  - openbsd-riscv64
  - solaris-amd64
go_packages:
  - go.chromium.org/infra/tools/vpython/cmd/vpython3
root: ../../go/bin
data:
  - file: vpython3${exe_suffix}
    generate_bat_shim: true
  - version_file: .versions/vpython3${exe_suffix}.cipd_version
